<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>ぽよぽよ</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#67ceff}iframe{display:block;width:100%;height:100%;border:0}</style></head><body><iframe id="game" src="poyopoyo-v5.html?v=20260825-2245" title="ぽよぽよ"></iframe><script>(()=>{const f=document.getElementById('game');async function loadPoyona(d){const hero=d.querySelector('.hero'),img=d.querySelector('.heroImg');if(!hero||!img)return;hero.style.height='292px';const row=d.querySelector('.gameRow');if(row)row.style.gridTemplateColumns='minmax(0,1fr) 122px';img.style.opacity='0';img.style.objectPosition='50% 18%';img.style.transition='opacity .18s ease,filter .18s';try{const parts=await Promise.all([1,2,3].map(n=>fetch(`assets/poyona-chunk${n}.txt?v=20260825-2245`,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('chunk '+n);return r.text()})));const src='data:image/jpeg;base64,'+parts.join('').replace(/\s+/g,'');const test=new Image();test.onload=()=>{img.onload=()=>{img.style.opacity='1'};img.src=src};test.onerror=()=>{const b=d.getElementById('bubble');if(b)b.textContent='画像エラー';};test.src=src;}catch(e){const b=d.getElementById('bubble');if(b)b.textContent='画像読込エラー';console.error(e)}}f.addEventListener('load',()=>{try{const d=f.contentDocument;if(d)loadPoyona(d)}catch(e){console.error(e)}})})();</script></body></html>
