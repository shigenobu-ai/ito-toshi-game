<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>生命ゲーム 観察記録</title><style>*{box-sizing:border-box}body{margin:0;background:#081018;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;padding:max(12px,env(safe-area-inset-top)) 12px max(18px,env(safe-area-inset-bottom))}.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}.back{font-size:25px;color:#d7e2ec;text-decoration:none;padding:2px 8px}.title{font-size:20px;font-weight:900}.sub{font-size:11px;color:#7f92a5}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:12px}.card,.panel{background:#111b25;border:1px solid #ffffff14;border-radius:14px}.card{padding:11px 5px;text-align:center}.card b{display:block;font-size:17px}.card span{font-size:8px;color:#8799aa}.panel{padding:12px;margin-bottom:12px}.panel h2{font-size:13px;margin:0 0 10px}.chart{height:210px;background:#0b141d;border-radius:10px;overflow:hidden}.chart canvas{width:100%;height:100%;display:block}.runs,.worlds{display:flex;gap:7px;overflow-x:auto;padding-bottom:2px}.run,.worldBtn{flex:0 0 auto;border:1px solid #ffffff18;background:#172431;color:#dce6ee;border-radius:10px;padding:8px 10px;font-size:10px}.run.active,.worldBtn.active{background:#274b63}.worldBtn b{display:block;font-size:13px;margin-bottom:3px}.result{font-size:22px;font-weight:900;margin:2px 0 12px}.rows{display:grid;gap:6px}.row{display:grid;grid-template-columns:65px 1fr 1fr 1fr;gap:7px;padding:8px 9px;border-radius:9px;background:#0d161f;font-size:10px}.muted{color:#8295a7}.empty{padding:28px 8px;text-align:center;color:#8193a5;font-size:12px}.refresh{margin-left:auto;border:1px solid #ffffff18;background:#172431;color:#fff;border-radius:9px;padding:7px 10px;font-size:11px}@media(min-width:700px){body{max-width:760px;margin:auto}}</style></head><body><div class="top"><a class="back" href="life.html">‹</a><div><div class="title">生命世界の観察記録</div><div class="sub">最新3回のプレイから生まれた世界</div></div><button class="refresh" id="refresh">更新</button></div><div class="cards"><div class="card"><b id="worldN">0</b><span>世界数</span></div><div class="card"><b id="maxGen">0</b><span>最大世代</span></div><div class="card"><b id="maxPop">0</b><span>最大生命数</span></div><div class="card"><b id="worldTime">0:00</b><span>世界の時間</span></div></div><div class="panel"><h2>プレイ記録</h2><div class="runs" id="runs"></div></div><div class="panel"><h2>生命世界</h2><div class="worlds" id="worlds"></div></div><div class="panel"><h2>今回の結末</h2><div class="result" id="result">—</div><div class="muted" id="summary"></div></div><div class="panel"><h2>生命数の推移</h2><div class="chart"><canvas id="chart"></canvas></div></div><div class="panel"><h2>世界の記録</h2><div class="rows" id="rows"></div></div><script>
const RECORD_API='https://heeigtgfvtsowlqttrio.supabase.co/functions/v1/game-records?game=life';let data=[],selectedRun=null,selectedTrial=null;
function fmtTime(sec){sec=Math.max(0,Number(sec)||0);const h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),s=Math.floor(sec%60);return h?`${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`:`${m}:${String(s).padStart(2,'0')}`}
function stateIcon(s){return s==='絶滅'?'☠️':s==='安定'?'🧊':s==='振動'?'🔄':'🌱'}
async function load(){document.getElementById('rows').innerHTML='<div class="empty">読み込み中…</div>';try{const r=await fetch(RECORD_API);if(!r.ok)throw new Error(`${r.status} ${await r.text()}`);data=await r.json();render()}catch(e){console.error(e);document.getElementById('rows').innerHTML='<div class="empty">記録を読み込めませんでした</div>'}}
function completedRuns(){const m=new Map();for(const d of data){if(!m.has(d.run_id))m.set(d.run_id,[]);m.get(d.run_id).push(d)}const out=[];for(const [id,a] of m){a.sort((x,y)=>new Date(x.created_at)-new Date(y.created_at));const final=[...a].reverse().find(x=>x.is_final);if(final)out.push([id,a,final])}out.sort((a,b)=>new Date(b[2].ended_at||b[2].created_at)-new Date(a[2].ended_at||a[2].created_at));return out.slice(0,3)}
function trials(a){const m=new Map();for(const d of a){const n=Number(d.trial_index)||1;if(!m.has(n))m.set(n,[]);m.get(n).push(d)}return [...m.entries()].sort((a,b)=>a[0]-b[0]).map(([n,x])=>{x.sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));const final=[...x].reverse().find(v=>v.trial_is_final)||x[x.length-1];return[n,x,final]})}
function render(){const groups=completedRuns(),all=groups.flatMap(g=>g[1]);if(!groups.length){document.getElementById('worldN').textContent=0;document.getElementById('runs').innerHTML='<span class="muted">まだ完了記録がありません</span>';document.getElementById('worlds').innerHTML='';document.getElementById('result').textContent='—';document.getElementById('summary').textContent='ゲームを遊ぶと、ここに生命世界の結末が残ります';document.getElementById('rows').innerHTML='<div class="empty">観察記録なし</div>';draw([]);return}if(!selectedRun||!groups.some(g=>g[0]===selectedRun))selectedRun=groups[0][0];document.getElementById('runs').innerHTML=groups.map(([id,a,final],i)=>{const dt=new Date(final.ended_at||final.created_at).toLocaleString('ja-JP',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});return `<button class="run ${id===selectedRun?'active':''}" data-id="${id}">#${groups.length-i} ${dt}<br>${fmtTime(final.elapsed_seconds)}</button>`}).join('');document.querySelectorAll('.run').forEach(b=>b.onclick=()=>{selectedRun=b.dataset.id;selectedTrial=null;render()});const [,runRows]=groups.find(g=>g[0]===selectedRun),ts=trials(runRows);if(!selectedTrial||!ts.some(t=>String(t[0])===String(selectedTrial)))selectedTrial=String(ts[0][0]);document.getElementById('worldN').textContent=ts.length;document.getElementById('maxGen').textContent=all.length?Math.max(...all.map(x=>Number(x.generation)||0)):0;document.getElementById('maxPop').textContent=all.length?Math.max(...all.map(x=>Number(x.max_population)||Number(x.total_population)||0)):0;document.getElementById('worlds').innerHTML=ts.map(([n,a,f])=>`<button class="worldBtn ${String(n)===String(selectedTrial)?'active':''}" data-trial="${n}"><b>第${n}世界</b>${stateIcon(f.end_state)} ${f.end_state||'活動中'}<br>${f.generation}世代</button>`).join('');document.querySelectorAll('.worldBtn').forEach(b=>b.onclick=()=>{selectedTrial=b.dataset.trial;render()});const [,a,f]=ts.find(t=>String(t[0])===String(selectedTrial));const maxP=Math.max(...a.map(v=>Number(v.max_population)||Number(v.total_population)||0),0),maxG=Number(f.max_population_generation)||0;document.getElementById('worldTime').textContent=fmtTime(f.trial_elapsed_seconds);document.getElementById('result').textContent=`${stateIcon(f.end_state)} ${f.end_state||'活動中'}`;document.getElementById('summary').textContent=`第${selectedTrial}世界・${f.generation}世代 / 最大 ${maxP}生命（${maxG}世代） / 最終 ${f.total_population}生命`;document.getElementById('rows').innerHTML=[...a].reverse().map(d=>`<div class="row"><b>${d.generation}世代</b><span>生命 ${d.total_population}</span><span>${fmtTime(d.trial_elapsed_seconds)}</span><span class="muted">${d.trial_is_final?'結末':'観察'}</span></div>`).join('');draw(a)}
function draw(a){const c=document.getElementById('chart'),r=c.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2);c.width=Math.max(1,r.width*dpr);c.height=Math.max(1,r.height*dpr);const x=c.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);const w=r.width,h=r.height,p=28;x.fillStyle='#0b141d';x.fillRect(0,0,w,h);if(a.length<2){x.fillStyle='#8193a5';x.font='12px sans-serif';x.textAlign='center';x.fillText(a.length?'記録が増えるとグラフになります':'記録なし',w/2,h/2);return}const t0=Math.min(...a.map(v=>Number(v.trial_elapsed_seconds)||0)),maxT=Math.max(...a.map(v=>Number(v.trial_elapsed_seconds)||0),t0+1),maxP=Math.max(...a.map(v=>v.total_population),1);x.strokeStyle='#314252';x.lineWidth=1;x.beginPath();x.moveTo(p,8);x.lineTo(p,h-p);x.lineTo(w-8,h-p);x.stroke();x.strokeStyle='#77f59b';x.lineWidth=2;x.beginPath();a.forEach((v,i)=>{const px=p+(w-p-10)*(((Number(v.trial_elapsed_seconds)||0)-t0)/(maxT-t0)),py=8+(h-p-10)*(1-v.total_population/maxP);i?x.lineTo(px,py):x.moveTo(px,py)});x.stroke();x.fillStyle='#8193a5';x.font='9px sans-serif';x.textAlign='left';x.fillText(`MAX ${maxP}`,p+4,14);x.textAlign='right';x.fillText(fmtTime(maxT),w-8,h-8)}
document.getElementById('refresh').onclick=load;addEventListener('resize',()=>render());load();
</script></body></html>
