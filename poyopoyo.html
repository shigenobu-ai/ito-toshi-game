<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>ぽよぽよ</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}html,body{margin:0;min-height:100%;background:#10151d;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;overscroll-behavior:none}body{display:flex;justify-content:center;padding:max(14px,env(safe-area-inset-top)) 12px max(16px,env(safe-area-inset-bottom));touch-action:none}.wrap{width:min(430px,100%);display:flex;flex-direction:column;gap:10px}.top{display:flex;align-items:center;justify-content:space-between}.title{font-size:22px;font-weight:900}.score{background:#0007;padding:8px 13px;border-radius:15px;text-align:right}.score b{font-size:20px}.score small{display:block;color:#cbd3dc}.stage{position:relative;width:min(330px,82vw);aspect-ratio:6/12;margin:auto;background:#0c1118;border:2px solid #ffffff24;border-radius:18px;overflow:hidden;box-shadow:0 10px 30px #0008}canvas{display:block;width:100%;height:100%}.chain{position:absolute;inset:42% 0 auto;text-align:center;font-size:34px;font-weight:1000;text-shadow:0 3px 12px #000;pointer-events:none;opacity:0;transform:scale(.7)}.chain.show{animation:pop .55s ease}@keyframes pop{0%{opacity:0;transform:scale(.5)}30%{opacity:1;transform:scale(1.15)}100%{opacity:0;transform:scale(1)}}.controls{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px}.controls button,.home,.overlay button{border:0;border-radius:16px;padding:15px 8px;font-size:22px;font-weight:900;background:#253142;color:#fff;touch-action:manipulation}.controls button:active{transform:scale(.96);background:#34445a}.home{display:block;text-align:center;text-decoration:none;font-size:14px;padding:11px;background:#1c2531}.hint{text-align:center;color:#aeb9c7;font-size:12px}.overlay{position:fixed;inset:0;background:#10151de8;backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:24px;z-index:5}.card{width:min(360px,100%);background:#1b2330;border:1px solid #ffffff18;border-radius:26px;padding:26px;text-align:center}.card h1{font-size:42px;margin:0 0 8px}.card p{color:#c8d0db;line-height:1.7}.card button{width:100%;font-size:18px;background:#fff;color:#111}.card a{margin-top:10px}</style></head><body><div class="wrap"><div class="top"><div class="title">🟢 ぽよぽよ</div><div class="score"><b id="score">0</b><small id="status">0連鎖</small></div></div><div class="stage"><canvas id="game" width="300" height="600"></canvas><div id="chain" class="chain"></div></div><div class="controls"><button data-act="left">←</button><button data-act="rotate">↻</button><button data-act="right">→</button><button data-act="down">↓</button></div><div class="hint">左右で移動・↻で回転・↓で素早く落下</div><a class="home" href="./">ミニゲームパックへ戻る</a></div><div id="overlay" class="overlay"><div class="card"><h1>ぽよぽよ</h1><p>2個1組の「ぽよ」を落として、<strong>同じ色を4個以上</strong>つなげると消えます。<br>連続で消すと連鎖ボーナス！</p><button id="start">スタート</button><a class="home" href="./">ミニゲームパックへ戻る</a></div></div><script>(()=>{const C=6,R=12,S=50,canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),scoreEl=document.getElementById('score'),statusEl=document.getElementById('status'),chainEl=document.getElementById('chain'),overlay=document.getElementById('overlay');const colors=['#ff4d68','#45d66f','#5aa9ff','#ffd34d'];let board,active,score=0,running=false,last=0,acc=0,dropMs=620,raf=0,resolving=false;function empty(){return Array.from({length:R},()=>Array(C).fill(null))}function rnd(){return Math.floor(Math.random()*colors.length)}function newPair(){active={x:2,y:0,a:rnd(),b:rnd(),rot:0};if(!can(active.x,active.y,active.rot)){end();return false}return true}function cells(x=active.x,y=active.y,rot=active.rot){const d=[[0,-1],[1,0],[0,1],[-1,0]][rot];return[{x,y,c:active.a},{x:x+d[0],y:y+d[1],c:active.b}]}function can(x,y,rot){return cells(x,y,rot).every(p=>p.x>=0&&p.x<C&&p.y<R&&(p.y<0||!board[p.y][p.x]))}function move(dx,dy){if(!running||resolving)return;if(can(active.x+dx,active.y+dy,active.rot)){active.x+=dx;active.y+=dy;draw();return true}if(dy>0)lock();return false}function rotate(){if(!running||resolving)return;const nr=(active.rot+1)%4;if(can(active.x,active.y,nr))active.rot=nr;else if(can(active.x-1,active.y,nr)){active.x--;active.rot=nr}else if(can(active.x+1,active.y,nr)){active.x++;active.rot=nr}draw()}function lock(){for(const p of cells()){if(p.y<0){end();return}board[p.y][p.x]=p.c}resolve()}function groups(){const seen=Array.from({length:R},()=>Array(C).fill(false)),out=[];for(let y=0;y<R;y++)for(let x=0;x<C;x++){if(board[y][x]==null||seen[y][x])continue;const color=board[y][x],q=[[x,y]],g=[];seen[y][x]=true;while(q.length){const [cx,cy]=q.pop();g.push([cx,cy]);for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=cx+dx,ny=cy+dy;if(nx>=0&&nx<C&&ny>=0&&ny<R&&!seen[ny][nx]&&board[ny][nx]===color){seen[ny][nx]=true;q.push([nx,ny])}}}if(g.length>=4)out.push(g)}return out}function gravity(){for(let x=0;x<C;x++){let w=R-1;for(let y=R-1;y>=0;y--)if(board[y][x]!=null){board[w][x]=board[y][x];if(w!==y)board[y][x]=null;w--}while(w>=0)board[w--][x]=null}}function showChain(n){chainEl.textContent=n+'連鎖！';chainEl.classList.remove('show');void chainEl.offsetWidth;chainEl.classList.add('show');statusEl.textContent=n+'連鎖'}async function resolve(){resolving=true;let chain=0;while(true){const gs=groups();if(!gs.length)break;chain++;let removed=0;for(const g of gs)for(const [x,y] of g){board[y][x]=null;removed++}score+=removed*10*chain;scoreEl.textContent=score;showChain(chain);draw();navigator.vibrate?.(25);await new Promise(r=>setTimeout(r,230));gravity();draw();await new Promise(r=>setTimeout(r,130))}if(chain===0)statusEl.textContent='0連鎖';resolving=false;if(running)newPair();draw()}function start(){board=empty();score=0;scoreEl.textContent='0';statusEl.textContent='0連鎖';dropMs=620;running=true;resolving=false;overlay.style.display='none';newPair();last=performance.now();acc=0;cancelAnimationFrame(raf);raf=requestAnimationFrame(loop);draw()}function end(){running=false;resolving=false;cancelAnimationFrame(raf);const best=Math.max(score,Number(localStorage.getItem('poyopoyo-best')||0));localStorage.setItem('poyopoyo-best',best);overlay.innerHTML=`<div class="card"><h1>${score}点</h1><p>ゲームオーバー<br>ベスト <strong>${best}点</strong></p><button id="again">もう一回</button><a class="home" href="./">ミニゲームパックへ戻る</a></div>`;overlay.style.display='flex';document.getElementById('again').onclick=start}function loop(t){if(!running)return;const dt=t-last;last=t;if(!resolving){acc+=dt;if(acc>=dropMs){acc=0;move(0,1)}}raf=requestAnimationFrame(loop)}function circle(x,y,c,ghost=false){if(y<0)return;const cx=x*S+S/2,cy=y*S+S/2,r=S*.41;ctx.save();ctx.globalAlpha=ghost?.28:1;ctx.fillStyle=colors[c];ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff9';ctx.beginPath();ctx.arc(cx-r*.28,cy-r*.3,r*.17,0,Math.PI*2);ctx.fill();ctx.fillStyle='#0005';ctx.beginPath();ctx.arc(cx-r*.15,cy+r*.08,r*.07,0,Math.PI*2);ctx.arc(cx+r*.15,cy+r*.08,r*.07,0,Math.PI*2);ctx.fill();ctx.restore()}function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);const g=ctx.createLinearGradient(0,0,0,600);g.addColorStop(0,'#162536');g.addColorStop(1,'#0b1119');ctx.fillStyle=g;ctx.fillRect(0,0,300,600);ctx.strokeStyle='#ffffff09';for(let x=1;x<C;x++){ctx.beginPath();ctx.moveTo(x*S,0);ctx.lineTo(x*S,600);ctx.stroke()}for(let y=1;y<R;y++){ctx.beginPath();ctx.moveTo(0,y*S);ctx.lineTo(300,y*S);ctx.stroke()}for(let y=0;y<R;y++)for(let x=0;x<C;x++)if(board?.[y]?.[x]!=null)circle(x,y,board[y][x]);if(active&&running&&!resolving){let gy=active.y;while(can(active.x,gy+1,active.rot))gy++;for(const p of cells(active.x,gy,active.rot))circle(p.x,p.y,p.c,true);for(const p of cells())circle(p.x,p.y,p.c)}}function act(a){if(a==='left')move(-1,0);if(a==='right')move(1,0);if(a==='rotate')rotate();if(a==='down')move(0,1)}document.querySelectorAll('[data-act]').forEach(b=>{const a=b.dataset.act;b.addEventListener('pointerdown',e=>{e.preventDefault();act(a)});b.addEventListener('click',e=>e.preventDefault())});document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')act('left');if(e.key==='ArrowRight')act('right');if(e.key==='ArrowDown')act('down');if(e.key==='ArrowUp'||e.key===' ')act('rotate')});document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});document.getElementById('start').onclick=start;board=empty();draw()})();</script></body></html>
