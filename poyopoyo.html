<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>ぽよぽよ</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;color:#fff;background:linear-gradient(180deg,#63c9ff 0%,#8b77ff 48%,#4937a8 100%);overscroll-behavior:none}
body{padding:max(10px,env(safe-area-inset-top)) 10px max(12px,env(safe-area-inset-bottom));touch-action:manipulation}
.wrap{width:min(440px,100%);margin:0 auto;display:flex;flex-direction:column;gap:9px}
.header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:2px 3px}
.logo{font-size:27px;font-weight:1000;letter-spacing:-1px;text-shadow:0 3px 0 #51339b,0 5px 10px #25185d88}.logo span:nth-child(1){color:#ff5778}.logo span:nth-child(2){color:#ffd842}.logo span:nth-child(3){color:#55e17d}.logo span:nth-child(4){color:#65cfff}.logo span:nth-child(5){color:#ff8ed8}
.scorebox{min-width:116px;border:3px solid #fff;background:#31216dcc;border-radius:18px;padding:6px 12px;text-align:right;box-shadow:0 4px 0 #211553}.scorebox small{display:block;font-size:10px;color:#dcd8ff;font-weight:800}.scorebox b{font-size:22px;line-height:1;font-variant-numeric:tabular-nums}
.gameRow{display:grid;grid-template-columns:minmax(0,1fr) 88px;gap:8px;align-items:start}
.stageShell{position:relative;padding:7px;background:linear-gradient(180deg,#efeaff,#b9abff);border:4px solid #fff;border-radius:24px;box-shadow:0 7px 0 #35216f,0 12px 20px #24155866;overflow:hidden}
.stage{position:relative;width:100%;aspect-ratio:6/12;background:linear-gradient(180deg,#17184b,#080a2d);border-radius:15px;overflow:hidden;border:3px solid #6555bd;touch-action:none}
canvas{display:block;width:100%;height:100%;touch-action:none}
.chain{position:absolute;left:0;right:0;top:42%;text-align:center;font-size:34px;font-weight:1000;color:#fff76a;text-shadow:0 3px 0 #f05b74,0 6px 12px #000;pointer-events:none;opacity:0}.chain.show{animation:chainPop .65s ease}@keyframes chainPop{0%{opacity:0;transform:scale(.45) rotate(-8deg)}25%{opacity:1;transform:scale(1.2) rotate(4deg)}70%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.1)}}
.side{display:flex;flex-direction:column;gap:8px}.panel{border:3px solid #fff;border-radius:18px;background:#332274dd;padding:8px;text-align:center;box-shadow:0 5px 0 #241553}.panelTitle{font-size:11px;font-weight:900;color:#d9d4ff;margin-bottom:5px}.nextCanvas{width:66px;height:94px;display:block;margin:auto;background:#171747;border-radius:12px;border:2px solid #6f62c6}.chainStat{font-size:12px;font-weight:900}.chainStat strong{display:block;font-size:22px;color:#fff56d}
.controls{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.controls button{height:58px;border:3px solid #fff;border-radius:18px;background:linear-gradient(180deg,#fff,#dce7ff);color:#3b2a78;font-size:27px;font-weight:1000;box-shadow:0 5px 0 #503b9c;touch-action:none}.controls button:active,.controls button.pressed{transform:translateY(3px);box-shadow:0 2px 0 #503b9c;background:#fff7a7}.controls .wide{grid-column:span 2;font-size:17px}.controls .drop{font-size:17px;background:linear-gradient(180deg,#fff9ad,#ffd95f)}
.hint{text-align:center;font-size:11px;font-weight:700;color:#eef0ff;text-shadow:0 1px 3px #32206f}.home{display:block;text-align:center;text-decoration:none;color:#fff;background:#30206caa;border:2px solid #ffffff80;border-radius:15px;padding:10px;font-size:13px;font-weight:900}
.overlay{position:fixed;inset:0;background:#34216eea;backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;padding:24px;z-index:10}.card{width:min(360px,100%);background:linear-gradient(180deg,#7164d7,#3a276f);border:4px solid #fff;border-radius:28px;padding:24px;text-align:center;box-shadow:0 10px 30px #160c42}.card h1{font-size:45px;margin:0 0 7px;color:#fff46e;text-shadow:0 4px 0 #d75391}.card p{line-height:1.75;color:#f2efff}.card button{width:100%;border:0;border-radius:18px;padding:15px;font-size:19px;font-weight:1000;color:#43307f;background:#fff56e;box-shadow:0 5px 0 #d6a91d;touch-action:manipulation}.card .home{margin-top:12px}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div class="logo" aria-label="ぽよぽよ"><span>ぽ</span><span>よ</span><span>ぽ</span><span>よ</span><span>！</span></div>
    <div class="scorebox"><small>SCORE</small><b id="score">0</b></div>
  </div>
  <div class="gameRow">
    <div class="stageShell"><div class="stage" id="stage"><canvas id="game" width="300" height="600"></canvas><div id="chain" class="chain"></div></div></div>
    <div class="side">
      <div class="panel"><div class="panelTitle">NEXT</div><canvas id="next" class="nextCanvas" width="66" height="94"></canvas></div>
      <div class="panel chainStat"><span>CHAIN</span><strong id="chainCount">0</strong></div>
    </div>
  </div>
  <div class="controls">
    <button type="button" data-act="left" aria-label="左へ">◀</button>
    <button type="button" data-act="rotate" aria-label="回転">↻</button>
    <button type="button" data-act="right" aria-label="右へ">▶</button>
    <button type="button" class="wide" data-act="down">▼ はやく落とす</button>
    <button type="button" class="drop" data-act="hard">一気に落下</button>
  </div>
  <div class="hint">ボタン操作 / 盤面を左右スワイプ / 盤面タップで回転</div>
  <a class="home" href="./">ミニゲームパックへ戻る</a>
</div>
<div id="overlay" class="overlay"><div class="card"><h1>ぽよぽよ</h1><p>2個1組の「ぽよ」を動かして、<strong>同じ色を4個以上</strong>つなげて消そう。<br>連鎖するとスコアがぐんぐん伸びます。</p><button id="start" type="button">スタート！</button><a class="home" href="./">ミニゲームパックへ戻る</a></div></div>
<script>
(()=>{
const C=6,R=12,S=50;
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const nextCanvas=document.getElementById('next'),nctx=nextCanvas.getContext('2d');
const scoreEl=document.getElementById('score'),chainEl=document.getElementById('chain'),chainCount=document.getElementById('chainCount'),overlay=document.getElementById('overlay'),stage=document.getElementById('stage');
const colors=['#f24f70','#55d76f','#4ca9f5','#ffd748','#b86af2'];
let board,active,nextPair,score=0,running=false,last=0,acc=0,dropMs=650,raf=0,resolving=false,gesture=null;
function empty(){return Array.from({length:R},()=>Array(C).fill(null))}
function rnd(){return Math.floor(Math.random()*colors.length)}
function makePair(){return{a:rnd(),b:rnd()}}
function cellsOf(x,y,rot,pair=active){const d=[[0,-1],[1,0],[0,1],[-1,0]][rot];return[{x,y,c:pair.a},{x:x+d[0],y:y+d[1],c:pair.b}]}
function canAt(x,y,rot){return cellsOf(x,y,rot).every(p=>p.x>=0&&p.x<C&&p.y<R&&(p.y<0||board[p.y][p.x]==null))}
function spawn(){const p=nextPair||makePair();nextPair=makePair();active={x:2,y:1,rot:0,a:p.a,b:p.b};drawNext();if(!canAt(active.x,active.y,active.rot)){end();return false}return true}
function move(dx,dy){if(!running||resolving||!active)return false;if(canAt(active.x+dx,active.y+dy,active.rot)){active.x+=dx;active.y+=dy;acc=0;draw();return true}if(dy>0)lock();return false}
function rotate(){if(!running||resolving||!active)return;const nr=(active.rot+1)%4;const kicks=[0,-1,1,-2,2];for(const k of kicks){if(canAt(active.x+k,active.y,nr)){active.x+=k;active.rot=nr;acc=0;draw();return}}}
function hardDrop(){if(!running||resolving||!active)return;while(canAt(active.x,active.y+1,active.rot))active.y++;draw();lock()}
function lock(){if(!active)return;for(const p of cellsOf(active.x,active.y,active.rot)){if(p.y<0){end();return}board[p.y][p.x]=p.c}active=null;resolve()}
function findGroups(){const seen=Array.from({length:R},()=>Array(C).fill(false)),out=[];for(let y=0;y<R;y++)for(let x=0;x<C;x++){if(board[y][x]==null||seen[y][x])continue;const color=board[y][x],q=[[x,y]],g=[];seen[y][x]=true;while(q.length){const [cx,cy]=q.pop();g.push([cx,cy]);for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=cx+dx,ny=cy+dy;if(nx>=0&&nx<C&&ny>=0&&ny<R&&!seen[ny][nx]&&board[ny][nx]===color){seen[ny][nx]=true;q.push([nx,ny])}}}if(g.length>=4)out.push(g)}return out}
function applyGravity(){for(let x=0;x<C;x++){let w=R-1;for(let y=R-1;y>=0;y--){if(board[y][x]!=null){const v=board[y][x];board[y][x]=null;board[w][x]=v;w--}}}}
function showChain(n){chainCount.textContent=n;chainEl.textContent=n+'れんさ！';chainEl.classList.remove('show');void chainEl.offsetWidth;chainEl.classList.add('show')}
function sleep(ms){return new Promise(r=>setTimeout(r,ms))}
async function resolve(){resolving=true;let chain=0;while(running){const gs=findGroups();if(!gs.length)break;chain++;let removed=0;showChain(chain);await sleep(140);for(const g of gs)for(const [x,y] of g){board[y][x]=null;removed++}score+=removed*10*chain*chain;scoreEl.textContent=score;draw();navigator.vibrate?.(20);await sleep(170);applyGravity();draw();await sleep(150)}resolving=false;if(running){spawn();draw()}}
function start(){board=empty();active=null;nextPair=makePair();score=0;scoreEl.textContent='0';chainCount.textContent='0';dropMs=650;running=true;resolving=false;overlay.style.display='none';spawn();last=performance.now();acc=0;cancelAnimationFrame(raf);raf=requestAnimationFrame(loop);draw()}
function end(){running=false;resolving=false;cancelAnimationFrame(raf);const best=Math.max(score,Number(localStorage.getItem('poyopoyo-best')||0));localStorage.setItem('poyopoyo-best',best);overlay.innerHTML=`<div class="card"><h1>${score}点</h1><p>ゲームオーバー<br>ベスト <strong>${best}点</strong></p><button id="again" type="button">もう一回！</button><a class="home" href="./">ミニゲームパックへ戻る</a></div>`;overlay.style.display='flex';document.getElementById('again').addEventListener('click',start)}
function loop(t){if(!running)return;const dt=Math.min(100,t-last);last=t;if(!resolving&&active){acc+=dt;if(acc>=dropMs){acc=0;move(0,1)}}raf=requestAnimationFrame(loop)}
function drawPoyo(context,cx,cy,r,colorIndex,alpha=1){context.save();context.globalAlpha=alpha;const grad=context.createRadialGradient(cx-r*.35,cy-r*.45,r*.1,cx,cy,r);grad.addColorStop(0,'#fff');grad.addColorStop(.18,colors[colorIndex]);grad.addColorStop(1,shade(colors[colorIndex],-.28));context.fillStyle=grad;context.beginPath();context.arc(cx,cy,r,0,Math.PI*2);context.fill();context.strokeStyle='#ffffffcc';context.lineWidth=Math.max(1.5,r*.07);context.stroke();const eyeY=cy-r*.03;context.fillStyle='#fff';for(const ex of [cx-r*.22,cx+r*.22]){context.beginPath();context.ellipse(ex,eyeY,r*.15,r*.2,0,0,Math.PI*2);context.fill()}context.fillStyle='#20204d';for(const ex of [cx-r*.20,cx+r*.20]){context.beginPath();context.arc(ex,eyeY+r*.03,r*.065,0,Math.PI*2);context.fill()}context.strokeStyle='#622c68';context.lineWidth=Math.max(1.2,r*.045);context.lineCap='round';context.beginPath();context.arc(cx,cy+r*.25,r*.13,.15*Math.PI,.85*Math.PI);context.stroke();context.restore()}
function shade(hex,amt){let n=parseInt(hex.slice(1),16),r=(n>>16)+Math.round(255*amt),g=((n>>8)&255)+Math.round(255*amt),b=(n&255)+Math.round(255*amt);return'#'+[r,g,b].map(v=>Math.max(0,Math.min(255,v)).toString(16).padStart(2,'0')).join('')}
function draw(){ctx.clearRect(0,0,300,600);const bg=ctx.createLinearGradient(0,0,0,600);bg.addColorStop(0,'#20215d');bg.addColorStop(1,'#090b31');ctx.fillStyle=bg;ctx.fillRect(0,0,300,600);ctx.strokeStyle='#ffffff0d';ctx.lineWidth=1;for(let x=1;x<C;x++){ctx.beginPath();ctx.moveTo(x*S,0);ctx.lineTo(x*S,600);ctx.stroke()}for(let y=1;y<R;y++){ctx.beginPath();ctx.moveTo(0,y*S);ctx.lineTo(300,y*S);ctx.stroke()}for(let y=0;y<R;y++)for(let x=0;x<C;x++)if(board?.[y]?.[x]!=null)drawPoyo(ctx,x*S+25,y*S+25,21,board[y][x]);if(active&&running&&!resolving){let gy=active.y;while(canAt(active.x,gy+1,active.rot))gy++;for(const p of cellsOf(active.x,gy,active.rot))if(p.y>=0)drawPoyo(ctx,p.x*S+25,p.y*S+25,19,p.c,.18);for(const p of cellsOf(active.x,active.y,active.rot))if(p.y>=0)drawPoyo(ctx,p.x*S+25,p.y*S+25,21,p.c)}}
function drawNext(){nctx.clearRect(0,0,66,94);const p=nextPair;if(!p)return;drawPoyo(nctx,33,28,18,p.a);drawPoyo(nctx,33,65,18,p.b)}
function act(a){if(a==='left')move(-1,0);else if(a==='right')move(1,0);else if(a==='rotate')rotate();else if(a==='down')move(0,1);else if(a==='hard')hardDrop()}
const buttons=[...document.querySelectorAll('[data-act]')];
buttons.forEach(btn=>{let timer=null,repeat=null;const fire=e=>{e.preventDefault();btn.classList.add('pressed');act(btn.dataset.act);if(['left','right','down'].includes(btn.dataset.act)){timer=setTimeout(()=>{repeat=setInterval(()=>act(btn.dataset.act),85)},230)}};const stop=e=>{e?.preventDefault?.();btn.classList.remove('pressed');clearTimeout(timer);clearInterval(repeat);timer=repeat=null};btn.addEventListener('pointerdown',fire,{passive:false});btn.addEventListener('pointerup',stop,{passive:false});btn.addEventListener('pointercancel',stop,{passive:false});btn.addEventListener('pointerleave',stop,{passive:false});btn.addEventListener('touchstart',e=>{if(!window.PointerEvent)fire(e)},{passive:false});btn.addEventListener('touchend',e=>{if(!window.PointerEvent)stop(e)},{passive:false});btn.addEventListener('click',e=>{e.preventDefault();if(e.detail===0)act(btn.dataset.act)})});
stage.addEventListener('pointerdown',e=>{if(!running)return;gesture={x:e.clientX,y:e.clientY,t:Date.now()};stage.setPointerCapture?.(e.pointerId);e.preventDefault()},{passive:false});
stage.addEventListener('pointerup',e=>{if(!gesture||!running)return;const dx=e.clientX-gesture.x,dy=e.clientY-gesture.y,dt=Date.now()-gesture.t;gesture=null;if(Math.abs(dx)>35&&Math.abs(dx)>Math.abs(dy)){act(dx<0?'left':'right')}else if(dy>45){act('down')}else if(dt<350&&Math.abs(dx)<22&&Math.abs(dy)<22){act('rotate')}e.preventDefault()},{passive:false});
document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')act('left');else if(e.key==='ArrowRight')act('right');else if(e.key==='ArrowDown')act('down');else if(e.key==='ArrowUp'||e.key===' ')act('rotate');else if(e.key==='Enter')act('hard')});
document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});
document.getElementById('start').addEventListener('click',start);board=empty();nextPair=makePair();drawNext();draw();
})();
</script>
</body>
</html>
