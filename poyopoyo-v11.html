<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}

.wrap{width:min(455px,100%);margin:auto;display:flex;flex-direction:column;gap:7px}.top{display:flex;align-items:flex-end;justify-content:space-between;padding:0 2px}.logo{font-size:31px;font-weight:1000;letter-spacing:-3px;line-height:1;text-shadow:0 3px 0 #fff,0 5px 0 #294d9d,0 8px 12px #17488566}.logo i{font-style:normal}.logo i:nth-child(1){color:#ff4d70}.logo i:nth-child(2){color:#ffcf2f}.logo i:nth-child(3){color:#4fd76c}.logo i:nth-child(4){color:#4aaff7}.sub{font-size:9px;font-weight:1000;color:#17427e;text-shadow:0 1px #fff;letter-spacing:.14em;margin-top:4px}.score{min-width:116px;border:4px solid #fff;border-radius:17px;background:linear-gradient(#2155a9,#153776);padding:5px 10px 6px;text-align:right;box-shadow:0 4px 0 #0d2863,0 7px 12px #2765a455}.score small{display:block;font-size:8px;font-weight:1000;color:#cae7ff;letter-spacing:.12em}.score b{font-size:21px;line-height:1}.gameRow{display:grid;grid-template-columns:minmax(0,1fr) 112px;gap:7px;align-items:start}.wellShell{position:relative;padding:7px;background:linear-gradient(180deg,#fff,#cfeaff 56%,#91c5ff);border:4px solid #fff;border-radius:21px;box-shadow:0 7px 0 #28549a,0 12px 18px #22578855}.wellShell:before{content:"";position:absolute;inset:5px;border:2px solid #7dc8ff;border-radius:13px;pointer-events:none}.well{position:relative;width:100%;aspect-ratio:6/12;border-radius:10px;overflow:hidden;background:linear-gradient(180deg,#092856,#061839);border:3px solid #123f83;box-shadow:inset 0 0 0 2px #03132d,inset 0 0 22px #0008}.well:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,transparent 16.4%,#6db6ff12 16.7% 16.9%,transparent 17.2% 33%,#6db6ff12 33.3% 33.5%,transparent 33.8% 49.6%,#6db6ff12 49.9% 50.1%,transparent 50.4% 66.2%,#6db6ff12 66.5% 66.7%,transparent 67% 82.8%,#6db6ff12 83.1% 83.3%,transparent 83.6%)}.well canvas{position:relative;z-index:1;display:block;width:100%;height:100%}.danger{position:absolute;z-index:3;left:50%;top:4px;transform:translateX(-50%);color:#ff4868;font-size:17px;font-weight:1000;text-shadow:0 2px #fff,0 3px #8d1636;pointer-events:none}.chainPop{position:absolute;z-index:5;left:-8px;right:-8px;top:43%;text-align:center;font-size:34px;font-weight:1000;color:#fff83b;text-shadow:-2px -2px #fff,2px -2px #fff,-2px 2px #fff,2px 2px #fff,0 5px #e84b4b,0 8px 12px #0008;opacity:0;pointer-events:none}.chainPop.show{animation:pop .7s cubic-bezier(.2,1.3,.2,1)}@keyframes pop{0%{opacity:0;transform:scale(.3) rotate(-8deg)}20%{opacity:1;transform:scale(1.24) rotate(4deg)}65%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.08)}}
.side{display:flex;flex-direction:column;gap:6px}.panel{border:3px solid #fff;border-radius:15px;background:linear-gradient(180deg,#245ab0,#17377a);box-shadow:0 4px 0 #0e2b68,0 7px 11px #22558a55;padding:6px;text-align:center}.pt{font-size:9px;font-weight:1000;color:#cdeaff;letter-spacing:.08em;margin-bottom:2px}.nextWrap{display:grid;grid-template-columns:1fr 1fr;gap:4px}.nextCard{background:#0c275c;border:2px solid #68aaf1;border-radius:11px;padding:3px 1px}.nextCard small{display:block;font-size:7px;font-weight:1000;color:#a9d6ff}.nextCard canvas{display:block;width:42px;height:57px;margin:auto}.chainNum{font-size:28px;font-weight:1000;color:#fff13a;line-height:1;text-shadow:0 2px #b63845}.maxLabel{font-size:8px;color:#cdeaff;font-weight:900;margin-top:3px}.maxLabel b{color:#fff}.mascot{height:151px;position:relative;overflow:hidden;background:linear-gradient(180deg,#fff6fd,#ffd3ea 58%,#ff9fd1);border-color:#fff}.mascot:before,.mascot:after{content:"★";position:absolute;color:#fff36a;text-shadow:0 2px #ef6faf;font-size:26px}.mascot:before{left:8px;bottom:9px;transform:rotate(-18deg)}.mascot:after{right:8px;top:10px;transform:rotate(15deg)}.mascotName{font-size:19px;font-weight:1000;color:#ef4e99;text-shadow:0 2px #fff;margin-top:24px}.mascotTalk{position:relative;z-index:2;margin:8px auto 0;width:88%;padding:7px 4px;border-radius:999px;background:#fff;color:#e8458f;border:2px solid #f46da8;font-size:11px;font-weight:1000;box-shadow:0 3px #d64987}.mascot .stars{font-size:24px;letter-spacing:6px;margin-top:11px;animation:twinkle 1.1s infinite alternate}.mascot.cheer{animation:bounce .52s ease}.mascot.magic{animation:bounce .62s ease;filter:saturate(1.15)}@keyframes bounce{45%{transform:translateY(-7px) scale(1.04)}}@keyframes twinkle{to{transform:scale(1.12);filter:brightness(1.15)}}
.controls{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.controls button{height:55px;border:3px solid #fff;border-radius:18px;background:linear-gradient(#fff,#dff1ff);color:#1c4b9b;font-size:24px;font-weight:1000;box-shadow:0 5px 0 #2861aa;touch-action:none}.controls button:active,.controls button.pressed{transform:translateY(3px);box-shadow:0 2px 0 #2861aa;background:#fff8a9}.controls .rot{color:#8b48c7}.controls .soft{grid-column:span 2;font-size:14px;background:linear-gradient(#fff,#d9fff2);color:#167866}.controls .hard{grid-column:span 2;font-size:14px;background:linear-gradient(#fff8b2,#ffd03d);color:#914e00;box-shadow:0 5px 0 #d09515}.hint{text-align:center;color:#194a80;font-size:9px;font-weight:900;text-shadow:0 1px #fff}.home{display:block;text-decoration:none;text-align:center;color:#fff;background:#174c94d9;border:2px solid #fff;border-radius:14px;padding:8px;font-size:11px;font-weight:1000;box-shadow:0 3px 0 #123668}.overlay{position:fixed;z-index:20;inset:0;display:flex;align-items:center;justify-content:center;padding:22px;background:#173c83e8;backdrop-filter:blur(7px)}.card{width:min(350px,100%);padding:22px;text-align:center;border:4px solid #fff;border-radius:25px;background:linear-gradient(#54c7ff,#4d76d7 58%,#654ec8);box-shadow:0 10px 30px #09265b99}.card h1{font-size:43px;margin:0;color:#fff13e;text-shadow:0 4px #e14c76}.card p{line-height:1.65;font-weight:700}.card button{width:100%;border:3px solid #fff;border-radius:17px;padding:13px;font-size:18px;font-weight:1000;color:#7b3b00;background:linear-gradient(#fffca4,#ffd532);box-shadow:0 5px 0 #d39b14}.card .home{margin-top:10px}.flash{animation:flash .22s ease}@keyframes flash{50%{filter:brightness(1.55)}}
@media(max-width:380px){.gameRow{grid-template-columns:minmax(0,1fr) 103px}.logo{font-size:28px}.score{min-width:103px}.mascot{height:139px}.controls button{height:51px}}
.mascotImg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:50% 100%;z-index:1}.mascotTalk{position:absolute!important;z-index:3!important;left:6%;right:6%;bottom:7px;margin:0!important;width:auto!important;background:#fffffff2!important}.mascot:before,.mascot:after{z-index:2}

.poyonaSprite.normal:before{left:0;top:-108px}

.poyonaSprite.c3:before{left:-100%;top:-285px}
.poyonaSprite.c4:before{left:-200%;top:-285px}

@keyframes poyocharBounce{45%{transform:translateY(-5px) scale(1.04)}}
@keyframes poyocharMagic{35%{transform:translateY(-8px) scale(1.08) rotate(2deg)}70%{transform:translateY(-3px) scale(1.03)}}

<body>
<div class="wrap">
<div class="top"><div><div class="logo"><i>ぽ</i><i>よ</i><i>ぽ</i><i>よ</i></div><div class="sub">CHAIN PUZZLE · v11</div></div><div class="score"><small>SCORE</small><b id="score">0</b></div></div>
<div class="gameRow">
<div class="wellShell"><div class="well" id="well"><canvas id="game" width="300" height="600"></canvas><div class="chainPop" id="chainPop"></div></div></div>
<div class="side">
<div class="panel"><div class="pt">NEXT</div><div class="nextWrap"><div class="nextCard"><small>NEXT</small><canvas id="next1" width="52" height="72"></canvas></div><div class="nextCard"><small>NEXT 2</small><canvas id="next2" width="52" height="72"></canvas></div></div></div>
<div class="panel"><div class="pt">CHAIN</div><div class="chainNum" id="chainNum">0</div><div class="maxLabel">MAX <b id="maxChain">0</b></div></div>
<div class="panel mascot" id="mascot"><div id="poyonaSprite" class="poyonaSprite normal" role="img" aria-label="ポヨナ"></div><div class="mascotTalk" id="talk">いくよ！</div></div>
</div></div>
<div class="controls"><button data-act="left">◀</button><button class="rot" data-act="rotL">↺</button><button class="rot" data-act="rotR">↻</button><button data-act="right">▶</button><button class="soft" data-act="down">▼ はやく落とす</button><button class="hard" data-act="hard">一気に落下</button></div>
<div class="hint">左右移動 / ↺↻で回転 / ▼長押しで高速落下 / 盤面タップで右回転</div>
<a class="home" href="./">ミニゲームパックへ戻る</a>
</div>
<div class="overlay" id="overlay"><div class="card"><h1>ぽよぽよ</h1><p>2個1組のぽよを動かして、<b>同じ色を4個以上</b>つなげよう。<br>NEXT 2を見ながら連鎖を組もう！</p><button id="start">スタート！</button><a class="home" href="./">ミニゲームパックへ戻る</a></div></div>
<script>
(()=>{
const C=6,R=12,S=50,colors=['#ef3f61','#42c95e','#3299ed','#ffd22d','#a55eea'];
const game=document.getElementById('game'),ctx=game.getContext('2d'),n1=document.getElementById('next1'),n2=document.getElementById('next2'),c1=n1.getContext('2d'),c2=n2.getContext('2d');
const sprite=document.getElementById('poyonaSprite');
const scoreEl=document.getElementById('score'),chainNum=document.getElementById('chainNum'),maxChainEl=document.getElementById('maxChain'),chainPop=document.getElementById('chainPop'),overlay=document.getElementById('overlay'),well=document.getElementById('well'),mascot=document.getElementById('mascot'),talk=document.getElementById('talk');
const poyonaSprite=document.getElementById('poyonaSprite');function setPoyona(k){if(!poyonaSprite)return;poyonaSprite.className='poyonaSprite '+(k||'normal')}
let board,active,queue=[],score=0,running=false,resolving=false,last=0,acc=0,dropMs=620,raf=0,gesture=null,maxChain=0,particles=[];let audioCtx=null;
const empty=()=>Array.from({length:R},()=>Array(C).fill(null));
const rnd=()=>Math.floor(Math.random()*colors.length); const pair=()=>({a:rnd(),b:rnd()});
function sound(type,n=1){try{audioCtx||=new (window.AudioContext||window.webkitAudioContext)();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.connect(g);g.connect(audioCtx.destination);o.type='sine';o.frequency.value=type==='clear'?420+n*90:type==='drop'?160:260;g.gain.setValueAtTime(.045,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.12);o.start();o.stop(audioCtx.currentTime+.13)}catch(e){}}
function cells(x=active.x,y=active.y,rot=active.rot,p=active){const d=[[0,-1],[1,0],[0,1],[-1,0]][rot];return[{x,y,c:p.a},{x:x+d[0],y:y+d[1],c:p.b}]}
function can(x,y,rot){return cells(x,y,rot).every(p=>p.x>=0&&p.x<C&&p.y<R&&(p.y<0||board[p.y][p.x]==null))}
function ensureQueue(){while(queue.length<3)queue.push(pair())}
function spawn(){ensureQueue();const p=queue.shift();queue.push(pair());active={x:2,y:1,rot:0,a:p.a,b:p.b};drawNext();react('normal','いくよ！');if(!can(active.x,active.y,active.rot)){end();return false}return true}
function move(dx,dy){if(!running||resolving||!active)return false;if(can(active.x+dx,active.y+dy,active.rot)){active.x+=dx;active.y+=dy;acc=0;draw();return true}if(dy>0)lock();return false}
function rotate(dir){if(!running||resolving||!active)return;const nr=(active.rot+(dir>0?1:3))%4;for(const k of[0,-1,1,-2,2])if(can(active.x+k,active.y,nr)){active.x+=k;active.rot=nr;acc=0;react('rotate',dir>0?'くるん！':'くるっ！');sound('turn');draw();return}}
function hard(){if(!running||resolving||!active)return;let d=0;while(can(active.x,active.y+1,active.rot)){active.y++;d++}score+=d;scoreEl.textContent=score;draw();sound('drop');lock()}
function lock(){if(!active)return;for(const p of cells()){if(p.y<0){end();return}board[p.y][p.x]=p.c}active=null;resolve()}
function groups(){const seen=Array.from({length:R},()=>Array(C).fill(false)),out=[];for(let y=0;y<R;y++)for(let x=0;x<C;x++){if(board[y][x]==null||seen[y][x])continue;const col=board[y][x],q=[[x,y]],g=[];seen[y][x]=true;while(q.length){const[cx,cy]=q.pop();g.push([cx,cy]);for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const nx=cx+dx,ny=cy+dy;if(nx>=0&&nx<C&&ny>=0&&ny<R&&!seen[ny][nx]&&board[ny][nx]===col){seen[ny][nx]=true;q.push([nx,ny])}}}if(g.length>=4)out.push(g)}return out}
function gravity(){for(let x=0;x<C;x++){let w=R-1;for(let y=R-1;y>=0;y--)if(board[y][x]!=null){const v=board[y][x];board[y][x]=null;board[w--][x]=v}}}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function react(kind,text){talk.textContent=text;mascot.classList.remove('cheer','magic');if(sprite){let state='normal';if(text.includes('くる'))state='rotate';else if(text.includes('4れんさ')||text.includes('すご'))state='c4';else if(text.includes('3れんさ'))state='c3';else if(text.includes('2れんさ'))state='c2';else if(text.includes('やった'))state='c1';else if(text.includes('また'))state='gameover';sprite.className='poyonaSprite '+state}void mascot.offsetWidth;if(kind)mascot.classList.add(kind);setTimeout(()=>mascot.classList.remove(kind),700)}
function popChain(n){chainNum.textContent=n;maxChain=Math.max(maxChain,n);maxChainEl.textContent=maxChain;chainPop.textContent=n+'れんさ！';chainPop.classList.remove('show');void chainPop.offsetWidth;chainPop.classList.add('show');react(n>=4?'chain4':n===3?'chain3':n===2?'chain2':'chain1',n>=4?'すごーい！！':n>=2?n+'れんさ！':'やった！');sound('clear',n)}
function addParticles(g){for(const[x,y]of g)for(let i=0;i<5;i++)particles.push({x:x*S+25,y:y*S+25,vx:(Math.random()-.5)*6,vy:-2-Math.random()*5,a:1,r:2+Math.random()*4})}
async function resolve(){resolving=true;let ch=0;while(running){const gs=groups();if(!gs.length)break;ch++;popChain(ch);for(const g of gs)addParticles(g);await sleep(120);let removed=0;for(const g of gs)for(const[x,y]of g){board[y][x]=null;removed++}score+=removed*10*ch*ch;scoreEl.textContent=score;well.classList.add('flash');setTimeout(()=>well.classList.remove('flash'),180);draw();navigator.vibrate?.(ch>=2?[18,25,18]:18);await sleep(170);gravity();draw();await sleep(125)}resolving=false;if(running){spawn();draw()}}
function shade(hex,a){let n=parseInt(hex.slice(1),16),r=Math.max(0,Math.min(255,(n>>16)+a)),g=Math.max(0,Math.min(255,((n>>8)&255)+a)),b=Math.max(0,Math.min(255,(n&255)+a));return`rgb(${r},${g},${b})`}
function bridge(c,x,y,dx,dy,cc){ctx.fillStyle=colors[c];const cx=x*S+S/2,cy=y*S+S/2;if(dx)ctx.fillRect(Math.min(cx,cx+dx*S),cy-16,Math.abs(dx*S),32);else ctx.fillRect(cx-16,Math.min(cy,cy+dy*S),32,Math.abs(dy*S))}
function blob(c,x,y,boardMode=true){const px=x*S+25,py=y*S+25,r=22,col=colors[c];if(boardMode){for(const[dx,dy]of[[1,0],[0,1]]){const nx=x+dx,ny=y+dy;if(nx<C&&ny<R&&board[ny]?.[nx]===c)bridge(c,x,y,dx,dy)}}const grad=ctx.createRadialGradient(px-8,py-10,3,px,py,r+3);grad.addColorStop(0,shade(col,70));grad.addColorStop(.28,col);grad.addColorStop(1,shade(col,-55));ctx.fillStyle=grad;ctx.beginPath();ctx.arc(px,py,r,0,Math.PI*2);ctx.fill();ctx.lineWidth=2;ctx.strokeStyle='#ffffff99';ctx.stroke();ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(px-7,py-3,5,7,0,0,Math.PI*2);ctx.ellipse(px+7,py-3,5,7,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#17305b';ctx.beginPath();ctx.arc(px-6,py-2,2.2,0,Math.PI*2);ctx.arc(px+6,py-2,2.2,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#6b2858';ctx.lineWidth=1.7;ctx.beginPath();ctx.arc(px,py+8,5,.1*Math.PI,.9*Math.PI);ctx.stroke();ctx.fillStyle='#fff9';ctx.beginPath();ctx.ellipse(px-10,py-12,5,3,-.4,0,Math.PI*2);ctx.fill()}
function drawGrid(){ctx.clearRect(0,0,300,600);ctx.strokeStyle='#3e83c522';ctx.lineWidth=1;for(let x=1;x<C;x++){ctx.beginPath();ctx.moveTo(x*S,0);ctx.lineTo(x*S,600);ctx.stroke()}for(let y=1;y<R;y++){ctx.beginPath();ctx.moveTo(0,y*S);ctx.lineTo(300,y*S);ctx.stroke()}}
function draw(){drawGrid();for(let y=0;y<R;y++)for(let x=0;x<C;x++)if(board[y][x]!=null)blob(board[y][x],x,y,true);if(active)for(const p of cells())if(p.y>=0)blob(p.c,p.x,p.y,false);particles=particles.filter(p=>p.a>.05);for(const p of particles){p.x+=p.vx;p.y+=p.vy;p.vy+=.22;p.a*=.93;ctx.globalAlpha=p.a;ctx.fillStyle='#fff76a';ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1}
function preview(ct,p){ct.clearRect(0,0,52,72);const drawP=(c,x,y)=>{const col=colors[c],g=ct.createRadialGradient(x-4,y-5,2,x,y,13);g.addColorStop(0,shade(col,70));g.addColorStop(.35,col);g.addColorStop(1,shade(col,-55));ct.fillStyle=g;ct.beginPath();ct.arc(x,y,13,0,Math.PI*2);ct.fill();ct.strokeStyle='#fff9';ct.stroke();ct.fillStyle='#fff';ct.beginPath();ct.arc(x-4,y-2,3,0,Math.PI*2);ct.arc(x+4,y-2,3,0,Math.PI*2);ct.fill();ct.fillStyle='#17305b';ct.beginPath();ct.arc(x-4,y-2,1.2,0,Math.PI*2);ct.arc(x+4,y-2,1.2,0,Math.PI*2);ct.fill()};drawP(p.b,26,20);drawP(p.a,26,47)}
function drawNext(){ensureQueue();preview(c1,queue[0]);preview(c2,queue[1])}
function start(){setPoyona('normal');board=empty();active=null;queue=[pair(),pair(),pair()];score=0;scoreEl.textContent='0';chainNum.textContent='0';maxChain=0;maxChainEl.textContent='0';running=true;resolving=false;overlay.style.display='none';spawn();last=performance.now();acc=0;cancelAnimationFrame(raf);raf=requestAnimationFrame(loop);draw()}
function end(){running=false;cancelAnimationFrame(raf);react('gameover','また挑戦！');const best=Math.max(score,Number(localStorage.getItem('poyopoyo-v9-best')||0));localStorage.setItem('poyopoyo-v9-best',best);overlay.innerHTML=`<div class="card"><h1>${score}点</h1><p>ゲームオーバー<br>ベスト <b>${best}点</b><br>最大連鎖 <b>${maxChain}</b></p><button id="again">もう一回！</button><a class="home" href="./">ミニゲームパックへ戻る</a></div>`;overlay.style.display='flex';document.getElementById('again').addEventListener('click',start)}
function loop(t){if(!running)return;const dt=Math.min(100,t-last);last=t;if(!resolving&&active){acc+=dt;if(acc>=dropMs){acc=0;move(0,1)}}draw();raf=requestAnimationFrame(loop)}
function press(act){if(act==='left')move(-1,0);else if(act==='right')move(1,0);else if(act==='rotL')rotate(-1);else if(act==='rotR')rotate(1);else if(act==='down')move(0,1);else if(act==='hard')hard()}
let timers=new Map();document.querySelectorAll('[data-act]').forEach(b=>{const act=b.dataset.act;const startHold=e=>{e.preventDefault();b.classList.add('pressed');press(act);if(['left','right','down'].includes(act)){const t=setTimeout(()=>{const r=setInterval(()=>press(act),act==='down'?55:90);timers.set(b,{t,r})},230);timers.set(b,{t})}};const stop=()=>{b.classList.remove('pressed');const o=timers.get(b);if(o){clearTimeout(o.t);clearInterval(o.r);timers.delete(b)}};b.addEventListener('pointerdown',startHold);b.addEventListener('pointerup',stop);b.addEventListener('pointercancel',stop);b.addEventListener('pointerleave',stop)});
const stage=document.getElementById('well');stage.addEventListener('pointerdown',e=>gesture={x:e.clientX,y:e.clientY});stage.addEventListener('pointerup',e=>{if(!gesture)return;const dx=e.clientX-gesture.x,dy=e.clientY-gesture.y;if(Math.abs(dx)>32&&Math.abs(dx)>Math.abs(dy))move(dx>0?1:-1,0);else if(Math.abs(dy)>42&&dy>0)hard();else rotate(1);gesture=null});
document.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowDown','z','x','Z','X',' '].includes(e.key))e.preventDefault();if(e.key==='ArrowLeft')move(-1,0);if(e.key==='ArrowRight')move(1,0);if(e.key==='ArrowDown')move(0,1);if(e.key==='z'||e.key==='Z')rotate(-1);if(e.key==='x'||e.key==='X')rotate(1);if(e.key===' ')hard()});
document.getElementById('start').addEventListener('click',start);drawNext();drawGrid();
})();
</script>
</body></html>
