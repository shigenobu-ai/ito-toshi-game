<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>なっちゃんピコピコ</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:manipulation}
html,body{margin:0;width:100%;min-height:100%;background:#102016;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif}
body{min-height:100dvh;padding:max(18px,env(safe-area-inset-top)) 16px max(18px,env(safe-area-inset-bottom));background:radial-gradient(circle at 50% 0,#284c31 0,#142a1b 45%,#0b1710 100%)}
.wrap{width:min(560px,100%);margin:auto}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.title{font-size:24px;font-weight:1000;letter-spacing:.02em}
.stats{display:flex;gap:8px}
.stat{min-width:88px;text-align:center;background:#0007;border:1px solid #ffffff18;border-radius:16px;padding:8px 10px}
.stat b{display:block;font-size:21px;font-variant-numeric:tabular-nums}
.stat span{font-size:10px;color:#c7d8ca}
.stage{margin-top:18px;background:linear-gradient(#6fb95c 0 22%,#4e8c45 22% 100%);border:1px solid #ffffff1a;border-radius:28px;padding:22px 16px 20px;box-shadow:0 16px 38px #0007;position:relative;overflow:hidden}
.cloud{position:absolute;border-radius:999px;background:#ffffffc9;opacity:.75;filter:blur(.2px)}
.c1{width:78px;height:25px;left:8%;top:7%}.c2{width:58px;height:20px;right:10%;top:12%}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px 12px;margin-top:58px}
.hole{position:relative;aspect-ratio:1.15/1;overflow:hidden}
.dirt{position:absolute;left:7%;right:7%;bottom:2%;height:33%;background:#26160f;border-radius:50%;box-shadow:inset 0 8px 10px #0008,0 3px 0 #7b4a2a}
.mole{position:absolute;left:50%;bottom:-76%;width:86%;height:96%;transform:translateX(-50%);transition:bottom .11s ease-out;cursor:pointer;display:flex;align-items:flex-start;justify-content:center}.nacchan-photo{width:100%;height:100%;object-fit:cover;object-position:50% 18%;border-radius:46% 46% 34% 34%;border:3px solid #fff;box-shadow:0 5px 12px #0007;background:#fff}.hammer{position:fixed;z-index:20;width:74px;height:74px;pointer-events:none;transform:translate(-50%,-50%) rotate(-24deg);opacity:0}.hammer.show{opacity:1;animation:bonk .18s ease-out}.hammer-head{position:absolute;left:12px;top:3px;width:54px;height:34px;border-radius:18px;background:linear-gradient(#ff79bd,#ff3e9b);border:3px solid #fff;box-shadow:0 4px 0 #a72768,0 0 0 2px #ffb8dc inset}.hammer-head:before,.hammer-head:after{content:"";position:absolute;top:5px;width:10px;height:14px;border-radius:50%;background:#fff8}.hammer-head:before{left:6px}.hammer-head:after{right:6px}.hammer-stick{position:absolute;left:34px;top:31px;width:10px;height:38px;border-radius:6px;background:linear-gradient(#f0cc8c,#a76d33);transform:rotate(-6deg);transform-origin:top}@keyframes bonk{0%{transform:translate(-50%,-50%) rotate(-60deg) scale(.9)}55%{transform:translate(-50%,-50%) rotate(12deg) scale(1.05)}100%{transform:translate(-50%,-50%) rotate(-8deg) scale(1)}}
.hole.up .mole{bottom:5%}
.face{position:absolute;inset:0;border-radius:50% 50% 44% 44%;background:linear-gradient(#615047,#3f332e);border:2px solid #241b18;box-shadow:inset 0 -7px 0 #332824}
.ear{position:absolute;top:18%;width:14%;height:14%;background:#4a3a34;border:2px solid #241b18;border-radius:50%;z-index:-1}.ear.l{left:5%}.ear.r{right:5%}
.eye{position:absolute;top:33%;width:7%;height:8%;background:#090909;border-radius:50%;z-index:2}.eye.l{left:31%}.eye.r{right:31%}
.snout{position:absolute;left:50%;top:43%;width:52%;height:38%;transform:translateX(-50%);background:linear-gradient(#c8a78e,#a7836b);border-radius:52% 52% 46% 46%;box-shadow:inset 0 -3px 0 #8f6d58;z-index:1}
.nose{position:absolute;left:50%;top:48%;width:23%;height:14%;transform:translateX(-50%);background:#171313;border-radius:55% 55% 45% 45%;z-index:3}
.tooth{position:absolute;top:65%;width:12%;height:17%;background:#fff;border:1px solid #ddd;border-radius:2px;z-index:3}.tooth.l{left:38%;transform:rotate(3deg)}.tooth.r{right:38%;transform:rotate(-3deg)}
.face:before,.face:after{content:"";position:absolute;top:57%;width:23%;height:1px;background:#2b211eaa;z-index:3}.face:before{left:4%;transform:rotate(8deg)}.face:after{right:4%;transform:rotate(-8deg)}
.hole.hit .mole{transform:translateX(-50%) scale(.9)}
.hole.hit .face{background:linear-gradient(#a66a3a,#6e3b22)}
.pop{position:absolute;left:50%;top:8%;transform:translateX(-50%);font-size:22px;font-weight:1000;color:#ffe66f;text-shadow:0 2px 0 #7a3d00;pointer-events:none;animation:pop .42s ease-out forwards}
@keyframes pop{to{transform:translate(-50%,-28px) scale(1.25);opacity:0}}
.bottom{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
button,.home{border:0;border-radius:16px;padding:14px;font-size:16px;font-weight:900;text-align:center;text-decoration:none}
button{background:#fff;color:#102016}.home{background:#23372a;color:#fff}
.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;background:#0d1710d9;backdrop-filter:blur(8px);z-index:10}
.card{width:min(360px,100%);background:#1a2b20;border:1px solid #ffffff18;border-radius:26px;padding:26px;text-align:center;box-shadow:0 20px 50px #0008}
.card h1{margin:0 0 8px;font-size:38px}
.card p{color:#c9d6cc;line-height:1.7}
.card button,.card .home{width:100%;display:block;margin-top:12px}
.hidden{display:none}
.combo{height:24px;text-align:center;margin-top:10px;font-size:14px;font-weight:900;color:#ffe66f}
</style>
</head>
<body>
<main class="wrap">
  <div class="top">
    <div class="title">🔨 なっちゃんピコピコ</div>
    <div class="stats">
      <div class="stat"><b id="score">0</b><span>スコア</span></div>
      <div class="stat"><b id="time">30.0</b><span>残り秒</span></div>
    </div>
  </div>
  <div class="combo" id="combo"></div>
  <section class="stage">
    <div class="cloud c1"></div><div class="cloud c2"></div>
    <div class="grid" id="grid"></div>
  </section>
  <div class="bottom">
    <button id="restart">やり直す</button>
    <a class="home" href="./">メインへ戻る</a>
  </div>
</main>

<div id="hammer" class="hammer"><div class="hammer-head"></div><div class="hammer-stick"></div></div><div id="overlay" class="overlay">
  <div class="card">
    <h1>なっちゃんピコピコ</h1>
    <p>出てきたなっちゃんをタップ！<br><strong>30秒で何回ピコピコできるか</strong>挑戦。</p>
    <button id="start">スタート</button>
    <a class="home" href="./">ミニゲームパックへ戻る</a>
  </div>
</div>

<script>
(()=>{
const grid=document.getElementById('grid'),scoreEl=document.getElementById('score'),timeEl=document.getElementById('time'),comboEl=document.getElementById('combo'),overlay=document.getElementById('overlay');
let running=false,score=0,combo=0,best=Number(localStorage.getItem('mogura-best')||0),active=[],hideTimers=[],nextTimer=0,endAt=0,raf=0;
const holes=[];
for(let i=0;i<9;i++){
  const hole=document.createElement('div');
  hole.className='hole';
  hole.innerHTML='<div class="mole"><img class="nacchan-photo" src="assets/1DE0F1E2-A27C-4411-BD1D-67173EC50D4E.jpeg" alt=""></div><div class="dirt"></div>';
  hole.addEventListener('pointerdown',e=>{e.preventDefault();hit(i,hole)});
  grid.appendChild(hole);holes.push(hole);
}
function hideOne(idx,wasHit){const k=active.indexOf(idx);if(k<0)return;active.splice(k,1);holes[idx].classList.remove('up','hit');if(!wasHit&&running){combo=0;comboEl.textContent=''}}
function showMoles(){
  if(!running)return;
  const elapsed=30000-Math.max(0,endAt-performance.now());
  const doubleChance=elapsed>7000?0.28:0.14;
  const count=Math.random()<doubleChance?2:1;
  const choices=holes.map((_,i)=>i).filter(i=>!active.includes(i));
  for(let n=0;n<count&&choices.length;n++){
    const pick=Math.floor(Math.random()*choices.length),idx=choices.splice(pick,1)[0];
    active.push(idx);holes[idx].classList.add('up');
    const minVisible=count===2?Math.max(820,1050-elapsed/150):Math.max(520,760-elapsed/110),maxVisible=count===2?Math.max(1180,1500-elapsed/170):Math.max(900,1400-elapsed/145);const visible=minVisible+Math.random()*(maxVisible-minVisible);
    const tm=setTimeout(()=>{hideOne(idx,false);if(active.length===0)scheduleNext()},visible);
    hideTimers.push(tm);
  }
}
function hideAll(wasHit){hideTimers.forEach(clearTimeout);hideTimers=[];for(const idx of [...active])hideOne(idx,wasHit);active=[]}
function scheduleNext(){
  if(!running)return;
  clearTimeout(nextTimer);
  const elapsed=30000-Math.max(0,endAt-performance.now());
  const base=Math.max(110,420-elapsed/115);
  let delay=base+Math.random()*420;
  if(Math.random()<0.22)delay+=500+Math.random()*650;
  nextTimer=setTimeout(showMoles,delay);
}
function hit(i,hole){
  if(!running||!active.includes(i)||!hole.classList.contains('up')||hole.classList.contains('hit'))return;
  hole.classList.add('hit');
  const r=hole.getBoundingClientRect(),hammer=document.getElementById('hammer');hammer.style.left=(r.left+r.width*.58)+'px';hammer.style.top=(r.top+r.height*.28)+'px';hammer.classList.remove('show');void hammer.offsetWidth;hammer.classList.add('show');setTimeout(()=>hammer.classList.remove('show'),190);
  score++;combo++;
  scoreEl.textContent=score;
  comboEl.textContent=combo>=3?combo+' COMBO!':'';
  const p=document.createElement('div');p.className='pop';p.textContent='+1';hole.appendChild(p);setTimeout(()=>p.remove(),450);
  navigator.vibrate?.(12);
  setTimeout(()=>{hideOne(i,true);if(active.length===0)scheduleNext()},90);
}
function tick(t){
  if(!running)return;
  const remain=Math.max(0,endAt-t);
  timeEl.textContent=(remain/1000).toFixed(1);
  if(remain<=0){finish();return}
  raf=requestAnimationFrame(tick);
}
function reset(){
  hideTimers.forEach(clearTimeout);hideTimers=[];clearTimeout(nextTimer);cancelAnimationFrame(raf);
  holes.forEach(h=>h.classList.remove('up','hit'));
  active=[];score=0;combo=0;scoreEl.textContent='0';comboEl.textContent='';timeEl.textContent='30.0';
}
function start(){
  reset();running=true;overlay.classList.add('hidden');endAt=performance.now()+30000;scheduleNext();raf=requestAnimationFrame(tick);
}
function finish(){
  if(!running)return;
  running=false;hideTimers.forEach(clearTimeout);hideTimers=[];clearTimeout(nextTimer);cancelAnimationFrame(raf);hideAll(true);timeEl.textContent='0.0';
  best=Math.max(best,score);localStorage.setItem('mogura-best',best);
  overlay.innerHTML='<div class="card"><h1>'+score+'回！</h1><p>ベスト <strong>'+best+'回</strong></p><button id="again">もう一回</button><a class="home" href="./">ミニゲームパックへ戻る</a></div>';
  overlay.classList.remove('hidden');document.getElementById('again').onclick=start;
}
document.getElementById('start').onclick=start;
document.getElementById('restart').onclick=start;
})();
</script>
</body>
</html>
