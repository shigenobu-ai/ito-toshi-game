name: Fix Poyopoyo mobile fit
'on':
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-poyopoyo-mobile-v9.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply mobile fit and poyo shape fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('poyopoyo-v8.html')
          s=p.read_text(encoding='utf-8')
          marker='</style>'
          css='''\n/* mobile fit correction */\n.wrap{width:min(390px,100%);gap:5px}\n.header{min-width:0}.gameRow{grid-template-columns:minmax(0,1fr) 92px;gap:5px;min-width:0}.stageShell,.stage,.side,.miniRow,.panel{min-width:0}.stageShell{padding:4px;border-width:3px}.stage{border-width:2px}.panel{padding:4px;border-width:2px}.panelTitle{font-size:8px}.nextCanvas{width:37px;height:51px}.chainStat strong{font-size:18px}.hero{height:205px;border-width:3px}.heroImg{object-fit:contain;object-position:50% 100%}.controls{grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}.controls button{height:50px;font-size:23px}.controls .wide{grid-column:auto}.controls .wide:after{font-size:27px}.controls .drop:after{content:"⇓";font-size:29px}.hint{font-size:9px}@media(max-width:370px){.gameRow{grid-template-columns:minmax(0,1fr) 86px}.hero{height:190px}.controls button{height:46px}.logo{font-size:25px}}\n'''
          if '/* mobile fit correction */' not in s:
              s=s.replace(marker,css+marker,1)
          s=s.replace('./assets/poyona.jpg?v=20260826-0002','./assets/poyona.jpg?v=20260826-0004')
          start=s.index('function poyo(')
          end=s.index('function bridge(',start)
          poyo="function poyo(context,cx,cy,r,c,alpha=1){context.save();context.globalAlpha=alpha;const grad=context.createRadialGradient(cx-r*.34,cy-r*.46,r*.04,cx,cy,r*1.02);grad.addColorStop(0,'#fff');grad.addColorStop(.14,shade(colors[c],.22));grad.addColorStop(.58,colors[c]);grad.addColorStop(1,shade(colors[c],-.32));context.fillStyle=grad;context.beginPath();context.moveTo(cx-r*.82,cy+r*.33);context.bezierCurveTo(cx-r*1.06,cy-r*.10,cx-r*.91,cy-r*.72,cx-r*.38,cy-r*.92);context.bezierCurveTo(cx-r*.10,cy-r*1.02,cx+r*.08,cy-r*.98,cx+r*.23,cy-r*.88);context.bezierCurveTo(cx+r*.85,cy-r*.77,cx+r*1.04,cy-r*.13,cx+r*.84,cy+r*.37);context.bezierCurveTo(cx+r*.66,cy+r*.87,cx+r*.18,cy+r*.95,cx,cy+r*.83);context.bezierCurveTo(cx-r*.24,cy+r*.98,cx-r*.67,cy+r*.85,cx-r*.82,cy+r*.33);context.closePath();context.fill();context.strokeStyle=shade(colors[c],-.38);context.lineWidth=Math.max(1.1,r*.05);context.stroke();context.fillStyle='#ffffffd9';context.beginPath();context.ellipse(cx-r*.36,cy-r*.45,r*.17,r*.26,-.55,0,Math.PI*2);context.fill();const ey=cy-r*.04;context.fillStyle='#fff';for(const ex of[cx-r*.20,cx+r*.20]){context.beginPath();context.ellipse(ex,ey,r*.14,r*.19,0,0,Math.PI*2);context.fill()}context.fillStyle='#173b68';for(const ex of[cx-r*.18,cx+r*.18]){context.beginPath();context.arc(ex,ey+r*.025,r*.055,0,Math.PI*2);context.fill()}context.strokeStyle=shade(colors[c],-.48);context.lineWidth=Math.max(1,r*.038);context.beginPath();context.arc(cx,cy+r*.22,r*.12,.15*Math.PI,.85*Math.PI);context.stroke();context.restore()}"
          s=s[:start]+poyo+s[end:]
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify scope and protected asset
        run: |
          git diff --check
          test "$(git diff --name-only)" = "poyopoyo-v8.html"
          grep -F './assets/poyona.jpg?v=20260826-0004' poyopoyo-v8.html
          grep -F 'grid-template-columns:repeat(5,minmax(0,1fr))' poyopoyo-v8.html
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add poyopoyo-v8.html
          git commit -m 'Fix Poyopoyo mobile fit and restore character panel'
          git push