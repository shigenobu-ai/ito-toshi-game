name: Build Poyona action crops v3
'on':
  push:
    branches: [main]
    paths:
      - .github/workflows/build-poyona-actions-v2.yml
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
      - name: Split new 3x3 Poyona sprite sheet
        run: |
          set -e
          SRC='assets/125F39FA-EE51-4320-B59F-9FBDB140F320.png'
          OUT='assets/poyona-actions-v3'
          rm -rf "$OUT"
          mkdir -p "$OUT"
          python - <<'PY'
          import subprocess
          src='assets/125F39FA-EE51-4320-B59F-9FBDB140F320.png'
          out='assets/poyona-actions-v3'
          W,H=map(int,subprocess.check_output(['identify','-format','%w %h',src],text=True).split())
          names=['normal','rotate','chain1','chain2','chain3','chain4','wait','gameover','clear']
          for i,name in enumerate(names):
              col=i%3; row=i//3
              x0=round(W*col/3); x1=round(W*(col+1)/3)
              y0=round(H*row/3); y1=round(H*(row+1)/3)
              subprocess.run(['convert',src,'-crop',f'{x1-x0}x{y1-y0}+{x0}+{y0}','+repage',f'{out}/{name}.png'],check=True)
          print('source',W,H)
          PY
      - name: Build character module v3
        run: |
          cat > poyona-character-v3.js <<'EOF'
          (()=>{const base='./assets/poyona-actions-v3/';const files={normal:'normal.png',rotate:'rotate.png',chain1:'chain1.png',chain2:'chain2.png',chain3:'chain3.png',chain4:'chain4.png',wait:'wait.png',gameover:'gameover.png',clear:'clear.png'};function mount(el){const img=document.createElement('img');img.className='poyona-action-img';img.alt='ポヨナ';el.replaceChildren(img);const show=n=>{img.src=base+(files[n]||files.normal)+'?v=20260826-char3';img.dataset.action=n};const react=n=>{show(n);img.classList.remove('poyona-pop');void img.offsetWidth;img.classList.add('poyona-pop')};show('normal');return{show,react,img}}window.PoyonaCharacterV3={mount,files};})();
          EOF
      - name: Build standalone preview v3
        run: |
          cat > poyona-actions-v3.html <<'EOF'
          <!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ポヨナ動作確認 v3</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;background:linear-gradient(#65ccff,#ffe4f3);color:#17376e}body{padding:max(18px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom))}.wrap{width:min(520px,100%);margin:auto}.head{display:flex;justify-content:space-between;align-items:end;gap:12px}.head h1{margin:0;font-size:27px}.ver{font-weight:900;font-size:12px}.note{margin:8px 0 14px;font-size:13px;line-height:1.55}.preview{width:210px;aspect-ratio:1/1;margin:0 auto 16px;border:4px solid #fff;border-radius:20px;overflow:hidden;background:#55364d;box-shadow:0 6px 0 #da6ea4}.poyona-action-img{width:100%;height:100%;display:block;object-fit:contain}.poyona-pop{animation:pop .52s ease}@keyframes pop{45%{transform:translateY(-7px) scale(1.04)}}.buttons,.all{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.buttons button{border:3px solid #fff;border-radius:15px;padding:11px 4px;background:linear-gradient(#fff,#ffd8eb);color:#c63c80;font-size:13px;font-weight:900;box-shadow:0 4px 0 #db77a7}.gridTitle{margin:20px 0 8px;font-size:15px}.mini{aspect-ratio:1;overflow:hidden;border-radius:12px;border:2px solid #fff;background:#55364d}.label{text-align:center;font-size:10px;font-weight:900;margin-top:3px}.home{display:block;text-align:center;margin-top:18px;padding:10px;border-radius:14px;background:#174c94;color:#fff;text-decoration:none;font-weight:900}</style></head><body><main class="wrap"><div class="head"><h1>ポヨナ 動作確認</h1><div class="ver">CHAR MODULE v3</div></div><p class="note">新しい3×3ゲーム用スプライトを9枚の独立PNGへ分割した確認ページです。ゲーム本体とはまだ未接続です。</p><div id="mainChar" class="preview"></div><div class="buttons" id="buttons"></div><h2 class="gridTitle">9ポーズ一覧</h2><div class="all" id="all"></div><a class="home" href="./">ミニゲームパックへ戻る</a></main><script src="./poyona-character-v3.js?v=20260826-char3"></script><script>const labels={normal:'通常',rotate:'回転',chain1:'1連鎖',chain2:'2連鎖',chain3:'3連鎖',chain4:'4連鎖以上',wait:'待機',gameover:'ゲームオーバー',clear:'クリア'};const main=PoyonaCharacterV3.mount(document.getElementById('mainChar'));const buttons=document.getElementById('buttons'),all=document.getElementById('all');Object.keys(labels).forEach(name=>{const b=document.createElement('button');b.textContent=labels[name];b.onclick=()=>main.react(name);buttons.appendChild(b);const cell=document.createElement('div'),box=document.createElement('div');box.className='mini';cell.appendChild(box);const lab=document.createElement('div');lab.className='label';lab.textContent=labels[name];cell.appendChild(lab);all.appendChild(cell);PoyonaCharacterV3.mount(box).show(name)});</script></body></html>
          EOF
      - name: Verify
        run: |
          for f in normal rotate chain1 chain2 chain3 chain4 wait gameover clear; do test -s "assets/poyona-actions-v3/$f.png"; done
          grep -F 'CHAR MODULE v3' poyona-actions-v3.html
          grep -F '125F39FA-EE51-4320-B59F-9FBDB140F320.png' .github/workflows/build-poyona-actions-v2.yml
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/poyona-actions-v3 poyona-character-v3.js poyona-actions-v3.html
          git commit -m 'Build Poyona character module v3 from new sprite sheet'
          git push