name: Build Poyona action crops v2
'on':
  push:
    branches: [main]
    paths:
      - .github/workflows/build-poyona-actions-v2.yml
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Crop uploaded Poyona source into 9 independent assets
        run: |
          set -e
          SRC='assets/03A2A4E5-6EA6-4AAC-B0A4-3FC42A26A16E.png'
          mkdir -p assets/poyona-actions-v2
          python - <<'PY'
          import subprocess
          src='assets/03A2A4E5-6EA6-4AAC-B0A4-3FC42A26A16E.png'
          wh=subprocess.check_output(['identify','-format','%w %h',src],text=True).strip().split()
          W,H=map(int,wh)
          names=['normal','rotate','chain1','chain2','chain3','chain4','wait','gameover','clear']
          boxes=[
            (.02535,.21159,.33803,.38737),(.34225,.21159,.65634,.38737),(.66056,.21159,.97465,.38737),
            (.02535,.41471,.33803,.57943),(.34225,.41471,.65634,.57943),(.66056,.41471,.97465,.57943),
            (.02535,.60417,.33803,.76693),(.34225,.60417,.65634,.76693),(.66056,.60417,.97465,.76693)
          ]
          for name,(x0,y0,x1,y1) in zip(names,boxes):
              x=round(W*x0); y=round(H*y0); w=round(W*(x1-x0)); h=round(H*(y1-y0))
              out=f'assets/poyona-actions-v2/{name}.jpg'
              subprocess.run(['convert',src,'-crop',f'{w}x{h}+{x}+{y}','+repage','-quality','90',out],check=True)
          print('source',W,H)
          PY
      - name: Build standalone preview v2
        run: |
          cat > poyona-actions-v2.html <<'EOF'
          <!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ポヨナ動作確認 v2</title><style>
          *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;background:linear-gradient(#65ccff,#ffe4f3);color:#17376e}body{padding:max(18px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom))}.wrap{width:min(520px,100%);margin:auto}.head{display:flex;justify-content:space-between;align-items:end;gap:12px}.head h1{margin:0;font-size:27px}.ver{font-weight:900;font-size:12px}.note{margin:8px 0 14px;font-size:13px;line-height:1.55}.preview{width:180px;height:235px;margin:0 auto 16px;border:4px solid #fff;border-radius:20px;overflow:hidden;background:#fff;box-shadow:0 6px 0 #da6ea4}.poyona-action-img{width:100%;height:100%;display:block;object-fit:contain;background:#fff}.poyona-pop{animation:pop .52s ease}@keyframes pop{45%{transform:translateY(-7px) scale(1.04)}}.buttons{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.buttons button{border:3px solid #fff;border-radius:15px;padding:11px 4px;background:linear-gradient(#fff,#ffd8eb);color:#c63c80;font-size:13px;font-weight:900;box-shadow:0 4px 0 #db77a7}.buttons button:active{transform:translateY(2px);box-shadow:0 2px 0 #db77a7}.gridTitle{margin:20px 0 8px;font-size:15px}.all{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.mini{aspect-ratio:.78;overflow:hidden;border-radius:12px;border:2px solid #fff;background:#fff;position:relative}.mini .poyona-action-img{width:100%;height:100%;object-fit:contain}.label{text-align:center;font-size:10px;font-weight:900;margin-top:3px}.home{display:block;text-align:center;margin-top:18px;padding:10px;border-radius:14px;background:#174c94;color:#fff;text-decoration:none;font-weight:900}
          </style></head><body><main class="wrap"><div class="head"><h1>ポヨナ 動作確認</h1><div class="ver">CHAR MODULE v2</div></div><p class="note">元画像から9ポーズを独立ファイルとして切り出した確認ページです。ゲーム本体とは未接続です。</p><div id="mainChar" class="preview"></div><div class="buttons" id="buttons"></div><h2 class="gridTitle">9ポーズ一覧</h2><div class="all" id="all"></div><a class="home" href="./">ミニゲームパックへ戻る</a></main><script src="./poyona-character-v2.js?v=20260826-char2"></script><script>
          const labels={normal:'通常',rotate:'回転',chain1:'1連鎖',chain2:'2連鎖',chain3:'3連鎖',chain4:'4連鎖以上',wait:'待機',gameover:'ゲームオーバー',clear:'クリア'};
          const main=PoyonaCharacterV2.mount(document.getElementById('mainChar'));const buttons=document.getElementById('buttons');const all=document.getElementById('all');
          Object.keys(labels).forEach(name=>{const b=document.createElement('button');b.textContent=labels[name];b.onclick=()=>main.react(name);buttons.appendChild(b);const cell=document.createElement('div');const box=document.createElement('div');box.className='mini';cell.appendChild(box);const lab=document.createElement('div');lab.className='label';lab.textContent=labels[name];cell.appendChild(lab);all.appendChild(cell);PoyonaCharacterV2.mount(box).show(name)});
          </script></body></html>
          EOF
      - name: Verify crops and preview
        run: |
          test -s assets/poyona-actions-v2/normal.jpg
          test -s assets/poyona-actions-v2/rotate.jpg
          test -s assets/poyona-actions-v2/chain1.jpg
          test -s assets/poyona-actions-v2/chain2.jpg
          test -s assets/poyona-actions-v2/chain3.jpg
          test -s assets/poyona-actions-v2/chain4.jpg
          test -s assets/poyona-actions-v2/wait.jpg
          test -s assets/poyona-actions-v2/gameover.jpg
          test -s assets/poyona-actions-v2/clear.jpg
          grep -F 'CHAR MODULE v2' poyona-actions-v2.html
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/poyona-actions-v2 poyona-actions-v2.html
          git commit -m 'Build separated Poyona action assets v2'
          git push