name: Fix Poyopoyo Poyona and poyos
'on':
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-poyopoyo-poyona-puyo.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix existing Poyona reference and code-drawn poyo shape
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('poyopoyo-v8.html')
          s=p.read_text()
          old='src="./assets/poyona.jpg?v=20260826-0004"'
          new='src="./assets/poyona.svg?v=20260826-0005"'
          if old not in s:
              raise SystemExit('Poyona reference not found')
          s=s.replace(old,new,1)
          a=s.index('function poyo(')
          b=s.index('function bridge(',a)
          fn="""function poyo(context,cx,cy,r,c,alpha=1){context.save();context.globalAlpha=alpha;const col=colors[c];const grad=context.createRadialGradient(cx-r*.38,cy-r*.5,r*.06,cx,cy+r*.08,r*1.08);grad.addColorStop(0,'#fff');grad.addColorStop(.12,shade(col,.22));grad.addColorStop(.55,col);grad.addColorStop(1,shade(col,-.28));context.fillStyle=grad;context.beginPath();context.moveTo(cx,cy-r*.98);context.bezierCurveTo(cx+r*.18,cy-r*.92,cx+r*.42,cy-r*.8,cx+r*.64,cy-r*.56);context.bezierCurveTo(cx+r*.92,cy-r*.25,cx+r*1.02,cy+r*.2,cx+r*.88,cy+r*.5);context.bezierCurveTo(cx+r*.72,cy+r*.84,cx+r*.34,cy+r*.98,cx,cy+r*.9);context.bezierCurveTo(cx-r*.34,cy+r*.98,cx-r*.72,cy+r*.84,cx-r*.88,cy+r*.5);context.bezierCurveTo(cx-r*1.02,cy+r*.2,cx-r*.92,cy-r*.25,cx-r*.64,cy-r*.56);context.bezierCurveTo(cx-r*.42,cy-r*.8,cx-r*.18,cy-r*.92,cx,cy-r*.98);context.closePath();context.fill();context.strokeStyle=shade(col,-.38);context.lineWidth=Math.max(1.2,r*.055);context.stroke();context.fillStyle='#ffffffd9';context.beginPath();context.ellipse(cx-r*.32,cy-r*.46,r*.17,r*.26,-.45,0,Math.PI*2);context.fill();const ey=cy-r*.08;context.fillStyle='#fff';for(const ex of[cx-r*.2,cx+r*.2]){context.beginPath();context.ellipse(ex,ey,r*.14,r*.19,0,0,Math.PI*2);context.fill()}context.fillStyle='#173b68';for(const ex of[cx-r*.18,cx+r*.18]){context.beginPath();context.arc(ex,ey+r*.025,r*.055,0,Math.PI*2);context.fill()}context.strokeStyle=shade(col,-.5);context.lineWidth=Math.max(1,r*.038);context.beginPath();context.arc(cx,cy+r*.2,r*.12,.12*Math.PI,.88*Math.PI);context.stroke();context.restore()}"""
          s=s[:a]+fn+s[b:]
          p.write_text(s)
          PY
      - name: Verify scope
        run: |
          git diff --check
          test "$(git diff --name-only)" = "poyopoyo-v8.html"
          grep -F 'src="./assets/poyona.svg?v=20260826-0005"' poyopoyo-v8.html
          grep -F 'context.moveTo(cx,cy-r*.98)' poyopoyo-v8.html
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add poyopoyo-v8.html
          git commit -m 'Restore Poyona from existing valid asset and reshape poyos'
          git push