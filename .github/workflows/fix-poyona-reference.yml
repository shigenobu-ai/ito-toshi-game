name: Fix Poyona reference

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-poyona-reference.yml

permissions:
  contents: write

jobs:
  fix-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace inline image with existing asset reference
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('poyopoyo-v8.html')
          text = path.read_text(encoding='utf-8')
          replacement = '<img class="heroImg" src="./assets/poyona.jpg?v=20260826-0002" alt="ポヨナ">'
          updated, count = re.subn(
              r'<img class="heroImg" src="data:image/png;base64,[^"]+" alt="ポヨナ">',
              replacement,
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'Expected exactly one inline Poyona image, found {count}')
          path.write_text(updated, encoding='utf-8')
          PY
      - name: Verify scope
        run: |
          git diff --check
          git diff -- poyopoyo-v8.html
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = "poyopoyo-v8.html"
          grep -F './assets/poyona.jpg?v=20260826-0002' poyopoyo-v8.html
          ! grep -F 'data:image/png;base64,' poyopoyo-v8.html
      - name: Commit HTML-only fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add poyopoyo-v8.html
          git commit -m 'Use existing Poyona asset in v8'
          git push
