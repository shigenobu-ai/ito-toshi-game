name: Restyle Poyopoyo v8
on:
  push:
    branches: [main]
    paths: [.github/workflows/restyle-poyopoyo-v8.yml]
permissions:
  contents: write
jobs:
  restyle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restyle UI and code-drawn poyos only
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('poyopoyo-v8.html')
          s=p.read_text()
          marker='\n.bubble{display:none!important}\n'
          css=r'''
/* proposal-match UI pass: character asset intentionally untouched */
html,body{background:linear-gradient(180deg,#48c7fa 0%,#91ddff 58%,#bff2a2 100%)}
.wrap{width:min(440px,100%);gap:7px}
.header{align-items:flex-start;padding:1px 3px 0}.logo{font-size:31px;letter-spacing:-3px;text-shadow:0 3px 0 #fff,0 5px 0 #2487c7,0 7px 12px #12569c99}.logo:after{content:' Poyopoyo ★';display:block;font-size:10px;letter-spacing:.2px;color:#fff;text-shadow:0 2px 0 #2475b8;margin-top:-5px;margin-left:28px}.scorebox{min-width:118px;background:linear-gradient(#168bcf,#0961a8);border-radius:15px;border:3px solid #d8f7ff;box-shadow:0 4px 0 #07508d;padding:5px 10px}.scorebox small{color:#fff}.gameRow{grid-template-columns:minmax(0,1fr) 104px;gap:6px}.stageShell{padding:5px;background:linear-gradient(180deg,#b9edff,#56a9e1);border:4px solid #d9f7ff;border-radius:15px;box-shadow:0 5px 0 #2074aa,0 8px 15px #17609555}.stage{background:linear-gradient(180deg,#06396c,#03264d);border:3px solid #167bb7;border-radius:8px}.panel{background:linear-gradient(180deg,#158fcf,#075fa4);border:3px solid #d8f7ff;border-radius:14px;box-shadow:0 4px 0 #07508d}.panelTitle{color:#fff;font-size:11px}.nextCanvas{background:#06396c;border-color:#43a9de}.chainStat strong{color:#ffe12f}.hero{height:255px;background:#fff;border-color:#ff8dbb;box-shadow:0 4px 0 #e34f92}.controls{gap:8px}.controls button{border-radius:50%;height:62px;border:3px solid #fff;font-size:29px;background:linear-gradient(#4fb7ff,#087bd1);color:#fff;box-shadow:0 5px 0 #075ca3,0 7px 12px #126aa955;text-shadow:0 2px 0 #07508d}.controls button:nth-child(1){background:linear-gradient(#a77aff,#6840d5);box-shadow:0 5px 0 #4e2bb0}.controls button:nth-child(2){background:linear-gradient(#72e867,#25a943);box-shadow:0 5px 0 #178434}.controls button:nth-child(3){background:linear-gradient(#4fb7ff,#087bd1)}.controls .wide{grid-column:auto;border-radius:50%;font-size:0;background:linear-gradient(#ffd94f,#f3a70a);box-shadow:0 5px 0 #c47b00}.controls .wide:after{content:'↓';font-size:34px}.controls .drop{border-radius:50%;font-size:0;background:linear-gradient(#ff7eb3,#f13f86);box-shadow:0 5px 0 #bd2864}.controls .drop:after{content:'↓';font-size:38px}.hint{font-size:10px;color:#1268a4;text-shadow:0 1px #fff}.home{color:#17699d;background:#ffffffaa;border-color:#53a8d2}.overlay{background:#38a9d9e8}.card{background:linear-gradient(#57c9f4,#178dcc);border-color:#fff}.card h1{color:#ffe34a;text-shadow:0 3px 0 #f05d7e}
'''
          if marker not in s: raise SystemExit('style marker not found')
          s=s.replace(marker, marker+css+'\n',1)
          old="function poyo(context,cx,cy,r,c,alpha=1){context.save();context.globalAlpha=alpha;const grad=context.createRadialGradient(cx-r*.35,cy-r*.45,r*.08,cx,cy,r);grad.addColorStop(0,'#fff');grad.addColorStop(.18,colors[c]);grad.addColorStop(1,shade(colors[c],-.28));context.fillStyle=grad;context.beginPath();context.arc(cx,cy,r,0,Math.PI*2);context.fill();context.strokeStyle='#ffffffd8';context.lineWidth=Math.max(1.5,r*.065);context.stroke();const ey=cy-r*.03;context.fillStyle='#fff';for(const ex of[cx-r*.22,cx+r*.22]){context.beginPath();context.ellipse(ex,ey,r*.15,r*.2,0,0,Math.PI*2);context.fill()}context.fillStyle='#20204d';for(const ex of[cx-r*.20,cx+r*.20]){context.beginPath();context.arc(ex,ey+r*.025,r*.062,0,Math.PI*2);context.fill()}context.strokeStyle='#622c68';context.lineWidth=Math.max(1.1,r*.042);context.beginPath();context.arc(cx,cy+r*.24,r*.13,.12*Math.PI,.88*Math.PI);context.stroke();context.restore()}"
          new="function poyo(context,cx,cy,r,c,alpha=1){context.save();context.globalAlpha=alpha;const grad=context.createRadialGradient(cx-r*.32,cy-r*.42,r*.05,cx,cy,r);grad.addColorStop(0,'#fff');grad.addColorStop(.16,shade(colors[c],.18));grad.addColorStop(.55,colors[c]);grad.addColorStop(1,shade(colors[c],-.3));context.fillStyle=grad;context.beginPath();context.moveTo(cx-r*.92,cy+r*.18);context.bezierCurveTo(cx-r*1.02,cy-r*.42,cx-r*.62,cy-r*.92,cx,cy-r*.94);context.bezierCurveTo(cx+r*.62,cy-r*.92,cx+r*1.02,cy-r*.42,cx+r*.92,cy+r*.18);context.bezierCurveTo(cx+r*.84,cy+r*.72,cx+r*.42,cy+r*.93,cx,cy+r*.86);context.bezierCurveTo(cx-r*.42,cy+r*.93,cx-r*.84,cy+r*.72,cx-r*.92,cy+r*.18);context.closePath();context.fill();context.strokeStyle=shade(colors[c],-.38);context.lineWidth=Math.max(1.2,r*.055);context.stroke();context.fillStyle='#ffffffcc';context.beginPath();context.ellipse(cx-r*.35,cy-r*.43,r*.18,r*.27,-.5,0,Math.PI*2);context.fill();const ey=cy-r*.04;context.fillStyle='#fff';for(const ex of[cx-r*.2,cx+r*.2]){context.beginPath();context.ellipse(ex,ey,r*.14,r*.19,0,0,Math.PI*2);context.fill()}context.fillStyle='#173b68';for(const ex of[cx-r*.18,cx+r*.18]){context.beginPath();context.arc(ex,ey+r*.025,r*.055,0,Math.PI*2);context.fill()}context.strokeStyle=shade(colors[c],-.48);context.lineWidth=Math.max(1,r*.038);context.beginPath();context.arc(cx,cy+r*.22,r*.12,.15*Math.PI,.85*Math.PI);context.stroke();context.restore()}"
          if old not in s: raise SystemExit('poyo renderer not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Verify protected character reference and scope
        run: |
          git diff --check
          test "$(git diff --name-only)" = "poyopoyo-v8.html"
          grep -F 'src="./assets/poyona.jpg?v=20260826-0002"' poyopoyo-v8.html
          git diff -- poyopoyo-v8.html
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add poyopoyo-v8.html
          git commit -m 'Match Poyopoyo UI and poyo styling to proposal'
          git push