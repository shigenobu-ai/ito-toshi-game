name: Restyle Poyopoyo v8
'on':
  push:
    branches:
      - main
    paths:
      - .github/workflows/restyle-poyopoyo-v8.yml
permissions:
  contents: write
jobs:
  restyle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restyle UI and code-drawn poyos only
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('poyopoyo-v8.html')
          s=p.read_text()
          marker='\n.bubble{display:none!important}\n'
          css='''\n/* proposal-match UI pass: character asset intentionally untouched */\nhtml,body{background:linear-gradient(180deg,#48c7fa 0%,#91ddff 58%,#bff2a2 100%)}\n.header{align-items:flex-start}.logo{font-size:31px;text-shadow:0 3px 0 #fff,0 5px 0 #2487c7}.logo:after{content:" Poyopoyo ★";display:block;font-size:10px;letter-spacing:.2px;color:#fff;margin:-5px 0 0 28px}.scorebox,.panel{background:linear-gradient(#168bcf,#0961a8);border-color:#d8f7ff;box-shadow:0 4px 0 #07508d}.gameRow{grid-template-columns:minmax(0,1fr) 104px}.stageShell{padding:5px;background:linear-gradient(#b9edff,#56a9e1);border-color:#d9f7ff;border-radius:15px;box-shadow:0 5px 0 #2074aa}.stage{background:linear-gradient(#06396c,#03264d);border-color:#167bb7;border-radius:8px}.panelTitle{color:#fff;font-size:11px}.nextCanvas{background:#06396c;border-color:#43a9de}.chainStat strong{color:#ffe12f}.hero{background:#fff;border-color:#ff8dbb;box-shadow:0 4px 0 #e34f92}.controls button{border-radius:50%;height:62px;border:3px solid #fff;color:#fff;text-shadow:0 2px #07508d;background:linear-gradient(#4fb7ff,#087bd1);box-shadow:0 5px 0 #075ca3}.controls button:nth-child(1){background:linear-gradient(#a77aff,#6840d5)}.controls button:nth-child(2){background:linear-gradient(#72e867,#25a943)}.controls .wide{grid-column:auto;font-size:0;background:linear-gradient(#ffd94f,#f3a70a)}.controls .wide:after{content:"↓";font-size:34px}.controls .drop{font-size:0;background:linear-gradient(#ff7eb3,#f13f86)}.controls .drop:after{content:"↓";font-size:38px}.hint{color:#1268a4;text-shadow:0 1px #fff}.home{color:#17699d;background:#ffffffaa;border-color:#53a8d2}\n'''
          if marker not in s: raise SystemExit('style marker not found')
          s=s.replace(marker,marker+css,1)
          start=s.index('function poyo(')
          end=s.index('function bridge(',start)
          new="function poyo(context,cx,cy,r,c,alpha=1){context.save();context.globalAlpha=alpha;const grad=context.createRadialGradient(cx-r*.32,cy-r*.42,r*.05,cx,cy,r);grad.addColorStop(0,'#fff');grad.addColorStop(.16,shade(colors[c],.18));grad.addColorStop(.55,colors[c]);grad.addColorStop(1,shade(colors[c],-.3));context.fillStyle=grad;context.beginPath();context.moveTo(cx-r*.92,cy+r*.18);context.bezierCurveTo(cx-r*1.02,cy-r*.42,cx-r*.62,cy-r*.92,cx,cy-r*.94);context.bezierCurveTo(cx+r*.62,cy-r*.92,cx+r*1.02,cy-r*.42,cx+r*.92,cy+r*.18);context.bezierCurveTo(cx+r*.84,cy+r*.72,cx+r*.42,cy+r*.93,cx,cy+r*.86);context.bezierCurveTo(cx-r*.42,cy+r*.93,cx-r*.84,cy+r*.72,cx-r*.92,cy+r*.18);context.closePath();context.fill();context.strokeStyle=shade(colors[c],-.38);context.lineWidth=Math.max(1.2,r*.055);context.stroke();context.fillStyle='#ffffffcc';context.beginPath();context.ellipse(cx-r*.35,cy-r*.43,r*.18,r*.27,-.5,0,Math.PI*2);context.fill();const ey=cy-r*.04;context.fillStyle='#fff';for(const ex of[cx-r*.2,cx+r*.2]){context.beginPath();context.ellipse(ex,ey,r*.14,r*.19,0,0,Math.PI*2);context.fill()}context.fillStyle='#173b68';for(const ex of[cx-r*.18,cx+r*.18]){context.beginPath();context.arc(ex,ey+r*.025,r*.055,0,Math.PI*2);context.fill()}context.strokeStyle=shade(colors[c],-.48);context.lineWidth=Math.max(1,r*.038);context.beginPath();context.arc(cx,cy+r*.22,r*.12,.15*Math.PI,.85*Math.PI);context.stroke();context.restore()}"
          s=s[:start]+new+s[end:]
          p.write_text(s)
          PY
      - name: Verify protected character reference and scope
        run: |
          git diff --check
          test "$(git diff --name-only)" = "poyopoyo-v8.html"
          grep -F 'src="./assets/poyona.jpg?v=20260826-0002"' poyopoyo-v8.html
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add poyopoyo-v8.html
          git commit -m 'Match Poyopoyo UI and poyo styling to proposal'
          git push