name: Build Poyopoyo v10 character actions
'on':
  push:
    branches: [main]
    paths:
      - .github/workflows/build-poyopoyo-v10.yml
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build v10 with embedded Poyona action sprite
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('poyopoyo-v9.html').read_text()
          s=s.replace('<div class="sub">CHAIN PUZZLE</div>','<div class="sub">CHAIN PUZZLE · v10</div>',1)
          old='<div class="panel mascot" id="mascot"><img class="mascotImg" src="./assets/poyona.jpg?v=20260826-0102" alt="ポヨナ"><div class="mascotTalk" id="talk">いくよ！</div></div>'
          new='<div class="panel mascot" id="mascot"><div id="poyonaSprite" class="poyonaSprite normal" role="img" aria-label="ポヨナ"></div><div class="mascotTalk" id="talk">いくよ！</div></div>'
          if old not in s: raise SystemExit('mascot block not found')
          s=s.replace(old,new,1)
          sprite=''
          css='''\n.poyonaSprite{position:absolute;inset:5px;z-index:1;background-image:url("data:image/jpeg;base64,'''+sprite+'''");background-repeat:no-repeat;background-size:700% 100%;background-position:0% 50%;border-radius:10px}.poyonaSprite.normal{background-position:0% 50%}.poyonaSprite.rotate{background-position:16.6667% 50%}.poyonaSprite.chain1{background-position:33.3333% 50%}.poyonaSprite.chain2{background-position:50% 50%}.poyonaSprite.chain3{background-position:66.6667% 50%}.poyonaSprite.chain4{background-position:83.3333% 50%}.poyonaSprite.gameover{background-position:100% 50%}.mascotTalk{display:none!important}\n'''
          s=s.replace('</style>',css+'</style>',1)
          needle="const scoreEl=document.getElementById('score'),chainNum=document.getElementById('chainNum'),maxChainEl=document.getElementById('maxChain'),chainPop=document.getElementById('chainPop'),overlay=document.getElementById('overlay'),well=document.getElementById('well'),mascot=document.getElementById('mascot'),talk=document.getElementById('talk');"
          repl=needle+"\nconst poyonaSprite=document.getElementById('poyonaSprite');function setPoyona(k){if(!poyonaSprite)return;poyonaSprite.className='poyonaSprite '+(k||'normal')}"
          if needle not in s: raise SystemExit('const block not found')
          s=s.replace(needle,repl,1)
          s=s.replace("function spawn(){ensureQueue();const p=queue.shift();queue.push(pair());active={x:2,y:1,rot:0,a:p.a,b:p.b};drawNext();react('','いくよ！');","function spawn(){ensureQueue();const p=queue.shift();queue.push(pair());active={x:2,y:1,rot:0,a:p.a,b:p.b};drawNext();react('normal','いくよ！');",1)
          s=s.replace("react('cheer',dir>0?'くるん！':'くるっ！');","react('rotate',dir>0?'くるん！':'くるっ！');",1)
          oldreact="function react(kind,text){talk.textContent=text;mascot.classList.remove('cheer','magic');void mascot.offsetWidth;if(kind)mascot.classList.add(kind);setTimeout(()=>mascot.classList.remove(kind),700)}"
          newreact="function react(kind,text){talk.textContent=text;setPoyona(kind||'normal');mascot.classList.remove('cheer','magic');void mascot.offsetWidth;if(kind&&kind!=='normal'&&kind!=='gameover')mascot.classList.add(kind==='rotate'||kind==='chain1'?'cheer':'magic');setTimeout(()=>mascot.classList.remove('cheer','magic'),700)}"
          if oldreact not in s: raise SystemExit('react function not found')
          s=s.replace(oldreact,newreact,1)
          oldpop="react(n>=2?'magic':'cheer',n>=4?'すごーい！！':n>=2?n+'れんさ！':'やった！');"
          newpop="react(n>=4?'chain4':n===3?'chain3':n===2?'chain2':'chain1',n>=4?'すごーい！！':n>=2?n+'れんさ！':'やった！');"
          if oldpop not in s: raise SystemExit('pop react not found')
          s=s.replace(oldpop,newpop,1)
          s=s.replace("function end(){running=false;cancelAnimationFrame(raf);react('','また挑戦！');","function end(){running=false;cancelAnimationFrame(raf);react('gameover','また挑戦！');",1)
          s=s.replace("function start(){board=empty();","function start(){setPoyona('normal');board=empty();",1)
          Path('poyopoyo-v10.html').write_text(s)
          idx=Path('index.html');t=idx.read_text();t=re.sub(r'poyopoyo-v9\.html\?v=[^\"]+','poyopoyo-v10.html?v=20260826-1000',t);idx.write_text(t)
          PY
      - name: Verify v10
        run: |
          test -s poyopoyo-v10.html
          grep -F 'CHAIN PUZZLE · v10' poyopoyo-v10.html
          grep -F 'id="poyonaSprite"' poyopoyo-v10.html
          grep -F "react('rotate'" poyopoyo-v10.html
          grep -F "'chain4'" poyopoyo-v10.html
          grep -F "react('gameover'" poyopoyo-v10.html
          grep -F 'poyopoyo-v10.html?v=20260826-1000' index.html
          git diff --check
      - name: Commit v10
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add poyopoyo-v10.html index.html
          git commit -m 'Add Poyona action sprite in Poyopoyo v10'
          git push