name: Build Poyona v8 implementation

on:
  push:
    branches:
      - fix/poyona-inline-v8-impl
    paths:
      - assets/poyona-v8-inline.txt
      - .github/workflows/build-poyona-v8-impl.yml

permissions:
  contents: write

jobs:
  build-v8:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/poyona-inline-v8-impl
      - name: Build validated inline v8
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64

          src = Path('poyopoyo-v5.html').read_text(encoding='utf-8')
          b64 = ''.join(Path('assets/poyona-v8-inline.txt').read_text().split())
          raw = base64.b64decode(b64, validate=True)
          if not raw.startswith(b'\xff\xd8') or not raw.endswith(b'\xff\xd9'):
              raise SystemExit('Inline image is not a complete JPEG')

          old = 'src="assets/poyona.jpg?v=20260825-2220"'
          if src.count(old) != 1:
              raise SystemExit(f'Expected exactly one old Poyona image reference, got {src.count(old)}')

          data_uri = 'src="data:image/jpeg;base64,' + b64 + '"'
          out = src.replace(old, data_uri)
          out = out.replace('</style>', '.bubble{display:none!important}\n</style>', 1)

          if out.count('data:image/jpeg;base64,') != 1:
              raise SystemExit('Expected exactly one inline JPEG data URI')
          if 'assets/poyona.jpg' in out:
              raise SystemExit('Old external Poyona reference remains')
          if 'fetch(' in out:
              raise SystemExit('Unexpected fetch() in v8')

          Path('poyopoyo-v8.html').write_text(out, encoding='utf-8')
          print('v8 generated successfully')
          print('JPEG bytes:', len(raw))
          print('HTML bytes:', len(out.encode('utf-8')))
          PY
      - name: Commit v8
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add poyopoyo-v8.html
          if git diff --cached --quiet; then
            echo "No change"
          else
            git commit -m "Implement Poyona inline image v8"
            git push origin HEAD:fix/poyona-inline-v8-impl
          fi
