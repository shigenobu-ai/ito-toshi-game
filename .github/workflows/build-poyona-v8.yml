name: Build Poyona v8

on:
  push:
    branches:
      - fix/poyona-inline-v8
    paths:
      - .github/workflows/build-poyona-v8.yml
      - assets/poyona-chunk1.txt
      - assets/poyona-chunk2.txt
      - assets/poyona-chunk3.txt

permissions:
  contents: write

jobs:
  build-v8:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/poyona-inline-v8

      - name: Build and validate inline v8
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, re

          parts = [Path(f'assets/poyona-chunk{i}.txt').read_text(encoding='utf-8') for i in (1,2,3)]
          b64 = re.sub(r'\s+', '', ''.join(parts))
          raw = base64.b64decode(b64, validate=True)

          if not raw.startswith(b'\xff\xd8') or not raw.endswith(b'\xff\xd9'):
              raise SystemExit('JPEG magic markers are invalid')

          # Read JPEG dimensions without external libraries.
          pos = 2
          width = height = None
          sof = {0xC0,0xC1,0xC2,0xC3,0xC5,0xC6,0xC7,0xC9,0xCA,0xCB,0xCD,0xCE,0xCF}
          while pos + 4 <= len(raw):
              if raw[pos] != 0xFF:
                  pos += 1
                  continue
              while pos < len(raw) and raw[pos] == 0xFF:
                  pos += 1
              if pos >= len(raw):
                  break
              marker = raw[pos]
              pos += 1
              if marker in (0xD8,0xD9) or 0xD0 <= marker <= 0xD7:
                  continue
              if pos + 2 > len(raw):
                  break
              seglen = int.from_bytes(raw[pos:pos+2], 'big')
              if marker in sof and pos + 7 <= len(raw):
                  height = int.from_bytes(raw[pos+3:pos+5], 'big')
                  width = int.from_bytes(raw[pos+5:pos+7], 'big')
                  break
              pos += seglen

          if (width, height) != (180, 273):
              raise SystemExit(f'Unexpected JPEG dimensions: {width}x{height}')

          src = Path('poyopoyo-v5.html').read_text(encoding='utf-8')
          old = 'src="assets/poyona.jpg?v=20260825-2220"'
          new = 'src="data:image/jpeg;base64,' + b64 + '"'
          if src.count(old) != 1:
              raise SystemExit(f'Expected one Poyona image reference, found {src.count(old)}')

          out = src.replace(old, new)
          if 'fetch(' in out:
              raise SystemExit('Unexpected fetch() found in v8')
          if out.count('data:image/jpeg;base64,') != 1:
              raise SystemExit('Inline JPEG count is not exactly one')

          Path('poyopoyo-v8.html').write_text(out, encoding='utf-8')
          print(f'Validated JPEG: {width}x{height}, {len(raw)} bytes')
          print(f'Generated poyopoyo-v8.html: {len(out)} chars')
          PY

      - name: Commit generated v8
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add poyopoyo-v8.html
          if git diff --cached --quiet; then
            echo "No generated change"
          else
            git commit -m "Add inline Poyona image v8"
            git push origin HEAD:fix/poyona-inline-v8
          fi
