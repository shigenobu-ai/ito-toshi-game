# v8 inline image build
name: Build Poyona v8

on:
  push:
    branches:
      - fix/poyona-inline-v8
    paths:
      - .github/workflows/build-poyona-v8.yml
      - assets/poyona-chunk1.txt
      - assets/poyona-chunk2.txt
      - assets/poyona-chunk3.txt

permissions:
  contents: write

jobs:
  build-v8:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/poyona-inline-v8

      - name: Install image validator
        run: python -m pip install --disable-pip-version-check pillow

      - name: Repair, decode and build inline v8
        run: |
          python - <<'PY'
          from pathlib import Path
          from io import BytesIO
          import base64, re
          from PIL import Image

          parts = [re.sub(r'\s+', '', Path(f'assets/poyona-chunk{i}.txt').read_text(encoding='utf-8')) for i in (1,2,3)]
          b64_old = ''.join(parts)
          b64_old += '=' * (-len(b64_old) % 4)
          raw = base64.b64decode(b64_old, validate=True)

          if not raw.startswith(b'\xff\xd8'):
              raise SystemExit('JPEG start marker is invalid')

          if not raw.endswith(b'\xff\xd9'):
              raw += b'\xff\xd9'
              print('Added missing JPEG EOI marker FF D9')

          # Strict full-image decode. Do not enable LOAD_TRUNCATED_IMAGES.
          with Image.open(BytesIO(raw)) as im:
              im.load()
              if im.size != (180, 273):
                  raise SystemExit(f'Unexpected decoded size: {im.size}')
              if im.mode not in ('RGB', 'L'):
                  im = im.convert('RGB')
              elif im.mode == 'L':
                  im = im.convert('RGB')
              out_img = BytesIO()
              im.save(out_img, format='JPEG', quality=90, optimize=True)

          clean_raw = out_img.getvalue()
          if not clean_raw.startswith(b'\xff\xd8') or not clean_raw.endswith(b'\xff\xd9'):
              raise SystemExit('Re-encoded JPEG markers are invalid')

          # Decode the re-encoded result once more to verify every pixel.
          with Image.open(BytesIO(clean_raw)) as check:
              check.load()
              if check.size != (180, 273):
                  raise SystemExit(f'Re-encoded size mismatch: {check.size}')

          b64 = base64.b64encode(clean_raw).decode('ascii')
          if len(b64) % 4 != 0:
              raise SystemExit('Generated Base64 padding is invalid')

          src = Path('poyopoyo-v5.html').read_text(encoding='utf-8')
          old = 'src="assets/poyona.jpg?v=20260825-2220"'
          new = 'src="data:image/jpeg;base64,' + b64 + '"'
          if src.count(old) != 1:
              raise SystemExit(f'Expected one Poyona image reference, found {src.count(old)}')

          out = src.replace(old, new)
          if 'fetch(' in out:
              raise SystemExit('Unexpected fetch() found in v8')
          if out.count('data:image/jpeg;base64,') != 1:
              raise SystemExit('Inline JPEG count is not exactly one')

          Path('poyopoyo-v8.html').write_text(out, encoding='utf-8')
          print(f'Validated full JPEG decode: 180x273, {len(clean_raw)} bytes')
          print(f'Generated inline Base64: {len(b64)} chars')
          print(f'Generated poyopoyo-v8.html: {len(out)} chars')
          PY

      - name: Commit generated v8
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add poyopoyo-v8.html
          if git diff --cached --quiet; then
            echo "No generated change"
          else
            git commit -m "Add validated inline Poyona image v8"
            git push origin HEAD:fix/poyona-inline-v8
          fi
