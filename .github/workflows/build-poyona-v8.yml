# v8 inline image build
name: Build Poyona v8

on:
  push:
    branches:
      - fix/poyona-inline-v8
    paths:
      - .github/workflows/build-poyona-v8.yml

permissions:
  contents: write

jobs:
  build-v8:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/poyona-inline-v8
          fetch-depth: 0

      - name: Install image validator
        run: python -m pip install --disable-pip-version-check pillow

      - name: Recover historical Poyona and build inline v8
        run: |
          python - <<'PY'
          from pathlib import Path
          from io import BytesIO
          import base64, subprocess
          from PIL import Image

          candidates = [
              'd3e6089e3178c10ae301323ff37c14516c48c86f',
              'fa68bde653b6a10538d929641f3473c5f3762488',
          ]

          chosen = None
          image = None
          for sha in candidates:
              try:
                  raw = subprocess.check_output(['git','show',f'{sha}:assets/poyona.jpg'])
                  if not raw.startswith(b'\xff\xd8'):
                      print(f'{sha}: not a JPEG start marker')
                      continue
                  with Image.open(BytesIO(raw)) as im:
                      im.load()
                      print(f'{sha}: strict decode OK, size={im.size}, mode={im.mode}, bytes={len(raw)}')
                      image = im.convert('RGB').copy()
                      chosen = sha
                      break
              except Exception as e:
                  print(f'{sha}: rejected: {e}')

          if image is None:
              raise SystemExit('No historical Poyona JPEG passed strict full-image decoding')

          image = image.resize((180,273), Image.Resampling.LANCZOS)
          out_img = BytesIO()
          image.save(out_img, format='JPEG', quality=90, optimize=True)
          clean_raw = out_img.getvalue()

          with Image.open(BytesIO(clean_raw)) as check:
              check.load()
              if check.size != (180,273):
                  raise SystemExit(f'Re-encoded size mismatch: {check.size}')

          if not clean_raw.startswith(b'\xff\xd8') or not clean_raw.endswith(b'\xff\xd9'):
              raise SystemExit('Re-encoded JPEG markers are invalid')

          b64 = base64.b64encode(clean_raw).decode('ascii')
          if len(b64) % 4 != 0:
              raise SystemExit('Generated Base64 padding is invalid')

          src = Path('poyopoyo-v5.html').read_text(encoding='utf-8')
          old = 'src="assets/poyona.jpg?v=20260825-2220"'
          new = 'src="data:image/jpeg;base64,' + b64 + '"'
          if src.count(old) != 1:
              raise SystemExit(f'Expected one Poyona image reference, found {src.count(old)}')

          out = src.replace(old, new)
          if 'fetch(' in out:
              raise SystemExit('Unexpected fetch() found in v8')
          if out.count('data:image/jpeg;base64,') != 1:
              raise SystemExit('Inline JPEG count is not exactly one')

          Path('poyopoyo-v8.html').write_text(out, encoding='utf-8')
          print(f'Chosen historical image: {chosen}')
          print(f'Validated output JPEG: 180x273, {len(clean_raw)} bytes')
          print(f'Generated inline Base64: {len(b64)} chars')
          print(f'Generated poyopoyo-v8.html: {len(out)} chars')
          PY

      - name: Commit generated v8
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add poyopoyo-v8.html
          if git diff --cached --quiet; then
            echo "No generated change"
          else
            git commit -m "Add validated inline Poyona image v8"
            git push origin HEAD:fix/poyona-inline-v8
          fi
