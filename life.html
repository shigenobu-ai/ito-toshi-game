<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>生命ゲーム</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080d12;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif}body{padding:max(8px,env(safe-area-inset-top)) 8px max(8px,env(safe-area-inset-bottom));display:flex;flex-direction:column}.top{display:flex;align-items:center;gap:8px;min-height:42px}.back{color:#cbd6e2;text-decoration:none;font-size:22px;padding:5px 9px}.title{font-size:17px;font-weight:900;flex:1}.admin{display:grid;place-items:center;width:32px;height:32px;border:1px solid #ffffff18;border-radius:10px;background:#15212d;color:#fff;text-decoration:none;font-size:15px}.gen{font-size:11px;color:#93a5b7}.boardWrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}.board{position:relative;background:#0c131b;box-shadow:0 0 0 1px #ffffff18;touch-action:none;overflow:hidden}.board canvas{display:block;width:100%;height:100%;image-rendering:pixelated}.controls{display:grid;grid-template-columns:1fr 1.25fr 1fr 1fr;gap:6px;padding-top:8px}.controls button{border:1px solid #ffffff18;border-radius:12px;background:#182432;color:#fff;min-height:42px;font-weight:800;font-size:12px}.controls button:active{transform:scale(.97)}.controls .run{background:#25445d}.hint{text-align:center;color:#7f91a4;font-size:9px;padding-top:5px;white-space:nowrap}.save{color:#60778d;margin-left:6px}</style></head><body><div class="top"><a class="back" href="index.html">‹</a><div class="title">生命ゲーム</div><a class="admin" href="life-admin.html" aria-label="管理画面">📊</a><div class="gen">GEN <b id="gen">0</b> / LIVE <b id="live">0</b></div></div><div class="boardWrap" id="wrap"><div class="board" id="board"><canvas id="c"></canvas></div></div><div class="controls"><button id="clear">全消し</button><button class="run" id="run">▶ スタート</button><button id="random">ランダム</button><button id="step">1世代</button></div><div class="hint">マスをタップ／なぞって配置　・　生命は周囲8マスで自動進化 <span class="save" id="saveState">記録待機</span></div><script>
const SUPABASE_URL='https://heeigtgfvtsowlqttrio.supabase.co';
const SUPABASE_KEY='sb_publishable_29reD6BfZX0IVvXPgDh5ag_Twu9Ezrn';
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d'),board=document.getElementById('board'),wrap=document.getElementById('wrap');
let cols=0,rows=0,cell=4,grid,next,running=false,generation=0,timer=null,drawing=false,paint=1,last=-1,lastSavedGeneration=-1,finalized=false;
const runId=crypto.randomUUID(),runStartedAt=Date.now();
function fit(){const w=wrap.clientWidth,h=wrap.clientHeight;cell=4;cols=Math.max(20,Math.floor(w/cell));rows=Math.max(20,Math.floor(h/cell));const bw=cols*cell,bh=rows*cell;board.style.width=bw+'px';board.style.height=bh+'px';const dpr=Math.min(devicePixelRatio||1,2);canvas.width=bw*dpr;canvas.height=bh*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);grid=new Uint8Array(cols*rows);next=new Uint8Array(cols*rows);generation=0;lastSavedGeneration=-1;draw();}
function population(){let n=0;for(const v of grid)n+=v;return n}
function draw(){ctx.fillStyle='#0b1219';ctx.fillRect(0,0,cols*cell,rows*cell);ctx.fillStyle='#77f59b';let live=0;for(let i=0;i<grid.length;i++)if(grid[i]){live++;let x=(i%cols)*cell,y=((i/cols)|0)*cell;ctx.fillRect(x,y,cell,cell)}document.getElementById('gen').textContent=generation;document.getElementById('live').textContent=live;}
async function saveSnapshot(force=false,isFinal=false,keepalive=false){if(!isFinal&&!force&&generation%10!==0)return true;if(!isFinal&&lastSavedGeneration===generation)return true;const now=Date.now(),payload={run_id:runId,generation,total_population:population(),cols,rows,started_at:new Date(runStartedAt).toISOString(),ended_at:isFinal?new Date(now).toISOString():null,elapsed_seconds:Math.max(0,Math.round((now-runStartedAt)/1000)),is_final:isFinal};try{if(!isFinal)document.getElementById('saveState').textContent='保存中';const r=await fetch(`${SUPABASE_URL}/rest/v1/life_game_snapshots`,{method:'POST',headers:{apikey:SUPABASE_KEY,Authorization:`Bearer ${SUPABASE_KEY}`,'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify(payload),keepalive});if(!r.ok)throw new Error(await r.text());if(!isFinal){lastSavedGeneration=generation;document.getElementById('saveState').textContent=`保存済 ${generation}世代`;setTimeout(()=>{if(lastSavedGeneration===generation)document.getElementById('saveState').textContent='10世代ごと自動保存'},900)}return true}catch(e){console.error('life snapshot save failed',e);if(!isFinal)document.getElementById('saveState').textContent='保存失敗';return false}}
async function finalizeRun(keepalive=false){if(finalized)return true;finalized=true;clearInterval(timer);running=false;return saveSnapshot(true,true,keepalive)}
function step(){for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){let n=0;for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){if(!dx&&!dy)continue;let xx=(x+dx+cols)%cols,yy=(y+dy+rows)%rows;n+=grid[yy*cols+xx]}let i=y*cols+x;next[i]=(n===3||(grid[i]&&n===2))?1:0}let t=grid;grid=next;next=t;generation++;draw();saveSnapshot(false)}
function toggleRun(){running=!running;document.getElementById('run').textContent=running?'⏸ ストップ':'▶ スタート';clearInterval(timer);if(running)timer=setInterval(step,85);else saveSnapshot(true)}
function pos(e){const r=canvas.getBoundingClientRect();let x=Math.floor((e.clientX-r.left)/cell),y=Math.floor((e.clientY-r.top)/cell);if(x<0||y<0||x>=cols||y>=rows)return-1;return y*cols+x}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();drawing=true;canvas.setPointerCapture(e.pointerId);let i=pos(e);if(i>=0){paint=grid[i]?0:1;grid[i]=paint;last=i;draw()}});canvas.addEventListener('pointermove',e=>{if(!drawing)return;e.preventDefault();let i=pos(e);if(i>=0&&i!==last){grid[i]=paint;last=i;draw()}});canvas.addEventListener('pointerup',()=>{drawing=false;last=-1});canvas.addEventListener('pointercancel',()=>{drawing=false;last=-1});
document.getElementById('run').onclick=toggleRun;document.getElementById('step').onclick=()=>{if(!running)step()};document.getElementById('clear').onclick=()=>{if(running)toggleRun();grid.fill(0);generation=0;lastSavedGeneration=-1;draw();document.getElementById('saveState').textContent='記録待機'};document.getElementById('random').onclick=()=>{if(running)toggleRun();for(let i=0;i<grid.length;i++)grid[i]=Math.random()<.22;generation=0;lastSavedGeneration=-1;draw();saveSnapshot(true)};
document.querySelectorAll('a.back,a.admin').forEach(a=>a.addEventListener('click',async e=>{e.preventDefault();const href=a.href;await finalizeRun(false);location.href=href}));
addEventListener('pagehide',()=>{finalizeRun(true)});addEventListener('resize',()=>{clearTimeout(window._r);window._r=setTimeout(fit,120)});fit();
</script></body></html>
