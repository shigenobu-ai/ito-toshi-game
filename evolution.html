<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>進化ゲーム</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080d12;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif}body{padding:max(7px,env(safe-area-inset-top)) 7px max(7px,env(safe-area-inset-bottom));display:flex;flex-direction:column}.top{display:flex;align-items:center;gap:7px;min-height:42px}.back{color:#cbd6e2;text-decoration:none;font-size:22px;padding:4px 8px}.title{font-size:17px;font-weight:900;flex:1}.stats{text-align:right;font-size:9px;color:#93a5b7;line-height:1.45}.boardWrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}.board{background:#0b1219;box-shadow:0 0 0 1px #ffffff18;overflow:hidden;touch-action:none}.board canvas{display:block;width:100%;height:100%;image-rendering:pixelated}.legend{text-align:center;color:#91a4b6;font-size:8px;padding:5px 0}.controls{display:grid;grid-template-columns:1fr 1.25fr 1fr 1fr;gap:5px}.controls button{border:1px solid #ffffff18;border-radius:11px;background:#182432;color:#fff;min-height:40px;font-weight:800;font-size:11px}.controls .run{background:#25445d}.hint{text-align:center;color:#718397;font-size:8px;padding-top:4px}.event{position:absolute;left:50%;top:54px;transform:translateX(-50%);z-index:4;background:#ffca55;color:#111;padding:6px 11px;border-radius:99px;font-size:10px;font-weight:900;opacity:0;transition:.15s;pointer-events:none}.event.show{opacity:1}</style></head><body><div class="event" id="toast"></div><div class="top"><a class="back" href="index.html">‹</a><div class="title">進化ゲーム</div><div class="stats">世代 <b id="gen">0</b>　生命 <b id="live">0</b><br>活動 <b id="activity">0</b>　最長 <b id="record">0</b></div></div><div class="boardWrap" id="wrap"><div class="board" id="board"><canvas id="c"></canvas></div></div><div class="legend">一枚の世界を観察。黄色い枠は長く活動している領域</div><div class="controls"><button id="clear">全消し</button><button class="run" id="run">▶ スタート</button><button id="random">原始の海</button><button id="step">1世代</button></div><div class="hint">Conway Lifeそのもの：B3/S23固定。突然変異・遺伝子・繁殖補正なし。</div><script>
const c=document.getElementById('c'),ctx=c.getContext('2d'),wrap=document.getElementById('wrap'),board=document.getElementById('board');let W,H,cell=4,state,next,running=false,timer,generation=0,drawing=false,last=-1,record=0;const genEl=document.getElementById('gen'),liveEl=document.getElementById('live'),activityEl=document.getElementById('activity'),recordEl=document.getElementById('record'),runBtn=document.getElementById('run'),toast=document.getElementById('toast');let history=[],hot=null;
function msg(t){toast.textContent=t;toast.classList.add('show');clearTimeout(window._tt);window._tt=setTimeout(()=>toast.classList.remove('show'),1100)}
function fit(){W=Math.max(40,Math.floor(wrap.clientWidth/cell));H=Math.max(40,Math.floor(wrap.clientHeight/cell));board.style.width=W*cell+'px';board.style.height=H*cell+'px';let d=Math.min(devicePixelRatio||1,2);c.width=W*cell*d;c.height=H*cell*d;ctx.setTransform(d,0,0,d,0,0);state=new Uint8Array(W*H);next=new Uint8Array(W*H);reset();draw()}
function reset(){generation=0;record=0;history=[];hot=null}
function fingerprint(a){let h=2166136261,p=0;for(let i=0;i<a.length;i++)if(a[i]){p++;h^=i;h=Math.imul(h,16777619)}return h+'-'+p}
function detect(){let minx=W,miny=H,maxx=-1,maxy=-1,live=0;for(let i=0;i<state.length;i++)if(state[i]){live++;let x=i%W,y=(i/W)|0;if(x<minx)minx=x;if(x>maxx)maxx=x;if(y<miny)miny=y;if(y>maxy)maxy=y}let fp=fingerprint(state);history.push(fp);if(history.length>180)history.shift();let first=history.indexOf(fp),age=first>=0?history.length-1-first:history.length;record=Math.max(record,age);hot=live&&age>=80?{x:minx,y:miny,w:maxx-minx+1,h:maxy-miny+1,age}:null;if(age===80)msg('長寿命の活動を検出');return{live,age}}
function draw(info){ctx.fillStyle='#0b1219';ctx.fillRect(0,0,W*cell,H*cell);let live=0;ctx.fillStyle='#71f49a';for(let i=0;i<state.length;i++)if(state[i]){live++;ctx.fillRect((i%W)*cell,((i/W)|0)*cell,cell,cell)}if(hot){ctx.strokeStyle='#ffca55';ctx.lineWidth=1;ctx.strokeRect(hot.x*cell-.5,hot.y*cell-.5,hot.w*cell+1,hot.h*cell+1)}genEl.textContent=generation;liveEl.textContent=live;activityEl.textContent=info?info.age:0;recordEl.textContent=record}
function step(){next.fill(0);for(let y=0;y<H;y++)for(let x=0;x<W;x++){let n=0;for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){if(!dx&&!dy)continue;let xx=(x+dx+W)%W,yy=(y+dy+H)%H;n+=state[yy*W+xx]}let i=y*W+x;next[i]=state[i]?(n===2||n===3):(n===3)}let t=state;state=next;next=t;generation++;let info=detect();draw(info)}
function soup(){state.fill(0);reset();for(let y=3;y<H-3;y++)for(let x=3;x<W-3;x++)if(Math.random()<.22)state[y*W+x]=1;history=[fingerprint(state)];draw({age:1})}
function toggle(){running=!running;runBtn.textContent=running?'⏸ ストップ':'▶ スタート';clearInterval(timer);if(running)timer=setInterval(step,70)}runBtn.onclick=toggle;document.getElementById('step').onclick=()=>{if(!running)step()};document.getElementById('clear').onclick=()=>{if(running)toggle();state.fill(0);reset();draw()};document.getElementById('random').onclick=()=>{if(running)toggle();soup()};function pos(e){let r=c.getBoundingClientRect(),x=Math.floor((e.clientX-r.left)/cell),y=Math.floor((e.clientY-r.top)/cell);return x<0||y<0||x>=W||y>=H?-1:y*W+x}c.onpointerdown=e=>{e.preventDefault();drawing=true;c.setPointerCapture(e.pointerId);let i=pos(e);if(i>=0){state[i]^=1;last=i;draw()}};c.onpointermove=e=>{if(!drawing)return;let i=pos(e);if(i>=0&&i!==last){state[i]=1;last=i;draw()}};c.onpointerup=c.onpointercancel=()=>{drawing=false;last=-1};addEventListener('resize',()=>{clearTimeout(window._r);window._r=setTimeout(fit,120)});fit();soup();</script></body></html>
