<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>進化論ゲーム</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080d12;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif}body{padding:max(7px,env(safe-area-inset-top)) 7px max(7px,env(safe-area-inset-bottom));display:flex;flex-direction:column}.top{display:flex;align-items:center;gap:7px;min-height:39px}.back{color:#cbd6e2;text-decoration:none;font-size:22px;padding:4px 8px}.title{font-size:17px;font-weight:900;flex:1}.admin{display:grid;place-items:center;width:30px;height:30px;border:1px solid #ffffff18;border-radius:9px;background:#15212d;color:#fff;text-decoration:none;font-size:14px}.stats{text-align:right;font-size:9px;color:#93a5b7;line-height:1.4}.boardWrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}.board{background:#0b1219;box-shadow:0 0 0 1px #ffffff18;touch-action:none;overflow:hidden}.board canvas{display:block;width:100%;height:100%;image-rendering:pixelated}.legend{display:flex;justify-content:center;gap:8px;font-size:8px;color:#9badbd;padding:5px 0 1px}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:3px}.controls{display:grid;grid-template-columns:1fr 1.25fr 1fr 1fr;gap:5px}.controls button{border:1px solid #ffffff18;border-radius:11px;background:#182432;color:#fff;min-height:40px;font-weight:800;font-size:11px}.controls .run{background:#25445d}.hint{text-align:center;color:#718397;font-size:8px;padding-top:4px;white-space:nowrap}.save{color:#60778d}.event{position:absolute;left:50%;top:54px;transform:translateX(-50%);z-index:4;background:#ffca55;color:#111;padding:6px 11px;border-radius:99px;font-size:10px;font-weight:900;opacity:0;transition:opacity .15s;pointer-events:none}.event.show{opacity:1}</style></head><body><div class="event" id="eventToast"></div><div class="top"><a class="back" href="index.html">‹</a><div class="title">進化論ゲーム</div><a class="admin" href="evolution-admin.html">📊</a><div class="stats">世代 <b id="gen">0</b>　生命 <b id="live">0</b><br>遺伝型 <b id="species">0</b>　新規遺伝型 <b id="mut">0</b></div></div><div class="boardWrap" id="wrap"><div class="board" id="board"><canvas id="c"></canvas></div></div><div class="legend"><span><i class="dot" style="background:#71f49a"></i>祖先</span><span><i class="dot" style="background:#55b8ff"></i>変異</span><span><i class="dot" style="background:#ffca55"></i>変異/初接触</span></div><div class="controls"><button id="clear">全消し</button><button class="run" id="run">▶ スタート</button><button id="random">島ランダム</button><button id="step">1世代</button></div><div class="hint">実験版：島状初期配置＋局所的な同遺伝型密度ペナルティ　<span class="save" id="saveState">記録待機</span></div><script>
const API='https://heeigtgfvtsowlqttrio.supabase.co/functions/v1/game-records?game=evolution',c=document.getElementById('c'),x=c.getContext('2d'),board=document.getElementById('board'),wrap=document.getElementById('wrap');let cols,rows,cell=4,gene,nextGene,running=false,timer,generation=0,mutations=0,mutationEventsTotal=0,evolutionEvents=[],flash=[],drawing=false,last=-1,lastSavedGeneration=-1,finalized=false;const runId=crypto.randomUUID(),runStartedAt=Date.now(),genes=[{b:8,s:12,color:'#71f49a',parent:null,firstGeneration:0,mutationBit:null}],palette=['#55b8ff','#b78cff','#ff6f91','#59dfcf','#ff9f55','#d4ee66','#8ca8ff','#f06ee5'],contacts=new Set;
function rule(g){let s='';for(let i=0;i<=8;i++)if(g.s&(1<<i))s+=i;return `B3/S${s}`}
function counts(){let m=new Map;for(const v of gene)if(v)m.set(v-1,(m.get(v-1)||0)+1);return m}
function fit(){cols=Math.max(20,Math.floor(wrap.clientWidth/cell));rows=Math.max(20,Math.floor(wrap.clientHeight/cell));board.style.width=cols*cell+'px';board.style.height=rows*cell+'px';let d=Math.min(devicePixelRatio||1,2);c.width=cols*cell*d;c.height=rows*cell*d;x.setTransform(d,0,0,d,0,0);gene=new Uint16Array(cols*rows);nextGene=new Uint16Array(cols*rows);reset();draw()}
function reset(){generation=0;mutations=0;mutationEventsTotal=0;evolutionEvents=[];contacts.clear();lastSavedGeneration=-1}
function draw(){x.fillStyle='#0b1219';x.fillRect(0,0,cols*cell,rows*cell);let live=0,set=new Set;for(let i=0;i<gene.length;i++)if(gene[i]){live++;let g=gene[i]-1;set.add(g);x.fillStyle=genes[g]?.color||'#fff';x.fillRect((i%cols)*cell,((i/cols)|0)*cell,cell,cell)}let now=performance.now();flash=flash.filter(f=>now-f.t<700);for(const f of flash){x.strokeStyle=`rgba(255,202,85,${1-(now-f.t)/700})`;x.lineWidth=2;x.strokeRect((f.i%cols)*cell-2,((f.i/cols)|0)*cell-2,cell+4,cell+4)}gen.textContent=generation;liveEl.textContent=live;species.textContent=set.size;mut.textContent=mutations}
const gen=document.getElementById('gen'),liveEl=document.getElementById('live'),species=document.getElementById('species'),mut=document.getElementById('mut');function toast(t){eventToast.textContent=t;eventToast.classList.add('show');clearTimeout(window._t);window._t=setTimeout(()=>eventToast.classList.remove('show'),900)}
function mutate(parent,i){mutationEventsTotal++;let p=genes[parent],s=p.s,bit=1+Math.floor(Math.random()*7);s^=1<<bit;if(!s)s=4;let child=genes.findIndex(g=>g.b===p.b&&g.s===s);if(child<0){genes.push({b:p.b,s,color:palette[(genes.length-1)%palette.length],parent,firstGeneration:generation+1,mutationBit:bit});child=genes.length-1;mutations++;evolutionEvents.push({type:'origin',generation:generation+1,parent_gene_id:parent,gene_id:child,parent_rule:rule(p),rule:rule(genes[child]),mutation_bit:bit});toast(`変異 ${rule(p)} → ${rule(genes[child])}`)}else evolutionEvents.push({type:'mutation',generation:generation+1,parent_gene_id:parent,gene_id:child,parent_rule:rule(p),rule:rule(genes[child]),mutation_bit:bit});flash.push({i,t:performance.now()});return child}
function contact(a,b,i){if(a===b)return;let lo=Math.min(a,b),hi=Math.max(a,b),k=lo+':'+hi;if(contacts.has(k))return;contacts.add(k);evolutionEvents.push({type:'contact',generation,gene_a:lo,gene_b:hi,rule_a:rule(genes[lo]),rule_b:rule(genes[hi])});flash.push({i,t:performance.now()});toast(`初接触 ${rule(genes[lo])} × ${rule(genes[hi])}`)}
function survivalChance(same){return same<=4?1:same===5?.95:same===6?.90:same===7?.80:.65}
function step(){let before=counts();nextGene.fill(0);for(let y=0;y<rows;y++)for(let xx=0;xx<cols;xx++){let n=0,parents=[],same=0,i=y*cols+xx,current=gene[i]?gene[i]-1:-1;for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){if(!dx&&!dy)continue;let nx=xx+dx,ny=y+dy;if(nx<0||ny<0||nx>=cols||ny>=rows)continue;let v=gene[ny*cols+nx];if(v){n++;parents.push(v-1);if(current>=0&&v-1===current)same++;if(current>=0&&v-1!==current)contact(current,v-1,i)}}if(current>=0){if((genes[current].s&(1<<n))&&Math.random()<survivalChance(same))nextGene[i]=current+1}else if(n===3&&parents.length){let p=parents[Math.floor(Math.random()*parents.length)],ch=Math.random()<.001?mutate(p,i):p;nextGene[i]=ch+1}}let t=gene;gene=nextGene;nextGene=t;generation++;let after=counts();for(const [g,n] of before)if(n&&!after.has(g)&&g!==0&&!evolutionEvents.some(e=>e.type==='extinction'&&e.gene_id===g))evolutionEvents.push({type:'extinction',generation,gene_id:g,rule:rule(genes[g])});draw();save(false)}
function seedIslands(){gene.fill(0);const N=Math.min(8,Math.max(5,Math.round(cols*rows/1700))),centers=[];for(let k=0;k<N;k++){let best=null;for(let tries=0;tries<80;tries++){let cx=8+Math.floor(Math.random()*Math.max(1,cols-16)),cy=8+Math.floor(Math.random()*Math.max(1,rows-16)),dist=centers.length?Math.min(...centers.map(p=>Math.hypot(cx-p[0],cy-p[1]))):999;if(!best||dist>best[2])best=[cx,cy,dist]}centers.push(best);let [cx,cy]=best,rx=4+Math.floor(Math.random()*4),ry=4+Math.floor(Math.random()*4);for(let dy=-ry;dy<=ry;dy++)for(let dx=-rx;dx<=rx;dx++)if((dx*dx)/(rx*rx)+(dy*dy)/(ry*ry)<=1&&Math.random()<.38){let px=cx+dx,py=cy+dy;if(px>=0&&py>=0&&px<cols&&py<rows)gene[py*cols+px]=1}}reset();draw();save(true)}
async function save(force=false,isFinal=false,keepalive=false){if(!isFinal&&!force&&generation%10)return true;if(!isFinal&&lastSavedGeneration===generation)return true;let m=counts(),total=[...m.values()].reduce((a,b)=>a+b,0),summary=[...m].map(([g,population])=>({gene_id:g,rule:rule(genes[g]),population,share:total?population/total:0,parent_gene_id:genes[g].parent,first_generation:genes[g].firstGeneration,mutation_bit:genes[g].mutationBit})),now=Date.now(),payload={run_id:runId,generation,total_population:total,lineage_count:m.size,mutations_total:mutations,mutation_events_total:mutationEventsTotal,evolution_events:evolutionEvents,genotype_summary:summary,started_at:new Date(runStartedAt).toISOString(),ended_at:isFinal?new Date(now).toISOString():null,elapsed_seconds:Math.round((now-runStartedAt)/1000),is_final:isFinal};try{saveState.textContent='保存中';let r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload),keepalive});if(!r.ok)throw Error(await r.text());lastSavedGeneration=generation;saveState.textContent=`保存済 ${generation}世代`;return true}catch(e){console.error(e);saveState.textContent='保存失敗';return false}}
async function finalize(keepalive=false){if(finalized)return;clearInterval(timer);running=false;if(await save(true,true,keepalive))finalized=true}function toggle(){running=!running;runBtn.textContent=running?'⏸ ストップ':'▶ スタート';clearInterval(timer);if(running)timer=setInterval(step,85);else save(true)}const runBtn=document.getElementById('run'),saveState=document.getElementById('saveState'),eventToast=document.getElementById('eventToast');runBtn.onclick=toggle;document.getElementById('step').onclick=()=>{if(!running)step()};document.getElementById('clear').onclick=()=>{if(running)toggle();gene.fill(0);reset();draw()};document.getElementById('random').onclick=()=>{if(running)toggle();seedIslands()};function pos(e){let r=c.getBoundingClientRect(),xx=Math.floor((e.clientX-r.left)/cell),yy=Math.floor((e.clientY-r.top)/cell);return xx<0||yy<0||xx>=cols||yy>=rows?-1:yy*cols+xx}c.onpointerdown=e=>{e.preventDefault();drawing=true;c.setPointerCapture(e.pointerId);let i=pos(e);if(i>=0){gene[i]=gene[i]?0:1;last=i;draw()}};c.onpointermove=e=>{if(!drawing)return;let i=pos(e);if(i>=0&&i!==last){gene[i]=1;last=i;draw()}};c.onpointerup=c.onpointercancel=()=>{drawing=false;last=-1};document.querySelectorAll('a').forEach(a=>a.addEventListener('click',async e=>{e.preventDefault();let h=a.href;await finalize(false);location.href=h}));addEventListener('pagehide',()=>finalize(true));addEventListener('resize',()=>{clearTimeout(window._r);window._r=setTimeout(fit,120)});fit();</script></body></html>
