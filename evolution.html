<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>進化論ゲーム</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080d12;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif}body{padding:max(7px,env(safe-area-inset-top)) 7px max(7px,env(safe-area-inset-bottom));display:flex;flex-direction:column}.top{display:flex;align-items:center;gap:7px;min-height:39px}.back{color:#cbd6e2;text-decoration:none;font-size:22px;padding:4px 8px}.title{font-size:17px;font-weight:900;flex:1}.admin{display:grid;place-items:center;width:30px;height:30px;border:1px solid #ffffff18;border-radius:9px;background:#15212d;color:#fff;text-decoration:none;font-size:14px}.stats{text-align:right;font-size:9px;color:#93a5b7;line-height:1.4}.boardWrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}.board{background:#0b1219;box-shadow:0 0 0 1px #ffffff18;touch-action:none;overflow:hidden}.board canvas{display:block;width:100%;height:100%;image-rendering:pixelated}.legend{display:flex;justify-content:center;gap:10px;font-size:9px;color:#9badbd;padding:5px 0 1px}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:3px}.controls{display:grid;grid-template-columns:1fr 1.25fr 1fr 1fr;gap:5px}.controls button{border:1px solid #ffffff18;border-radius:11px;background:#182432;color:#fff;min-height:40px;font-weight:800;font-size:11px}.controls .run{background:#25445d}.hint{text-align:center;color:#718397;font-size:8px;padding-top:4px;white-space:nowrap}.save{color:#60778d}</style></head><body><div class="top"><a class="back" href="index.html">‹</a><div class="title">進化論ゲーム</div><a class="admin" href="evolution-admin.html" aria-label="管理画面">📊</a><div class="stats">世代 <b id="gen">0</b>　生命 <b id="live">0</b><br>系統 <b id="species">0</b>　変異 <b id="mut">0</b></div></div><div class="boardWrap" id="wrap"><div class="board" id="board"><canvas id="c"></canvas></div></div><div class="legend"><span><i class="dot" style="background:#71f49a"></i>原種 B3/S23</span><span><i class="dot" style="background:#55b8ff"></i>変異系統</span><span><i class="dot" style="background:#ffca55"></i>新しい変異</span></div><div class="controls"><button id="clear">全消し</button><button class="run" id="run">▶ スタート</button><button id="random">ランダム</button><button id="step">1世代</button></div><div class="hint">親の法則を遺伝。誕生時0.1%で生存条件が1つだけ突然変異。<span class="save" id="saveState">記録待機</span></div><script>
const SUPABASE_URL='https://heeigtgfvtsowlqttrio.supabase.co';
const SUPABASE_KEY='sb_publishable_29reD6BfZX0IVvXPgDh5ag_Twu9Ezrn';
const c=document.getElementById('c'),x=c.getContext('2d'),board=document.getElementById('board'),wrap=document.getElementById('wrap');let cols,rows,cell=4,gene,nextGene,age,nextAge,running=false,timer,generation=0,mutations=0,drawing=false,last=-1,lastSavedGeneration=-1,finalized=false;const runId=crypto.randomUUID(),runStartedAt=Date.now();const genes=[{b:1<<3,s:(1<<2)|(1<<3),color:'#71f49a',parent:null,firstGeneration:0,mutationBit:null}];const palette=['#55b8ff','#b78cff','#ff6f91','#59dfcf','#ff9f55','#d4ee66','#8ca8ff','#f06ee5'];
function ruleString(g){let b='',s='';for(let i=0;i<=8;i++){if(g.b&(1<<i))b+=i;if(g.s&(1<<i))s+=i}return `B${b}/S${s}`}
function fit(){let w=wrap.clientWidth,h=wrap.clientHeight;cols=Math.floor(w/cell);rows=Math.floor(h/cell);board.style.width=cols*cell+'px';board.style.height=rows*cell+'px';let d=Math.min(devicePixelRatio||1,2);c.width=cols*cell*d;c.height=rows*cell*d;x.setTransform(d,0,0,d,0,0);gene=new Uint16Array(cols*rows);nextGene=new Uint16Array(cols*rows);age=new Uint8Array(cols*rows);nextAge=new Uint8Array(cols*rows);generation=0;mutations=0;lastSavedGeneration=-1;draw()}
function countsByGene(){const counts=new Map();for(const v of gene)if(v)counts.set(v-1,(counts.get(v-1)||0)+1);return counts}
function draw(){x.fillStyle='#0b1219';x.fillRect(0,0,cols*cell,rows*cell);let live=0,set=new Set;for(let i=0;i<gene.length;i++)if(gene[i]){live++;let g=gene[i]-1;set.add(g);x.fillStyle=genes[g]?.color||'#fff';x.fillRect((i%cols)*cell,((i/cols)|0)*cell,cell,cell)}document.getElementById('gen').textContent=generation;document.getElementById('live').textContent=live;document.getElementById('species').textContent=set.size;document.getElementById('mut').textContent=mutations}
function mutate(parent){let p=genes[parent],s=p.s;let bit=Math.floor(Math.random()*7)+1;s^=1<<bit;if(!s)s=1<<2;for(let i=0;i<genes.length;i++)if(genes[i].b===p.b&&genes[i].s===s)return i;genes.push({b:p.b,s,color:palette[(genes.length-1)%palette.length],parent,firstGeneration:generation+1,mutationBit:bit});mutations++;return genes.length-1}
async function saveSnapshot(force=false,isFinal=false,keepalive=false){if(!isFinal&&!force&&generation%10!==0)return true;if(!isFinal&&lastSavedGeneration===generation)return true;const counts=countsByGene();let total=0;for(const n of counts.values())total+=n;const genotype_summary=[...counts.entries()].map(([g,population])=>({gene_id:g,rule:ruleString(genes[g]),population,share:total?population/total:0,parent_gene_id:genes[g].parent,first_generation:genes[g].firstGeneration,mutation_bit:genes[g].mutationBit}));const now=Date.now(),payload={run_id:runId,generation,total_population:total,lineage_count:counts.size,mutations_total:mutations,genotype_summary,started_at:new Date(runStartedAt).toISOString(),ended_at:isFinal?new Date(now).toISOString():null,elapsed_seconds:Math.max(0,Math.round((now-runStartedAt)/1000)),is_final:isFinal};try{if(!isFinal)document.getElementById('saveState').textContent='保存中';const r=await fetch(`${SUPABASE_URL}/rest/v1/evolution_game_snapshots`,{method:'POST',headers:{apikey:SUPABASE_KEY,Authorization:`Bearer ${SUPABASE_KEY}`,'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify(payload),keepalive});if(!r.ok)throw new Error(await r.text());if(!isFinal){lastSavedGeneration=generation;document.getElementById('saveState').textContent=`保存済 ${generation}世代`;setTimeout(()=>{if(lastSavedGeneration===generation)document.getElementById('saveState').textContent='10世代ごと自動保存'},900)}return true}catch(e){console.error('snapshot save failed',e);if(!isFinal)document.getElementById('saveState').textContent='保存失敗';return false}}
async function finalizeRun(keepalive=false){if(finalized)return true;finalized=true;clearInterval(timer);running=false;return saveSnapshot(true,true,keepalive)}
function step(){nextGene.fill(0);nextAge.fill(0);for(let y=0;y<rows;y++)for(let xx=0;xx<cols;xx++){let counts=0,parents=[];for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){if(!dx&&!dy)continue;let nx=xx+dx,ny=y+dy;if(nx<0||ny<0||nx>=cols||ny>=rows)continue;let v=gene[ny*cols+nx];if(v){counts++;parents.push(v-1)}}let i=y*cols+xx;if(gene[i]){let g=gene[i]-1;if(genes[g].s&(1<<counts)){nextGene[i]=gene[i];nextAge[i]=Math.min(255,age[i]+1)}}else if(counts===3&&parents.length){let parent=parents[Math.floor(Math.random()*parents.length)],child=Math.random()<.001?mutate(parent):parent;nextGene[i]=child+1;nextAge[i]=1}}let t=gene;gene=nextGene;nextGene=t;t=age;age=nextAge;nextAge=t;generation++;draw();saveSnapshot(false)}
function run(){running=!running;document.getElementById('run').textContent=running?'⏸ ストップ':'▶ スタート';clearInterval(timer);if(running){timer=setInterval(step,85)}else{saveSnapshot(true)}}
function pos(e){let r=c.getBoundingClientRect(),xx=Math.floor((e.clientX-r.left)/cell),yy=Math.floor((e.clientY-r.top)/cell);return xx<0||yy<0||xx>=cols||yy>=rows?-1:yy*cols+xx}
c.onpointerdown=e=>{e.preventDefault();drawing=true;c.setPointerCapture(e.pointerId);let i=pos(e);if(i>=0){gene[i]=gene[i]?0:1;last=i;draw()}};c.onpointermove=e=>{if(!drawing)return;e.preventDefault();let i=pos(e);if(i>=0&&i!==last){gene[i]=1;last=i;draw()}};c.onpointerup=c.onpointercancel=()=>{drawing=false;last=-1};document.getElementById('run').onclick=run;document.getElementById('step').onclick=()=>{if(!running)step()};document.getElementById('clear').onclick=()=>{if(running)run();gene.fill(0);generation=0;mutations=0;lastSavedGeneration=-1;draw();document.getElementById('saveState').textContent='記録待機'};document.getElementById('random').onclick=()=>{if(running)run();for(let i=0;i<gene.length;i++)gene[i]=Math.random()<.22?1:0;generation=0;mutations=0;lastSavedGeneration=-1;draw();saveSnapshot(true)};
document.querySelectorAll('a.back,a.admin').forEach(a=>a.addEventListener('click',async e=>{e.preventDefault();const href=a.href;await finalizeRun(false);location.href=href}));
addEventListener('pagehide',()=>{finalizeRun(true)});addEventListener('resize',()=>{clearTimeout(window._r);window._r=setTimeout(fit,120)});fit();
</script></body></html>
