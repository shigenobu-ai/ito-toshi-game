<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>進化ゲーム</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080d12;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif}body{padding:max(7px,env(safe-area-inset-top)) 7px max(7px,env(safe-area-inset-bottom));display:flex;flex-direction:column}.top{display:flex;align-items:center;gap:7px;min-height:42px}.back{color:#cbd6e2;text-decoration:none;font-size:22px;padding:4px 8px}.title{font-size:17px;font-weight:900;flex:1}.stats{text-align:right;font-size:9px;color:#93a5b7;line-height:1.45}.boardWrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}.board{background:#0b1219;box-shadow:0 0 0 1px #ffffff18;overflow:hidden;touch-action:none}.board canvas{display:block;width:100%;height:100%;image-rendering:pixelated}.legend{text-align:center;color:#91a4b6;font-size:8px;padding:5px 0}.controls{display:grid;grid-template-columns:1fr 1.25fr 1fr 1fr;gap:5px}.controls button{border:1px solid #ffffff18;border-radius:11px;background:#182432;color:#fff;min-height:40px;font-weight:800;font-size:11px}.controls .run{background:#25445d}.hint{text-align:center;color:#718397;font-size:8px;padding-top:4px}.event{position:absolute;left:50%;top:54px;transform:translateX(-50%);z-index:4;background:#ffca55;color:#111;padding:6px 11px;border-radius:99px;font-size:10px;font-weight:900;opacity:0;transition:.15s;pointer-events:none}.event.show{opacity:1}</style></head><body><div class="event" id="toast"></div><div class="top"><a class="back" href="index.html">‹</a><div class="title">進化ゲーム</div><div class="stats">世代 <b id="gen">0</b>　生命 <b id="live">0</b><br>系統 <b id="lineages">0</b>　変異 <b id="mut">0</b></div></div><div class="boardWrap" id="wrap"><div class="board" id="board"><canvas id="c"></canvas></div></div><div class="legend">同じ一枚の世界で、生命が生まれ・受け継ぎ・変異します</div><div class="controls"><button id="clear">全消し</button><button class="run" id="run">▶ スタート</button><button id="random">原始の海</button><button id="step">1世代</button></div><div class="hint">基本は Conway B3/S23。誕生時に近隣のゲノムを継承し、ごく稀に局所ルールが1ビット変異。</div><script>
const c=document.getElementById('c'),ctx=c.getContext('2d'),wrap=document.getElementById('wrap'),board=document.getElementById('board');let W,H,cell=4,state,next,running=false,timer,generation=0,mutationCount=0,drawing=false,last=-1;const genEl=document.getElementById('gen'),liveEl=document.getElementById('live'),linEl=document.getElementById('lineages'),mutEl=document.getElementById('mut'),runBtn=document.getElementById('run'),toast=document.getElementById('toast');const MUT=.00035,ancestor=0x0406;let genomes=[ancestor],colors=['#71f49a'];const palette=['#55b8ff','#b78cff','#ff6f91','#59dfcf','#ff9f55','#d4ee66','#8ca8ff','#f06ee5','#f4d35e','#9bf6ff'];
function msg(t){toast.textContent=t;toast.classList.add('show');clearTimeout(window._tt);window._tt=setTimeout(()=>toast.classList.remove('show'),850)}
function born(g,n){return !!(g&(1<<(8+n)))}function survive(g,n){return !!(g&(1<<n))}function rule(g){let b='',s='';for(let n=0;n<=8;n++){if(born(g,n))b+=n;if(survive(g,n))s+=n}return `B${b}/S${s}`}
function geneId(g){let i=genomes.indexOf(g);if(i>=0)return i;genomes.push(g);colors.push(palette[(genomes.length-2)%palette.length]);return genomes.length-1}
function mutate(g){let bit=Math.floor(Math.random()*16),ng=g^(1<<bit);if(!ng)return g;mutationCount++;let id=geneId(ng);msg(`変異 ${rule(g)} → ${rule(ng)}`);return genomes[id]}
function fit(){W=Math.max(40,Math.floor(wrap.clientWidth/cell));H=Math.max(40,Math.floor(wrap.clientHeight/cell));board.style.width=W*cell+'px';board.style.height=H*cell+'px';let d=Math.min(devicePixelRatio||1,2);c.width=W*cell*d;c.height=H*cell*d;ctx.setTransform(d,0,0,d,0,0);state=new Uint32Array(W*H);next=new Uint32Array(W*H);generation=0;mutationCount=0;genomes=[ancestor];colors=['#71f49a'];draw()}
function draw(){ctx.fillStyle='#0b1219';ctx.fillRect(0,0,W*cell,H*cell);let live=0,ls=new Set;for(let i=0;i<state.length;i++)if(state[i]){live++;let gi=geneId(state[i]-1);ls.add(gi);ctx.fillStyle=colors[gi]||'#fff';ctx.fillRect((i%W)*cell,((i/W)|0)*cell,cell,cell)}genEl.textContent=generation;liveEl.textContent=live;linEl.textContent=ls.size;mutEl.textContent=mutationCount}
function step(){next.fill(0);for(let y=0;y<H;y++)for(let x=0;x<W;x++){let i=y*W+x,n=0,parents=[];for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){if(!dx&&!dy)continue;let xx=(x+dx+W)%W,yy=(y+dy+H)%H,v=state[yy*W+xx];if(v){n++;parents.push(v-1)}}if(state[i]){let g=state[i]-1;if(survive(g,n))next[i]=g+1}else if(parents.length){/* Birth is decided by a nearby genome; Conway ancestor remains B3/S23. */let p=parents[Math.floor(Math.random()*parents.length)];if(born(p,n)){let g=Math.random()<MUT?mutate(p):p;next[i]=g+1}}}let t=state;state=next;next=t;generation++;draw()}
function soup(){state.fill(0);genomes=[ancestor];colors=['#71f49a'];generation=0;mutationCount=0;for(let y=3;y<H-3;y++)for(let x=3;x<W-3;x++)if(Math.random()<.22)state[y*W+x]=ancestor+1;draw()}
function toggle(){running=!running;runBtn.textContent=running?'⏸ ストップ':'▶ スタート';clearInterval(timer);if(running)timer=setInterval(step,75)}runBtn.onclick=toggle;document.getElementById('step').onclick=()=>{if(!running)step()};document.getElementById('clear').onclick=()=>{if(running)toggle();state.fill(0);generation=0;mutationCount=0;genomes=[ancestor];colors=['#71f49a'];draw()};document.getElementById('random').onclick=()=>{if(running)toggle();soup()};function pos(e){let r=c.getBoundingClientRect(),x=Math.floor((e.clientX-r.left)/cell),y=Math.floor((e.clientY-r.top)/cell);return x<0||y<0||x>=W||y>=H?-1:y*W+x}c.onpointerdown=e=>{e.preventDefault();drawing=true;c.setPointerCapture(e.pointerId);let i=pos(e);if(i>=0){state[i]=state[i]?0:ancestor+1;last=i;draw()}};c.onpointermove=e=>{if(!drawing)return;let i=pos(e);if(i>=0&&i!==last){state[i]=ancestor+1;last=i;draw()}};c.onpointerup=c.onpointercancel=()=>{drawing=false;last=-1};addEventListener('resize',()=>{clearTimeout(window._r);window._r=setTimeout(fit,120)});fit();soup();</script></body></html>
