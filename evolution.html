<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>進化ゲーム</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080d12;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif}body{padding:max(7px,env(safe-area-inset-top)) 7px max(7px,env(safe-area-inset-bottom));display:flex;flex-direction:column}.top{display:flex;align-items:center;gap:7px;min-height:42px}.back{color:#cbd6e2;text-decoration:none;font-size:22px;padding:4px 8px}.title{font-size:17px;font-weight:900;flex:1}.stats{text-align:right;font-size:9px;color:#93a5b7;line-height:1.45}.boardWrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}.board{background:#0b1219;box-shadow:0 0 0 1px #ffffff18;overflow:hidden}.board canvas{display:block;width:100%;height:100%;image-rendering:pixelated}.info{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;padding:5px 0}.card{background:#111b25;border:1px solid #ffffff14;border-radius:9px;padding:5px;text-align:center}.card b{display:block;font-size:13px}.card span{font-size:7px;color:#8295a7}.controls{display:grid;grid-template-columns:1fr 1.25fr 1fr;gap:5px}.controls button{border:1px solid #ffffff18;border-radius:11px;background:#182432;color:#fff;min-height:40px;font-weight:800;font-size:11px}.controls .run{background:#25445d}.hint{text-align:center;color:#718397;font-size:8px;padding-top:4px}.event{position:absolute;left:50%;top:54px;transform:translateX(-50%);z-index:4;background:#71f49a;color:#07110b;padding:6px 11px;border-radius:99px;font-size:10px;font-weight:900;opacity:0;transition:.15s;pointer-events:none}.event.show{opacity:1}</style></head><body><div class="event" id="toast"></div><div class="top"><a class="back" href="index.html">‹</a><div class="title">進化ゲーム</div><div class="stats">進化世代 <b id="evo">0</b><br>候補 <b id="tested">0</b> / <b id="popN">24</b></div></div><div class="boardWrap" id="wrap"><div class="board" id="board"><canvas id="c"></canvas></div></div><div class="info"><div class="card"><b id="score">0</b><span>最高スコア</span></div><div class="card"><b id="life">0</b><span>活動世代</span></div><div class="card"><b id="peak">0</b><span>最大生命</span></div><div class="card"><b id="cells">0</b><span>DNA生命数</span></div></div><div class="controls"><button id="reset">初期化</button><button class="run" id="run">▶ 進化開始</button><button id="one">1世代進化</button></div><div class="hint">生命ルールは常に Conway B3/S23。進化するのは初期配置（DNA）だけ。</div><script>
const c=document.getElementById('c'),ctx=c.getContext('2d'),wrap=document.getElementById('wrap'),board=document.getElementById('board');const SEED=18,POP=24,STEPS=260,ELITE=6,MUT=.035;let W,H,cell=4,running=false,timer=null,evoGen=0,testCount=0,pop=[],champ=null,champResult=null,anim=null,animGen=0;const evo=document.getElementById('evo'),tested=document.getElementById('tested'),scoreEl=document.getElementById('score'),lifeEl=document.getElementById('life'),peakEl=document.getElementById('peak'),cellsEl=document.getElementById('cells'),toast=document.getElementById('toast'),runBtn=document.getElementById('run');
function msg(t){toast.textContent=t;toast.classList.add('show');clearTimeout(window._tt);window._tt=setTimeout(()=>toast.classList.remove('show'),900)}
function randomSeed(){let a=new Uint8Array(SEED*SEED);for(let i=0;i<a.length;i++)a[i]=Math.random()<.28?1:0;return a}
function clone(a){return new Uint8Array(a)}
function mutate(a){let b=clone(a);for(let i=0;i<b.length;i++)if(Math.random()<MUT)b[i]^=1;return b}
function cross(a,b){let z=new Uint8Array(a.length),vertical=Math.random()<.5,cut=4+Math.floor(Math.random()*(SEED-8));for(let y=0;y<SEED;y++)for(let x=0;x<SEED;x++){let i=y*SEED+x;z[i]=(vertical?x<cut:y<cut)?a[i]:b[i]}return mutate(z)}
function stepGrid(g,w,h){let n=new Uint8Array(g.length);for(let y=0;y<h;y++)for(let x=0;x<w;x++){let k=0;for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){if(!dx&&!dy)continue;let xx=x+dx,yy=y+dy;if(xx>=0&&yy>=0&&xx<w&&yy<h)k+=g[yy*w+xx]}let i=y*w+x;n[i]=g[i]?(k===2||k===3):(k===3)}return n}
function placeSeed(seed,w=70,h=70){let g=new Uint8Array(w*h),ox=(w-SEED)>>1,oy=(h-SEED)>>1;for(let y=0;y<SEED;y++)for(let x=0;x<SEED;x++)if(seed[y*SEED+x])g[(oy+y)*w+ox+x]=1;return g}
function evaluate(seed){const w=70,h=70;let g=placeSeed(seed,w,h),peak=0,lastChange=0,prev=-1,activity=0,spread=0;for(let t=0;t<STEPS;t++){let count=0,minx=w,miny=h,maxx=0,maxy=0;for(let i=0;i<g.length;i++)if(g[i]){count++;let x=i%w,y=(i/w)|0;if(x<minx)minx=x;if(x>maxx)maxx=x;if(y<miny)miny=y;if(y>maxy)maxy=y}if(!count)return{score:activity+peak*.5+spread*.15,lifespan:t,peak,grid:g};peak=Math.max(peak,count);spread=Math.max(spread,(maxx-minx+1)*(maxy-miny+1));if(count!==prev){activity++;lastChange=t}prev=count;g=stepGrid(g,w,h)}let score=activity*2+peak*.65+spread*.10+lastChange*.8;return{score,lifespan:STEPS,peak,grid:g}}
function evolveOnce(){let ranked=pop.map(seed=>({seed,r:evaluate(seed)})).sort((a,b)=>b.r.score-a.r.score);testCount+=pop.length;let best=ranked[0];if(!champResult||best.r.score>champResult.score){champ=clone(best.seed);champResult=best.r;msg('新チャンピオン誕生')}let elite=ranked.slice(0,ELITE).map(x=>x.seed),next=elite.map(clone);while(next.length<POP){let a=elite[Math.floor(Math.random()*elite.length)],b=elite[Math.floor(Math.random()*elite.length)];next.push(cross(a,b))}pop=next;evoGen++;startChampion();update()}
function startChampion(){if(!champ)return;anim=placeSeed(champ,W,H);animGen=0}
function update(){evo.textContent=evoGen;tested.textContent=testCount;scoreEl.textContent=champResult?Math.round(champResult.score):0;lifeEl.textContent=champResult?champResult.lifespan:0;peakEl.textContent=champResult?champResult.peak:0;cellsEl.textContent=champ?champ.reduce((a,b)=>a+b,0):0}
function draw(){ctx.fillStyle='#0b1219';ctx.fillRect(0,0,W*cell,H*cell);if(anim){ctx.fillStyle='#71f49a';for(let i=0;i<anim.length;i++)if(anim[i])ctx.fillRect((i%W)*cell,((i/W)|0)*cell,cell,cell)}requestAnimationFrame(draw)}
function animate(){if(anim){anim=stepGrid(anim,W,H);animGen++;if(animGen>260||!anim.some(Boolean))startChampion()}}
function init(){pop=Array.from({length:POP},randomSeed);evoGen=0;testCount=0;champ=null;champResult=null;evolveOnce()}
function fit(){W=Math.max(50,Math.floor(wrap.clientWidth/cell));H=Math.max(50,Math.floor(wrap.clientHeight/cell));board.style.width=W*cell+'px';board.style.height=H*cell+'px';let d=Math.min(devicePixelRatio||1,2);c.width=W*cell*d;c.height=H*cell*d;ctx.setTransform(d,0,0,d,0,0);startChampion()}
function toggle(){running=!running;runBtn.textContent=running?'⏸ 停止':'▶ 進化開始';clearInterval(timer);if(running)timer=setInterval(evolveOnce,180)}runBtn.onclick=toggle;document.getElementById('one').onclick=()=>{if(!running)evolveOnce()};document.getElementById('reset').onclick=()=>{if(running)toggle();init()};addEventListener('resize',()=>{clearTimeout(window._r);window._r=setTimeout(fit,100)});fit();init();setInterval(animate,70);requestAnimationFrame(draw);
</script></body></html>
