<script>
(()=>{const C=6,R=12,S=50,canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),nextCanvas=document.getElementById('next'),nctx=nextCanvas.getContext('2d'),scoreEl=document.getElementById('score'),chainPop=document.getElementById('chainPop'),chainCount=document.getElementById('chainCount'),overlay=document.getElementById('overlay'),stage=document.getElementById('stage'),hero=document.getElementById('hero'),bubble=document.getElementById('bubble');const colors=['#f24f70','#55d76f','#4ca9f5','#ffd748','#b86af2'];let board,active,nextPair,score=0,running=false,last=0,acc=0,dropMs=650,raf=0,resolving=false,gesture=null,holdTimer=null,repeatTimer=null;function empty(){return Array.from({length:R},()=>Array(C).fill(null))}function rnd(){return Math.floor(Math.random()*colors.length)}function makePair(){return{a:rnd(),b:rnd()}}function cells(x,y,rot,p=active){const d=[[0,-1],[1,0],[0,1],[-1,0]][rot];return[{x,y,c:p.a},{x:x+d[0],y:y+d[1],c:p.b}]}function can(x,y,rot){return cells(x,y,rot).every(p=>p.x>=0&&p.x<C&&p.y<R&&(p.y<0||board[p.y][p.x]==null))}function spawn(){const p=nextPair||makePair();nextPair=makePair();active={x:2,y:1,rot:0,a:p.a,b:p.b};drawNext();bubble.textContent='いくよ！';if(!can(active.x,active.y,active.rot)){end();return false}return true}function move(dx,dy){if(!running||resolving||!active)return false;if(can(active.x+dx,active.y+dy,active.rot)){active.x+=dx;active.y+=dy;acc=0;draw();return true}if(dy>0)lock();return false}function react(kind,text){bubble.textContent=text;hero.classList.remove('cheer','magic');void hero.offsetWidth;hero.classList.add(kind);setTimeout(()=>hero.classList.remove(kind),800)}function rotate(){if(!running||resolving||!active)return;const nr=(active.rot+1)%4;for(const k of[0,-1,1,-2,2])if(can(active.x+k,active.y,nr)){active.x+=k;active.rot=nr;acc=0;react('cheer','くるん！');draw();return}}function hard(){if(!running||resolving||!active)return;while(can(active.x,active.y+1,active.rot))active.y++;draw();lock()}function lock(){if(!active)return;for(const p of cells(active.x,active.y,active.rot)){if(p.y<0){end();return}board[p.y][p.x]=p.c}active=null;resolve()}function groups(){const seen=Array.from({length:R},()=>Array(C).fill(false)),out=[];for(let y=0;y<R;y++)for(let x=0;x<C;x++){if(board[y][x]==null||seen[y][x])continue;const col=board[y][x],q=[[x,y]],g=[];seen[y][x]=true;while(q.length){const[cx,cy]=q.pop();g.push([cx,cy]);for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const nx=cx+dx,ny=cy+dy;if(nx>=0&&nx<C&&ny>=0&&ny<R&&!seen[ny][nx]&&board[ny][nx]===col){seen[ny][nx]=true;q.push([nx,ny])}}}if(g.length>=4)out.push(g)}return out}function gravity(){for(let x=0;x<C;x++){let w=R-1;for(let y=R-1;y>=0;y--)if(board[y][x]!=null){const v=board[y][x];board[y][x]=null;board[w--][x]=v}}}function sleep(ms){return new Promise(r=>setTimeout(r,ms))}function showChain(n){chainCount.textContent=n;chainPop.textContent=n+'れんさ！';chainPop.classList.remove('show');void chainPop.offsetWidth;chainPop.classList.add('show');react(n>=2?'magic':'cheer',n>=4?'すごーい！！':n>=2?n+'れんさ！':'やった！')}async function resolve(){resolving=true;let ch=0;while(running){const gs=groups();if(!gs.length)break;ch++;showChain(ch);await sleep(150);let removed=0;for(const g of gs)for(const[x,y]of g){board[y][x]=null;removed++}score+=removed*10*ch*ch;scoreEl.textContent=score;draw();navigator.vibrate?.(20);await sleep(180);gravity();draw();await sleep(150)}resolving=false;if(running){spawn();draw()}}function start(){board=empty();active=null;nextPair=makePair();score=0;scoreEl.textContent='0';chainCount.textContent='0';running=true;resolving=false;overlay.style.display='none';spawn();last=performance.now();acc=0;cancelAnimationFrame(raf);raf=requestAnimationFrame(loop);draw()}function end(){running=false;resolving=false;cancelAnimationFrame(raf);const best=Math.max(score,Number(localStorage.getItem('poyopoyo-best')||0));localStorage.setItem('poyopoyo-best',best);overlay.innerHTML=`<div class="card"><h1>${score}点</h1><p>ゲームオーバー<br>ベスト <strong>${best}点</strong></p><button id="again" type="button">もう一回！</button><a class="home" href="./">ミニゲームパックへ戻る</a></div>`;overlay.style.display='flex';document.getElementById('again').addEventListener('click',start)}function loop(t){if(!running)return;const dt=Math.min(100,t-last);last=t;if(!resolving&&active){acc+=dt;if(acc>=dropMs){acc=0;move(0,1)}}raf=requestAnimationFrame(loop)}function shade(hex,amt){let n=parseInt(hex.slice(1),16),r=(n>>16)+Math.round(255*amt),g=((n>>8)&255)+Math.round(255*amt),b=(n&255)+Math.round(255*amt);return'#'+[r,g,b].map(v=>Math.max(0,Math.min(255,v)).toString(16).padStart(2,'0')).join('')}function poyo(context,cx,cy,r,c,alpha=1){context.save();context.globalAlpha=alpha;const grad=context.createRadialGradient(cx-r*.35,cy-r*.45,r*.08,cx,cy,r);grad.addColorStop(0,'#fff');grad.addColorStop(.18,colors[c]);grad.addColorStop(1,shade(colors[c],-.28));context.fillStyle=grad;context.beginPath();context.arc(cx,cy,r,0,Math.PI*2);context.fill();context.strokeStyle='#ffffffd8';context.lineWidth=Math.max(1.5,r*.065);context.stroke();const ey=cy-r*.03;context.fillStyle='#fff';for(const ex of[cx-r*.22,cx+r*.22]){context.beginPath();context.ellipse(ex,ey,r*.15,r*.2,0,0,Math.PI*2);context.fill()}context.fillStyle='#20204d';for(const ex of[cx-r*.20,cx+r*.20]){context.beginPath();context.arc(ex,ey+r*.025,r*.062,0,Math.PI*2);context.fill()}context.strokeStyle='#622c68';context.lineWidth=Math.max(1.1,r*.042);context.beginPath();context.arc(cx,cy+r*.24,r*.13,.12*Math.PI,.88*Math.PI);context.stroke();context.restore()}function bridge(context,x1,y1,x2,y2,c,alpha=1){context.save();context.globalAlpha=alpha;context.strokeStyle=colors[c];context.lineWidth=22;context.lineCap='round';context.beginPath();context.moveTo(x1,y1);context.lineTo(x2,y2);context.stroke();context.restore()}function drawBoardBridges(){for(let y=0;y<R;y++)for(let x=0;x<C;x++){const c=board?.[y]?.[x];if(c==null)continue;if(x+1<C&&board[y][x+1]===c)bridge(ctx,x*S+25,y*S+25,(x+1)*S+25,y*S+25,c);if(y+1<R&&board[y+1][x]===c)bridge(ctx,x*S+25,y*S+25,x*S+25,(y+1)*S+25,c)}}function draw(){ctx.clearRect(0,0,300,600);const bg=ctx.createLinearGradient(0,0,0,600);bg.addColorStop(0,'#20215d');bg.addColorStop(1,'#090b31');ctx.fillStyle=bg;ctx.fillRect(0,0,300,600);ctx.strokeStyle='#ffffff0c';ctx.lineWidth=1;for(let x=1;x<C;x++){ctx.beginPath();ctx.moveTo(x*S,0);ctx.lineTo(x*S,600);ctx.stroke()}for(let y=1;y<R;y++){ctx.beginPath();ctx.moveTo(0,y*S);ctx.lineTo(300,y*S);ctx.stroke()}drawBoardBridges();for(let y=0;y<R;y++)for(let x=0;x<C;x++)if(board?.[y]?.[x]!=null)poyo(ctx,x*S+25,y*S+25,22,board[y][x]);if(active&&running&&!resolving){let gy=active.y;while(can(active.x,gy+1,active.rot))gy++;for(const q of cells(active.x,gy,active.rot))if(q.y>=0)poyo(ctx,q.x*S+25,q.y*S+25,21,q.c,.18);const ac=cells(active.x,active.y,active.rot);if(ac[0].c===ac[1].c)bridge(ctx,ac[0].x*S+25,ac[0].y*S+25,ac[1].x*S+25,ac[1].y*S+25,ac[0].c);for(const q of ac)if(q.y>=0)poyo(ctx,q.x*S+25,q.y*S+25,22,q.c)}}function drawNext(){nctx.clearRect(0,0,52,72);nctx.fillStyle='#171747';nctx.fillRect(0,0,52,72);if(!nextPair)return;poyo(nctx,26,23,16,nextPair.b);poyo(nctx,26,49,16,nextPair.a)}function act(a){if(a==='left')move(-1,0);else if(a==='right')move(1,0);else if(a==='rotate')rotate();else if(a==='down')move(0,1);else if(a==='hard')hard()}function stopHold(){clearTimeout(holdTimer);clearInterval(repeatTimer);holdTimer=repeatTimer=null;document.querySelectorAll('.pressed').forEach(b=>b.classList.remove('pressed'))}document.querySelectorAll('[data-act]').forEach(btn=>{const a=btn.dataset.act;btn.addEventListener('pointerdown',e=>{e.preventDefault();btn.classList.add('pressed');act(a);if(a==='left'||a==='right'||a==='down')holdTimer=setTimeout(()=>repeatTimer=setInterval(()=>act(a),85),220)});btn.addEventListener('pointerup',stopHold);btn.addEventListener('pointercancel',stopHold);btn.addEventListener('pointerleave',stopHold)});stage.addEventListener('pointerdown',e=>{if(!running)return;gesture={x:e.clientX,y:e.clientY,t:performance.now()};stage.setPointerCapture?.(e.pointerId);e.preventDefault()});stage.addEventListener('pointerup',e=>{if(!gesture||!running)return;const dx=e.clientX-gesture.x,dy=e.clientY-gesture.y,dt=performance.now()-gesture.t;gesture=null;if(Math.abs(dx)>28&&Math.abs(dx)>Math.abs(dy)){const n=Math.max(1,Math.min(3,Math.round(Math.abs(dx)/48)));for(let i=0;i<n;i++)move(dx>0?1:-1,0)}else if(dy>42&&Math.abs(dy)>Math.abs(dx)){if(dy>110)hard();else move(0,1)}else if(dt<350&&Math.abs(dx)<22&&Math.abs(dy)<22)rotate();e.preventDefault()});document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')act('left');else if(e.key==='ArrowRight')act('right');else if(e.key==='ArrowDown')act('down');else if(e.key==='ArrowUp'||e.key===' ')act('rotate')});document.addEventListener('touchmove',e=>{if(e.target.closest('.stage,.controls'))e.preventDefault()},{passive:false});document.getElementById('start').addEventListener('click',start);board=empty();nextPair=makePair();drawNext();draw()})();
</script>
