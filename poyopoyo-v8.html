body{padding:max(8px,env(safe-area-inset-top)) 8px max(12px,env(safe-area-inset-bottom));touch-action:manipulation}.wrap{width:min(440px,100%);margin:auto;display:flex;flex-direction:column;gap:8px}.header{display:flex;align-items:center;justify-content:space-between;padding:0 2px}.logo{font-size:29px;font-weight:1000;letter-spacing:-2px;text-shadow:0 3px 0 #51339b,0 5px 10px #25185d88}.logo span:nth-child(1){color:#ff5778}.logo span:nth-child(2){color:#ffd842}.logo span:nth-child(3){color:#55e17d}.logo span:nth-child(4){color:#65cfff}.scorebox{min-width:108px;border:3px solid #fff;background:#31216dcc;border-radius:18px;padding:6px 11px;text-align:right;box-shadow:0 4px 0 #211553}.scorebox small{display:block;font-size:9px;color:#dcd8ff;font-weight:900}.scorebox b{font-size:22px;line-height:1}.gameRow{display:grid;grid-template-columns:minmax(0,1fr) 112px;gap:7px;align-items:start}.stageShell{padding:6px;background:linear-gradient(180deg,#efeaff,#b9abff);border:4px solid #fff;border-radius:22px;box-shadow:0 7px 0 #35216f,0 12px 20px #24155866}.stage{position:relative;width:100%;aspect-ratio:6/12;background:linear-gradient(180deg,#191a55,#080a2d);border-radius:14px;overflow:hidden;border:3px solid #6555bd;touch-action:none}.stage canvas{display:block;width:100%;height:100%;touch-action:none}.chainPop{position:absolute;left:0;right:0;top:42%;text-align:center;font-size:31px;font-weight:1000;color:#fff76a;text-shadow:0 3px 0 #f05b74,0 6px 12px #000;opacity:0;pointer-events:none}.chainPop.show{animation:chainPop .65s ease}@keyframes chainPop{0%{opacity:0;transform:scale(.45) rotate(-8deg)}25%{opacity:1;transform:scale(1.18) rotate(4deg)}70%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.08)}}.side{display:flex;flex-direction:column;gap:7px;min-width:0}.miniRow{display:grid;grid-template-columns:1fr 1fr;gap:5px}.panel{border:3px solid #fff;border-radius:16px;background:#332274dd;padding:6px;text-align:center;box-shadow:0 5px 0 #241553}.panelTitle{font-size:9px;font-weight:900;color:#d9d4ff;margin-bottom:3px}.nextCanvas{width:42px;height:60px;display:block;margin:auto;background:#171747;border-radius:10px;border:2px solid #6f62c6}.chainStat{font-size:9px;font-weight:900}.chainStat strong{display:block;font-size:21px;color:#fff56d;line-height:1.15}.hero{position:relative;height:255px;padding:0;overflow:hidden;background:linear-gradient(180deg,#b9edff,#7969e7);border-color:#fff}.heroImg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 50%;transform-origin:50% 88%;transition:filter .18s}.hero.cheer .heroImg{animation:cheer .55s ease}.hero.magic .heroImg{animation:magic .72s ease;filter:saturate(1.15) drop-shadow(0 0 9px #fff56d)}.bubble{position:absolute;z-index:3;left:5px;right:5px;top:5px;background:#fff;color:#5a388b;border:2px solid #6a4bb0;border-radius:13px;padding:5px 3px;font-size:10px;font-weight:1000;line-height:1.18;box-shadow:0 2px 5px #3d277655}.spark{position:absolute;z-index:4;font-size:22px;opacity:0;pointer-events:none}.spark.s1{left:5px;top:82px}.spark.s2{right:3px;top:125px}.spark.s3{left:12px;bottom:24px}.hero.magic .spark{animation:spark .8s ease}.hero.magic .s2{animation-delay:.08s}.hero.magic .s3{animation-delay:.16s}@keyframes cheer{0%,100%{transform:translateY(0) rotate(0) scale(1)}45%{transform:translateY(-10px) rotate(-2deg) scale(1.055)}}@keyframes magic{0%,100%{transform:translateY(0) scale(1)}35%{transform:translateY(-18px) rotate(4deg) scale(1.1)}65%{transform:translateY(-7px) rotate(-2deg) scale(1.06)}}@keyframes spark{0%{opacity:0;transform:scale(.3) rotate(0)}35%{opacity:1;transform:scale(1.45) rotate(80deg)}100%{opacity:0;transform:scale(.55) rotate(170deg)}}.controls{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}.controls button{height:57px;border:3px solid #fff;border-radius:17px;background:linear-gradient(180deg,#fff,#dce7ff);color:#3b2a78;font-size:27px;font-weight:1000;box-shadow:0 5px 0 #503b9c;touch-action:none}.controls button:active,.controls button.pressed{transform:translateY(3px);box-shadow:0 2px 0 #503b9c;background:#fff7a7}.controls .wide{grid-column:span 2;font-size:16px}.controls .drop{font-size:15px;background:linear-gradient(180deg,#fff9ad,#ffd95f)}.hint{text-align:center;font-size:10px;font-weight:800;color:#eef0ff}.home{display:block;text-align:center;text-decoration:none;color:#fff;background:#30206caa;border:2px solid #ffffff80;border-radius:14px;padding:9px;font-size:12px;font-weight:900}.overlay{position:fixed;inset:0;background:#34216eea;backdrop-filter:blur(9px);display:flex;align-items:center;justify-content:center;padding:24px;z-index:10}.card{width:min(350px,100%);background:linear-gradient(180deg,#7164d7,#3a276f);border:4px solid #fff;border-radius:27px;padding:23px;text-align:center;box-shadow:0 10px 30px #160c42}.card h1{font-size:43px;margin:0 0 7px;color:#fff46e;text-shadow:0 4px 0 #d75391}.card p{line-height:1.7;color:#f2efff}.card button{width:100%;border:0;border-radius:17px;padding:14px;font-size:18px;font-weight:1000;color:#43307f;background:#fff56e;box-shadow:0 5px 0 #d6a91d}.card .home{margin-top:11px}@media(max-width:380px){.gameRow{grid-template-columns:minmax(0,1fr) 101px}.hero{height:232px}.controls button{height:54px}.logo{font-size:27px}}

.header{align-items:flex-start}.logo{font-size:31px;text-shadow:0 3px 0 #fff,0 5px 0 #2487c7}.logo:after{content:" Poyopoyo ★";display:block;font-size:10px;letter-spacing:.2px;color:#fff;margin:-5px 0 0 28px}.scorebox,.panel{background:linear-gradient(#168bcf,#0961a8);border-color:#d8f7ff;box-shadow:0 4px 0 #07508d}.gameRow{grid-template-columns:minmax(0,1fr) 104px}.stageShell{padding:5px;background:linear-gradient(#b9edff,#56a9e1);border-color:#d9f7ff;border-radius:15px;box-shadow:0 5px 0 #2074aa}.stage{background:linear-gradient(#06396c,#03264d);border-color:#167bb7;border-radius:8px}.panelTitle{color:#fff;font-size:11px}.nextCanvas{background:#06396c;border-color:#43a9de}.chainStat strong{color:#ffe12f}.hero{background:#fff;border-color:#ff8dbb;box-shadow:0 4px 0 #e34f92}.controls button{border-radius:50%;height:62px;border:3px solid #fff;color:#fff;text-shadow:0 2px #07508d;background:linear-gradient(#4fb7ff,#087bd1);box-shadow:0 5px 0 #075ca3}.controls button:nth-child(1){background:linear-gradient(#a77aff,#6840d5)}.controls button:nth-child(2){background:linear-gradient(#72e867,#25a943)}.controls .wide{grid-column:auto;font-size:0;background:linear-gradient(#ffd94f,#f3a70a)}.controls .wide:after{content:"↓";font-size:34px}.controls .drop{font-size:0;background:linear-gradient(#ff7eb3,#f13f86)}.controls .drop:after{content:"↓";font-size:38px}.hint{color:#1268a4;text-shadow:0 1px #fff}.home{color:#17699d;background:#ffffffaa;border-color:#53a8d2}

<body>
<div class="wrap">
<div class="header"><div class="logo"><span>ぽ</span><span>よ</span><span>ぽ</span><span>よ</span></div><div class="scorebox"><small>SCORE</small><b id="score">0</b></div></div>
<div class="gameRow">
<div class="stageShell"><div class="stage" id="stage"><canvas id="game" width="300" height="600"></canvas><div id="chainPop" class="chainPop"></div></div></div>
<div class="side">
<div class="miniRow"><div class="panel"><div class="panelTitle">NEXT</div><canvas id="next" class="nextCanvas" width="52" height="72"></canvas></div><div class="panel chainStat"><div class="panelTitle">CHAIN</div><strong id="chainCount">0</strong></div></div>
<div class="panel hero" id="hero"><div class="bubble" id="bubble">いくよ！</div><img class="heroImg" src="./assets/poyona.jpg?v=20260826-0004" alt="ポヨナ"><div class="spark s1">★</div><div class="spark s2">✨</div><div class="spark s3">✦</div></div>
</div></div>
<div class="controls"><button type="button" data-act="left">◀</button><button type="button" data-act="rotate">↻</button><button type="button" data-act="right">▶</button><button type="button" class="wide" data-act="down">▼ はやく落とす</button><button type="button" class="drop" data-act="hard">一気に落下</button></div>

</div>
<div id="overlay" class="overlay"><div class="card"><h1>ぽよぽよ</h1><p>2個1組のぽよを動かして、<strong>同じ色を4個以上</strong>つなげよう。<br>連鎖するとポヨナもリアクション！</p><button id="start" type="button">スタート！</button><a class="home" href="./">ミニゲームパックへ戻る</a></div></div>
<script>
(()=>{const C=6,R=12,S=50,canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),nextCanvas=document.getElementById('next'),nctx=nextCanvas.getContext('2d'),scoreEl=document.getElementById('score'),chainPop=document.getElementById('chainPop'),chainCount=document.getElementById('chainCount'),overlay=document.getElementById('overlay'),stage=document.getElementById('stage'),hero=document.getElementById('hero'),bubble=document.getElementById('bubble');const colors=['#f24f70','#55d76f','#4ca9f5','#ffd748','#b86af2'];let board,active,nextPair,score=0,running=false,last=0,acc=0,dropMs=650,raf=0,resolving=false,gesture=null,holdTimer=null,repeatTimer=null;function empty(){return Array.from({length:R},()=>Array(C).fill(null))}function rnd(){return Math.floor(Math.random()*colors.length)}function makePair(){return{a:rnd(),b:rnd()}}function cells(x,y,rot,p=active){const d=[[0,-1],[1,0],[0,1],[-1,0]][rot];return[{x,y,c:p.a},{x:x+d[0],y:y+d[1],c:p.b}]}function can(x,y,rot){return cells(x,y,rot).every(p=>p.x>=0&&p.x<C&&p.y<R&&(p.y<0||board[p.y][p.x]==null))}function spawn(){const p=nextPair||makePair();nextPair=makePair();active={x:2,y:1,rot:0,a:p.a,b:p.b};drawNext();bubble.textContent='いくよ！';if(!can(active.x,active.y,active.rot)){end();return false}return true}function move(dx,dy){if(!running||resolving||!active)return false;if(can(active.x+dx,active.y+dy,active.rot)){active.x+=dx;active.y+=dy;acc=0;draw();return true}if(dy>0)lock();return false}function react(kind,text){bubble.textContent=text;hero.classList.remove('cheer','magic');void hero.offsetWidth;hero.classList.add(kind);setTimeout(()=>hero.classList.remove(kind),800)}function rotate(){if(!running||resolving||!active)return;const nr=(active.rot+1)%4;for(const k of[0,-1,1,-2,2])if(can(active.x+k,active.y,nr)){active.x+=k;active.rot=nr;acc=0;react('cheer','くるん！');draw();return}}function hard(){if(!running||resolving||!active)return;while(can(active.x,active.y+1,active.rot))active.y++;draw();lock()}function lock(){if(!active)return;for(const p of cells(active.x,active.y,active.rot)){if(p.y<0){end();return}board[p.y][p.x]=p.c}active=null;resolve()}function groups(){const seen=Array.from({length:R},()=>Array(C).fill(false)),out=[];for(let y=0;y<R;y++)for(let x=0;x<C;x++){if(board[y][x]==null||seen[y][x])continue;const col=board[y][x],q=[[x,y]],g=[];seen[y][x]=true;while(q.length){const[cx,cy]=q.pop();g.push([cx,cy]);for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const nx=cx+dx,ny=cy+dy;if(nx>=0&&nx<C&&ny>=0&&ny<R&&!seen[ny][nx]&&board[ny][nx]===col){seen[ny][nx]=true;q.push([nx,ny])}}}if(g.length>=4)out.push(g)}return out}function gravity(){for(let x=0;x<C;x++){let w=R-1;for(let y=R-1;y>=0;y--)if(board[y][x]!=null){const v=board[y][x];board[y][x]=null;board[w--][x]=v}}}function sleep(ms){return new Promise(r=>setTimeout(r,ms))}function showChain(n){chainCount.textContent=n;chainPop.textContent=n+'れんさ！';chainPop.classList.remove('show');void chainPop.offsetWidth;chainPop.classList.add('show');react(n>=2?'magic':'cheer',n>=4?'すごーい！！':n>=2?n+'れんさ！':'やった！')}async function resolve(){resolving=true;let ch=0;while(running){const gs=groups();if(!gs.length)break;ch++;showChain(ch);await sleep(150);let removed=0;for(const g of gs)for(const[x,y]of g){board[y][x]=null;removed++}score+=removed*10*ch*ch;scoreEl.textContent=score;draw();navigator.vibrate?.(20);await sleep(180);gravity();draw();await sleep(150)}resolving=false;if(running){spawn();draw()}}function start(){board=empty();active=null;nextPair=makePair();score=0;scoreEl.textContent='0';chainCount.textContent='0';running=true;resolving=false;overlay.style.display='none';spawn();last=performance.now();acc=0;cancelAnimationFrame(raf);raf=requestAnimationFrame(loop);draw()}function end(){running=false;resolving=false;cancelAnimationFrame(raf);const best=Math.max(score,Number(localStorage.getItem('poyopoyo-best')||0));localStorage.setItem('poyopoyo-best',best);overlay.innerHTML=`<div class="card"><h1>${score}点</h1><p>ゲームオーバー<br>ベスト <strong>${best}点</strong></p><button id="again" type="button">もう一回！</button><a class="home" href="./">ミニゲームパックへ戻る</a></div>`;overlay.style.display='flex';document.getElementById('again').addEventListener('click',start)}function loop(t){if(!running)return;const dt=Math.min(100,t-last);last=t;if(!resolving&&active){acc+=dt;if(acc>=dropMs){acc=0;move(0,1)}}raf=requestAnimationFrame(loop)}function shade(hex,amt){let n=parseInt(hex.slice(1),16),r=(n>>16)+Math.round(255*amt),g=((n>>8)&255)+Math.round(255*amt),b=(n&255)+Math.round(255*amt);return'#'+[r,g,b].map(v=>Math.max(0,Math.min(255,v)).toString(16).padStart(2,'0')).join('')}function poyo(context,cx,cy,r,c,alpha=1){context.save();context.globalAlpha=alpha;const grad=context.createRadialGradient(cx-r*.34,cy-r*.46,r*.04,cx,cy,r*1.02);grad.addColorStop(0,'#fff');grad.addColorStop(.14,shade(colors[c],.22));grad.addColorStop(.58,colors[c]);grad.addColorStop(1,shade(colors[c],-.32));context.fillStyle=grad;context.beginPath();context.moveTo(cx-r*.82,cy+r*.33);context.bezierCurveTo(cx-r*1.06,cy-r*.10,cx-r*.91,cy-r*.72,cx-r*.38,cy-r*.92);context.bezierCurveTo(cx-r*.10,cy-r*1.02,cx+r*.08,cy-r*.98,cx+r*.23,cy-r*.88);context.bezierCurveTo(cx+r*.85,cy-r*.77,cx+r*1.04,cy-r*.13,cx+r*.84,cy+r*.37);context.bezierCurveTo(cx+r*.66,cy+r*.87,cx+r*.18,cy+r*.95,cx,cy+r*.83);context.bezierCurveTo(cx-r*.24,cy+r*.98,cx-r*.67,cy+r*.85,cx-r*.82,cy+r*.33);context.closePath();context.fill();context.strokeStyle=shade(colors[c],-.38);context.lineWidth=Math.max(1.1,r*.05);context.stroke();context.fillStyle='#ffffffd9';context.beginPath();context.ellipse(cx-r*.36,cy-r*.45,r*.17,r*.26,-.55,0,Math.PI*2);context.fill();const ey=cy-r*.04;context.fillStyle='#fff';for(const ex of[cx-r*.20,cx+r*.20]){context.beginPath();context.ellipse(ex,ey,r*.14,r*.19,0,0,Math.PI*2);context.fill()}context.fillStyle='#173b68';for(const ex of[cx-r*.18,cx+r*.18]){context.beginPath();context.arc(ex,ey+r*.025,r*.055,0,Math.PI*2);context.fill()}context.strokeStyle=shade(colors[c],-.48);context.lineWidth=Math.max(1,r*.038);context.beginPath();context.arc(cx,cy+r*.22,r*.12,.15*Math.PI,.85*Math.PI);context.stroke();context.restore()}function bridge(context,x1,y1,x2,y2,c,alpha=1){context.save();context.globalAlpha=alpha;context.strokeStyle=colors[c];context.lineWidth=22;context.lineCap='round';context.beginPath();context.moveTo(x1,y1);context.lineTo(x2,y2);context.stroke();context.restore()}function drawBoardBridges(){for(let y=0;y<R;y++)for(let x=0;x<C;x++){const c=board?.[y]?.[x];if(c==null)continue;if(x+1<C&&board[y][x+1]===c)bridge(ctx,x*S+25,y*S+25,(x+1)*S+25,y*S+25,c);if(y+1<R&&board[y+1][x]===c)bridge(ctx,x*S+25,y*S+25,x*S+25,(y+1)*S+25,c)}}function draw(){ctx.clearRect(0,0,300,600);const bg=ctx.createLinearGradient(0,0,0,600);bg.addColorStop(0,'#20215d');bg.addColorStop(1,'#090b31');ctx.fillStyle=bg;ctx.fillRect(0,0,300,600);ctx.strokeStyle='#ffffff0c';ctx.lineWidth=1;for(let x=1;x<C;x++){ctx.beginPath();ctx.moveTo(x*S,0);ctx.lineTo(x*S,600);ctx.stroke()}for(let y=1;y<R;y++){ctx.beginPath();ctx.moveTo(0,y*S);ctx.lineTo(300,y*S);ctx.stroke()}drawBoardBridges();for(let y=0;y<R;y++)for(let x=0;x<C;x++)if(board?.[y]?.[x]!=null)poyo(ctx,x*S+25,y*S+25,22,board[y][x]);if(active&&running&&!resolving){let gy=active.y;while(can(active.x,gy+1,active.rot))gy++;for(const q of cells(active.x,gy,active.rot))if(q.y>=0)poyo(ctx,q.x*S+25,q.y*S+25,21,q.c,.18);const ac=cells(active.x,active.y,active.rot);if(ac[0].c===ac[1].c)bridge(ctx,ac[0].x*S+25,ac[0].y*S+25,ac[1].x*S+25,ac[1].y*S+25,ac[0].c);for(const q of ac)if(q.y>=0)poyo(ctx,q.x*S+25,q.y*S+25,22,q.c)}}function drawNext(){nctx.clearRect(0,0,52,72);nctx.fillStyle='#171747';nctx.fillRect(0,0,52,72);if(!nextPair)return;poyo(nctx,26,23,16,nextPair.b);poyo(nctx,26,49,16,nextPair.a)}function act(a){if(a==='left')move(-1,0);else if(a==='right')move(1,0);else if(a==='rotate')rotate();else if(a==='down')move(0,1);else if(a==='hard')hard()}function stopHold(){clearTimeout(holdTimer);clearInterval(repeatTimer);holdTimer=repeatTimer=null;document.querySelectorAll('.pressed').forEach(b=>b.classList.remove('pressed'))}document.querySelectorAll('[data-act]').forEach(btn=>{const a=btn.dataset.act;btn.addEventListener('pointerdown',e=>{e.preventDefault();btn.classList.add('pressed');act(a);if(a==='left'||a==='right'||a==='down')holdTimer=setTimeout(()=>repeatTimer=setInterval(()=>act(a),85),220)});btn.addEventListener('pointerup',stopHold);btn.addEventListener('pointercancel',stopHold);btn.addEventListener('pointerleave',stopHold)});stage.addEventListener('pointerdown',e=>{if(!running)return;gesture={x:e.clientX,y:e.clientY,t:performance.now()};stage.setPointerCapture?.(e.pointerId);e.preventDefault()});stage.addEventListener('pointerup',e=>{if(!gesture||!running)return;const dx=e.clientX-gesture.x,dy=e.clientY-gesture.y,dt=performance.now()-gesture.t;gesture=null;if(Math.abs(dx)>28&&Math.abs(dx)>Math.abs(dy)){const n=Math.max(1,Math.min(3,Math.round(Math.abs(dx)/48)));for(let i=0;i<n;i++)move(dx>0?1:-1,0)}else if(dy>42&&Math.abs(dy)>Math.abs(dx)){if(dy>110)hard();else move(0,1)}else if(dt<350&&Math.abs(dx)<22&&Math.abs(dy)<22)rotate();e.preventDefault()});document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')act('left');else if(e.key==='ArrowRight')act('right');else if(e.key==='ArrowDown')act('down');else if(e.key==='ArrowUp'||e.key===' ')act('rotate')});document.addEventListener('touchmove',e=>{if(e.target.closest('.stage,.controls'))e.preventDefault()},{passive:false});document.getElementById('start').addEventListener('click',start);board=empty();nextPair=makePair();drawNext();draw()})();
</script>
