<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>進化の歴史</title><style>*{box-sizing:border-box}body{margin:0;background:#081018;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;padding:max(12px,env(safe-area-inset-top)) 12px max(18px,env(safe-area-inset-bottom))}.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}.back{font-size:25px;color:#d7e2ec;text-decoration:none;padding:2px 8px}.title{font-size:20px;font-weight:900}.sub,.muted{color:#8295a7}.sub{font-size:11px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:12px}.card,.panel{background:#111b25;border:1px solid #ffffff14;border-radius:14px}.card{padding:10px 5px;text-align:center}.card b{display:block;font-size:17px}.card span{font-size:8px;color:#8799aa}.panel{padding:12px;margin-bottom:12px}.panel h2{font-size:13px;margin:0 0 10px}.runs{display:flex;gap:7px;overflow-x:auto}.run{flex:0 0 auto;border:1px solid #ffffff18;background:#172431;color:#dce6ee;border-radius:10px;padding:8px 10px;font-size:10px}.run.active{background:#274b63}.history{display:grid;gap:7px}.event{background:#0d161f;border-radius:10px;padding:9px 10px;border-left:3px solid #ffca55;font-size:10px}.event.ext{border-left-color:#6f8090}.event.contact{border-left-color:#59dfcf}.event b{font-size:11px}.genes{display:grid;gap:6px}.gene{background:#0d161f;border-radius:9px;padding:9px}.geneTop{display:flex;justify-content:space-between;gap:8px;font-size:10px}.bar{height:5px;background:#1d2a36;border-radius:9px;margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:#76d6ff}.empty{padding:25px 8px;text-align:center;color:#8193a5;font-size:12px}.refresh{margin-left:auto;border:1px solid #ffffff18;background:#172431;color:#fff;border-radius:9px;padding:7px 10px;font-size:11px}@media(min-width:700px){body{max-width:760px;margin:auto}}</style></head><body><div class="top"><a class="back" href="evolution.html">‹</a><div><div class="title">進化の歴史</div><div class="sub">突然変異 → 遺伝型の誕生 → 初接触 → 絶滅</div></div><button class="refresh" id="refresh">更新</button></div><div class="cards"><div class="card"><b id="gen">0</b><span>最終世代</span></div><div class="card"><b id="types">0</b><span>最終遺伝型</span></div><div class="card"><b id="newTypes">0</b><span>新規遺伝型</span></div><div class="card"><b id="events">0</b><span>変異イベント</span></div></div><div class="panel"><h2>プレイ記録</h2><div class="runs" id="runs"></div></div><div class="panel"><h2>進化史</h2><div class="history" id="history"></div></div><div class="panel"><h2>終了時の遺伝型構成</h2><div class="genes" id="genes"></div></div><script>const API='https://heeigtgfvtsowlqttrio.supabase.co/functions/v1/game-records?game=evolution';let data=[],selected=null;function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function fmt(sec){sec=Number(sec)||0;return `${Math.floor(sec/60)}:${String(Math.floor(sec%60)).padStart(2,'0')}`}function mutText(e){if(e.gained_bit!=null&&e.lost_bit==null)return `S${e.gained_bit}を獲得`;if(e.lost_bit!=null&&e.gained_bit==null)return `S${e.lost_bit}を喪失`;if(e.lost_bit!=null&&e.gained_bit!=null)return `S${e.lost_bit}を失いS${e.gained_bit}を獲得`;return ''}async function load(){try{const r=await fetch(API);if(!r.ok)throw Error(await r.text());data=await r.json();render()}catch(e){console.error(e);document.getElementById('history').innerHTML='<div class="empty">記録を読み込めませんでした</div>'}}function groups(){const m=new Map();for(const d of data){if(!m.has(d.run_id))m.set(d.run_id,[]);m.get(d.run_id).push(d)}return [...m].map(([id,a])=>{a.sort((x,y)=>new Date(x.created_at)-new Date(y.created_at));return[id,a,[...a].reverse().find(x=>x.is_final)]}).filter(x=>x[2]).sort((a,b)=>new Date(b[2].created_at)-new Date(a[2].created_at)).slice(0,3)}function render(){const gs=groups();if(!gs.length){document.getElementById('runs').innerHTML='<span class="muted">完了記録なし</span>';document.getElementById('history').innerHTML='<div class="empty">進化の記録はまだありません</div>';document.getElementById('genes').innerHTML='';return}if(!selected||!gs.some(g=>g[0]===selected))selected=gs[0][0];document.getElementById('runs').innerHTML=gs.map(([id,a,f],i)=>`<button class="run ${id===selected?'active':''}" data-id="${id}">#${gs.length-i} ${new Date(f.created_at).toLocaleString('ja-JP',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}<br>${f.generation}世代 / ${fmt(f.elapsed_seconds)}</button>`).join('');document.querySelectorAll('.run').forEach(b=>b.onclick=()=>{selected=b.dataset.id;render()});const [,a,f]=gs.find(g=>g[0]===selected);document.getElementById('gen').textContent=f.generation;document.getElementById('types').textContent=f.lineage_count;document.getElementById('newTypes').textContent=f.mutations_total;document.getElementById('events').textContent=f.mutation_events_total??'-';const ev=Array.isArray(f.evolution_events)?f.evolution_events:[];document.getElementById('history').innerHTML=ev.length?ev.map(e=>e.type==='origin'?`<div class="event"><b>${e.generation}世代　新しい遺伝型</b><div>${esc(e.parent_rule)} → <b>${esc(e.rule)}</b></div><div class="muted">親 gene ${e.parent_gene_id} → gene ${e.gene_id}${mutText(e)?` / ${mutText(e)}`:''}${e.reproduction_chance!=null?` / 繁殖力 ${Math.round(Number(e.reproduction_chance)*100)}%`:''}</div></div>`:e.type==='contact'?`<div class="event contact"><b>${e.generation}世代　初接触</b><div>${esc(e.rule_a)} × ${esc(e.rule_b)}</div></div>`:e.type==='extinction'?`<div class="event ext"><b>${e.generation}世代　絶滅</b><div>${esc(e.rule)}（gene ${e.gene_id}）</div></div>`:'').join(''):'<div class="empty">進化イベントはありません</div>';const z=Array.isArray(f.genotype_summary)?[...f.genotype_summary].sort((p,q)=>q.population-p.population):[];document.getElementById('genes').innerHTML=z.length?z.map(g=>`<div class="gene"><div class="geneTop"><b>${esc(g.rule)}</b><span>${g.population}生命 / ${(Number(g.share)*100).toFixed(1)}%</span></div><div class="muted" style="font-size:9px;margin-top:3px">gene ${g.gene_id}${g.parent_gene_id==null?' / 祖先':` / 親 gene ${g.parent_gene_id}`} / 初出 ${g.first_generation}世代${g.reproduction_chance!=null?` / 繁殖力 ${Math.round(Number(g.reproduction_chance)*100)}%`:''}</div><div class="bar"><i style="width:${Math.min(100,Number(g.share)*100)}%"></i></div></div>`).join(''):'<div class="empty">生存遺伝型なし</div>'}document.getElementById('refresh').onclick=load;load();</script></body></html>
