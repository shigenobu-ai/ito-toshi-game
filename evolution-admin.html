<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>進化論ゲーム 管理画面</title><style>*{box-sizing:border-box}body{margin:0;background:#081018;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;padding:max(12px,env(safe-area-inset-top)) 12px max(18px,env(safe-area-inset-bottom))}.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}.back{font-size:25px;color:#d7e2ec;text-decoration:none;padding:2px 8px}.title{font-size:20px;font-weight:900}.sub{font-size:11px;color:#7f92a5}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:12px}.card,.panel{background:#111b25;border:1px solid #ffffff14;border-radius:14px}.card{padding:11px 6px;text-align:center}.card b{display:block;font-size:18px}.card span{font-size:8px;color:#8799aa}.panel{padding:12px;margin-bottom:12px}.panel h2{font-size:13px;margin:0 0 10px}.chart{height:210px;background:#0b141d;border-radius:10px;overflow:hidden}.chart canvas{width:100%;height:100%;display:block}.runs{display:flex;gap:7px;overflow-x:auto;padding-bottom:2px}.run{flex:0 0 auto;border:1px solid #ffffff18;background:#172431;color:#dce6ee;border-radius:10px;padding:8px 10px;font-size:10px}.run.active{background:#274b63}.rows{display:grid;gap:6px}.row{display:grid;grid-template-columns:62px 1fr 1fr 1fr 1fr;gap:6px;padding:8px 9px;border-radius:9px;background:#0d161f;font-size:9px}.genes{display:grid;gap:6px}.gene{background:#0d161f;border-radius:9px;padding:9px}.geneTop{display:flex;justify-content:space-between;gap:8px;font-size:10px}.bar{height:5px;background:#1d2a36;border-radius:9px;margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:#76d6ff}.muted{color:#8295a7}.empty{padding:28px 8px;text-align:center;color:#8193a5;font-size:12px}.refresh{margin-left:auto;border:1px solid #ffffff18;background:#172431;color:#fff;border-radius:9px;padding:7px 10px;font-size:11px}.meta{font-size:10px;color:#91a4b5;margin:-2px 0 10px}@media(min-width:700px){body{max-width:760px;margin:auto}}</style></head><body><div class="top"><a class="back" href="evolution.html">‹</a><div><div class="title">進化論ゲーム 管理画面</div><div class="sub">最新3回の完了記録</div></div><button class="refresh" id="refresh">更新</button></div><div class="cards"><div class="card"><b id="runsN">0</b><span>保管回数</span></div><div class="card"><b id="maxGen">0</b><span>最大世代</span></div><div class="card"><b id="maxPop">0</b><span>最大生命数</span></div><div class="card"><b id="maxMut">0</b><span>最大変異数</span></div></div><div class="panel"><h2>記録を選択</h2><div class="runs" id="runs"></div></div><div class="panel"><h2>生命数の推移</h2><div class="meta" id="meta">ゲーム時間 0:00</div><div class="chart"><canvas id="chart"></canvas></div></div><div class="panel"><h2>世代ごとの記録</h2><div class="rows" id="rows"></div></div><div class="panel"><h2>終了時点の系統構成</h2><div class="genes" id="genes"></div></div><script>
const URL='https://heeigtgfvtsowlqttrio.supabase.co',KEY='sb_publishable_29reD6BfZX0IVvXPgDh5ag_Twu9Ezrn';let data=[],selected=null;
function fmtTime(sec){sec=Math.max(0,Number(sec)||0);const h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),s=Math.floor(sec%60);return h?`${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`:`${m}:${String(s).padStart(2,'0')}`}
async function load(){document.getElementById('rows').innerHTML='<div class="empty">読み込み中…</div>';try{const r=await fetch(`${URL}/rest/v1/evolution_game_snapshots?select=*&order=created_at.asc&limit=2000`,{headers:{apikey:KEY}});if(!r.ok)throw new Error(`${r.status} ${await r.text()}`);data=await r.json();render()}catch(e){console.error(e);document.getElementById('rows').innerHTML='<div class="empty">記録を読み込めませんでした</div>'}}
function completedGroups(){const m=new Map();for(const d of data){if(!m.has(d.run_id))m.set(d.run_id,[]);m.get(d.run_id).push(d)}const out=[];for(const [id,a] of m){a.sort((x,y)=>new Date(x.created_at)-new Date(y.created_at));const final=[...a].reverse().find(x=>x.is_final);if(final)out.push([id,a,final])}out.sort((a,b)=>new Date(b[2].ended_at||b[2].created_at)-new Date(a[2].ended_at||a[2].created_at));return out.slice(0,3)}
function render(){const groups=completedGroups(),all=groups.flatMap(g=>g[1]);document.getElementById('runsN').textContent=groups.length;document.getElementById('maxGen').textContent=all.length?Math.max(...all.map(x=>x.generation)):0;document.getElementById('maxPop').textContent=all.length?Math.max(...all.map(x=>x.total_population)):0;document.getElementById('maxMut').textContent=all.length?Math.max(...all.map(x=>x.mutations_total)):0;if(!groups.length){document.getElementById('meta').textContent='ゲーム時間 0:00';document.getElementById('runs').innerHTML='<span class="muted">まだ完了記録がありません</span>';document.getElementById('rows').innerHTML='<div class="empty">ゲーム画面を閉じると1回分として保存されます</div>';document.getElementById('genes').innerHTML='<div class="empty">系統記録なし</div>';draw([]);return}if(!selected||!groups.some(g=>g[0]===selected))selected=groups[0][0];document.getElementById('runs').innerHTML=groups.map(([id,a,final],i)=>{const dt=new Date(final.ended_at||final.created_at).toLocaleString('ja-JP',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});return `<button class="run ${id===selected?'active':''}" data-id="${id}">#${groups.length-i}　${dt}<br>${final.generation}世代 / ${final.total_population}生命<br>系統 ${final.lineage_count} / 変異 ${final.mutations_total} / ${fmtTime(final.elapsed_seconds)}</button>`}).join('');document.querySelectorAll('.run').forEach(b=>b.onclick=()=>{selected=b.dataset.id;render()});const [,a,final]=groups.find(g=>g[0]===selected);document.getElementById('meta').textContent=`ゲーム時間 ${fmtTime(final.elapsed_seconds)}　終了 ${new Date(final.ended_at||final.created_at).toLocaleString('ja-JP')}`;document.getElementById('rows').innerHTML=[...a].reverse().map(d=>`<div class="row"><b>${d.generation}世代</b><span>生命 ${d.total_population}</span><span>系統 ${d.lineage_count}</span><span>変異 ${d.mutations_total}</span><span class="muted">${fmtTime(d.elapsed_seconds)}${d.is_final?' 終了':''}</span></div>`).join('');const genes=Array.isArray(final.genotype_summary)?[...final.genotype_summary].sort((a,b)=>b.population-a.population):[];document.getElementById('genes').innerHTML=genes.length?genes.map(z=>`<div class="gene"><div class="geneTop"><b>${esc(z.rule||'不明')}</b><span>${z.population}生命 / ${(Number(z.share||0)*100).toFixed(1)}%</span></div><div class="muted" style="font-size:9px;margin-top:3px">gene ${z.gene_id}${z.parent_gene_id==null?' / 原種':` / 親 ${z.parent_gene_id}`} / 初出 ${z.first_generation??'-'}世代${z.mutation_bit==null?'':` / S${z.mutation_bit}変異`}</div><div class="bar"><i style="width:${Math.min(100,Number(z.share||0)*100)}%"></i></div></div>`).join(''):'<div class="empty">系統記録なし</div>';draw(a)}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function draw(a){const c=document.getElementById('chart'),r=c.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2);c.width=Math.max(1,r.width*dpr);c.height=Math.max(1,r.height*dpr);const x=c.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);const w=r.width,h=r.height,p=28;x.fillStyle='#0b141d';x.fillRect(0,0,w,h);if(a.length<2){x.fillStyle='#8193a5';x.font='12px sans-serif';x.textAlign='center';x.fillText(a.length?'記録が増えるとグラフになります':'記録なし',w/2,h/2);return}const maxT=Math.max(...a.map(v=>Number(v.elapsed_seconds)||0),1),maxP=Math.max(...a.map(v=>v.total_population),1);x.strokeStyle='#314252';x.lineWidth=1;x.beginPath();x.moveTo(p,8);x.lineTo(p,h-p);x.lineTo(w-8,h-p);x.stroke();x.strokeStyle='#b78cff';x.lineWidth=2;x.beginPath();a.forEach((v,i)=>{const px=p+(w-p-10)*((Number(v.elapsed_seconds)||0)/maxT),py=8+(h-p-10)*(1-v.total_population/maxP);i?x.lineTo(px,py):x.moveTo(px,py)});x.stroke();x.fillStyle='#8193a5';x.font='9px sans-serif';x.textAlign='left';x.fillText(`MAX ${maxP}`,p+4,14);x.textAlign='right';x.fillText(fmtTime(maxT),w-8,h-8)}
document.getElementById('refresh').onclick=load;addEventListener('resize',()=>render());load();
</script></body></html>
