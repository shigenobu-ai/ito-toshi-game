<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>ぽよぽよ</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#67ceff}#gameframe{width:100%;height:100%;border:0;display:block}.poyona{position:fixed;z-index:20;right:max(12px,calc((100vw - 460px)/2 + 12px));top:260px;width:88px;height:134px;border:3px solid #fff;border-radius:18px;overflow:hidden;background:#8b79ff;box-shadow:0 5px 0 #35216f,0 10px 20px #24155877;pointer-events:none;transform-origin:50% 100%;transition:filter .2s}.poyona img{width:100%;height:100%;object-fit:cover;display:block}.poyona.cheer{animation:cheer .55s ease}.poyona.magic{animation:magic .72s ease;filter:drop-shadow(0 0 12px #fff56d)}.bubble{position:fixed;z-index:21;right:max(10px,calc((100vw - 460px)/2 + 10px));top:226px;width:92px;padding:5px 4px;border:2px solid #6a4bb0;border-radius:13px;background:#fff;color:#5a388b;font:900 10px/1.2 -apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;text-align:center;pointer-events:none}.spark{position:fixed;z-index:22;right:max(18px,calc((100vw - 460px)/2 + 18px));top:280px;font-size:24px;opacity:0;pointer-events:none}.spark.show{animation:spark .8s ease}@keyframes cheer{0%,100%{transform:translateY(0) rotate(0) scale(1)}45%{transform:translateY(-12px) rotate(-3deg) scale(1.06)}}@keyframes magic{0%,100%{transform:translateY(0) scale(1)}35%{transform:translateY(-22px) rotate(5deg) scale(1.12)}65%{transform:translateY(-8px) rotate(-3deg) scale(1.08)}}@keyframes spark{0%{opacity:0;transform:scale(.3) rotate(0)}35%{opacity:1;transform:scale(1.5) rotate(90deg)}100%{opacity:0;transform:scale(.6) rotate(180deg)}}@media(max-width:380px){.poyona{width:78px;height:119px;top:242px}.bubble{width:82px;top:210px;font-size:9px}.spark{top:258px}}</style></head><body><iframe id="gameframe" src="poyopoyo-v3.html?v=20260825-2209" title="ぽよぽよ"></iframe><div class="bubble" id="bubble">いくよ！</div><div class="poyona" id="poyona"><img src="assets/poyona.svg?v=1" alt="ポヨナ"></div><div class="spark" id="spark">✨</div><script>(()=>{const frame=document.getElementById('gameframe'),girl=document.getElementById('poyona'),bubble=document.getElementById('bubble'),spark=document.getElementById('spark');let last=0;function react(n){girl.classList.remove('cheer','magic');spark.classList.remove('show');void girl.offsetWidth;if(n>=2){girl.classList.add('magic');spark.classList.add('show');bubble.textContent=n>=4?'すごーい！！':n+'れんさ！'}else if(n===1){girl.classList.add('cheer');bubble.textContent='やった！'}else{bubble.textContent='いくよ！'}}frame.addEventListener('load',()=>{try{const d=frame.contentDocument;if(!d)return;const oldHero=d.getElementById('hero');if(oldHero){const oldGirl=oldHero.querySelector('.girl');if(oldGirl)oldGirl.style.opacity='0';const speech=oldHero.querySelector('.speech');if(speech)speech.style.opacity='0'}const chain=d.getElementById('chainCount');if(chain){last=Number(chain.textContent)||0;new MutationObserver(()=>{const n=Number(chain.textContent)||0;if(n!==last){last=n;react(n)}}).observe(chain,{childList:true,subtree:true,characterData:true})}const start=d.getElementById('start');if(start)start.addEventListener('click',()=>react(0));}catch(e){console.warn(e)}})})();</script></body></html>
