<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>糸通し30秒</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;background:#f6f0e7;color:#222}body{touch-action:none}.app{height:100%;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));display:flex;flex-direction:column}.top{display:flex;justify-content:space-between;align-items:center}.title{font-size:21px;font-weight:900}.hud{display:flex;gap:8px}.pill{background:#fff;padding:9px 12px;border-radius:999px;font-weight:800;box-shadow:0 2px 10px #0001}.game{position:relative;flex:1;margin-top:12px;border-radius:28px;overflow:hidden;background:radial-gradient(circle,#fff,#eee5d8);border:1px solid #0001}.needleBox{position:absolute;left:50%;top:43%;width:100px;height:330px;transform:translate(-50%,-50%)}.needle{position:absolute;left:36px;width:28px;height:330px;border-radius:18px;background:linear-gradient(90deg,#777,#eee 48%,#999);box-shadow:0 4px 16px #0003}.eye{position:absolute;left:43px;top:43px;width:14px;height:55px;border-radius:50%;background:#f6f0e7;box-shadow:inset 0 0 0 2px #0002}.target{position:absolute;left:43px;top:50px;width:14px;height:42px;border-radius:50%}.thread{position:absolute;width:210px;height:8px;border-radius:99px;background:#cf3540;box-shadow:0 2px 5px #7004;transform-origin:4px 4px;pointer-events:none}.thread:before{content:"";position:absolute;left:-4px;top:-3px;width:14px;height:14px;border-radius:50%;background:#9f1d27}.handle{position:absolute;width:72px;height:72px;border:2px dashed #0003;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none}.hint{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);white-space:nowrap;max-width:90%;font-size:13px;font-weight:700;color:#666;background:#ffffffbb;padding:9px 13px;border-radius:999px}.overlay{position:absolute;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:24px;background:#f6f0e7cc;backdrop-filter:blur(8px)}.card{width:min(360px,100%);background:#fff;padding:27px;border-radius:28px;text-align:center;box-shadow:0 18px 50px #0002}.card h1{font-size:36px;margin:0 0 10px}.card p{color:#666;line-height:1.65}button{display:block;width:100%;border:0;border-radius:17px;background:#222;color:#fff;padding:15px;font-size:18px;font-weight:900;margin-top:16px;touch-action:manipulation}.pop{position:absolute;left:50%;top:25%;transform:translate(-50%,-50%);font-size:46px;font-weight:900;color:#23865b;opacity:0}.pop.go{animation:pop .6s}@keyframes pop{20%{opacity:1}100%{opacity:0;transform:translate(-50%,-100%) scale(1.3)}}
</style>
</head>
<body>
<div class="app"><div class="top"><div class="title">🧵 糸通し30秒</div><div class="hud"><div class="pill">⏱ <span id="time">30.0</span></div><div class="pill">🎯 <span id="score">0</span></div></div></div><main id="game" class="game"><div id="needleBox" class="needleBox"><div class="needle"></div><div class="eye"></div><div id="target" class="target"></div></div><div id="thread" class="thread"></div><div id="handle" class="handle"></div><div id="pop" class="pop">+1</div><div class="hint">糸の左端を指で動かして針穴へ</div><div id="overlay" class="overlay"><div class="card"><h1>糸通し</h1><p>30秒で何本通せる？<br>赤い糸をドラッグして、先端を針穴に入れてください。</p><button id="start">スタート</button></div></div></main></div>
<script>
(()=>{const game=document.querySelector('#game'),thread=document.querySelector('#thread'),handle=document.querySelector('#handle'),target=document.querySelector('#target'),needle=document.querySelector('#needleBox'),overlay=document.querySelector('#overlay'),scoreEl=document.querySelector('#score'),timeEl=document.querySelector('#time'),pop=document.querySelector('#pop');let run=false,drag=false,score=0,end=0,x=30,y=300,angle=0,raf;function place(){thread.style.left=x+'px';thread.style.top=y+'px';thread.style.transform=`rotate(${angle}deg)`;handle.style.left=x+'px';handle.style.top=y+'px'}function reset(){let r=game.getBoundingClientRect();x=Math.max(25,r.width*.08);y=r.height*(.62+Math.random()*.18);angle=-8+Math.random()*16;place()}function tip(){let a=angle*Math.PI/180;return{x:x+Math.cos(a)*210,y:y+Math.sin(a)*210}}function hit(){let g=game.getBoundingClientRect(),t=target.getBoundingClientRect(),p=tip(),cx=(t.left+t.right)/2-g.left,cy=(t.top+t.bottom)/2-g.top;if(Math.abs(p.x-cx)<12&&Math.abs(p.y-cy)<25){score++;scoreEl.textContent=score;navigator.vibrate?.(25);pop.classList.remove('go');void pop.offsetWidth;pop.classList.add('go');needle.style.marginLeft=((Math.random()*2-1)*Math.min(100,score*7))+'px';needle.style.marginTop=((Math.random()*2-1)*Math.min(50,score*3))+'px';reset()}}function point(e){let r=game.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}game.addEventListener('pointerdown',e=>{if(!run)return;let p=point(e);if(Math.hypot(p.x-x,p.y-y)<95){drag=true;game.setPointerCapture?.(e.pointerId);e.preventDefault()}});game.addEventListener('pointermove',e=>{if(!drag||!run)return;let p=point(e),r=game.getBoundingClientRect();x=Math.max(5,Math.min(r.width-215,p.x));y=Math.max(5,Math.min(r.height-10,p.y));angle=Math.max(-20,Math.min(20,angle*.8+(Math.random()*2-1)*(1+score*.05)));place();hit();e.preventDefault()});game.addEventListener('pointerup',()=>drag=false);game.addEventListener('pointercancel',()=>drag=false);function tick(){if(!run)return;let left=Math.max(0,(end-performance.now())/1000);timeEl.textContent=left.toFixed(1);if(left<=0){finish();return}raf=requestAnimationFrame(tick)}function start(){score=0;scoreEl.textContent=0;timeEl.textContent='30.0';needle.style.marginLeft='0';needle.style.marginTop='0';overlay.style.display='none';run=true;end=performance.now()+30000;reset();cancelAnimationFrame(raf);raf=requestAnimationFrame(tick)}function finish(){run=false;drag=false;cancelAnimationFrame(raf);let best=Math.max(score,Number(localStorage.getItem('ito-best')||0));localStorage.setItem('ito-best',best);overlay.innerHTML=`<div class="card"><h1>${score}本！</h1><p>ベスト：<b>${best}本</b></p><button id="again">もう一回</button></div>`;overlay.style.display='flex';document.querySelector('#again').addEventListener('click',start)}document.querySelector('#start').addEventListener('click',start);reset()})();
</script>
</body></html>
