<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>糸通し</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10151d;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;color:#fff}body{touch-action:none}#game{display:block;width:100%;height:100%}.hud{position:fixed;inset:max(14px,env(safe-area-inset-top)) 16px auto 16px;z-index:3;display:flex;justify-content:space-between;pointer-events:none}.title{font-weight:900;font-size:19px}.score{font-size:24px;font-weight:900;background:#0008;padding:7px 13px;border-radius:999px}.overlay{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;padding:24px;background:#10151dcc;backdrop-filter:blur(8px)}.card{width:min(360px,100%);padding:26px;border-radius:26px;background:#1b2330;border:1px solid #ffffff18;text-align:center}.card h1{font-size:38px;margin:0 0 10px}.card p{color:#c6cfda;line-height:1.7}.card strong{color:#fff}.card button{width:100%;margin-top:18px;padding:15px;border:0;border-radius:16px;background:#fff;color:#111;font-size:18px;font-weight:900}.hint{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:3;padding:9px 14px;border-radius:999px;background:#0008;font-size:13px;font-weight:800;white-space:nowrap;pointer-events:none}</style></head><body><canvas id="game"></canvas><div class="hud"><div class="title">🧵 糸通し</div><div class="score">0</div></div><div class="hint">押している間は上昇</div><div id="overlay" class="overlay"><div class="card"><h1>糸通し</h1><p>糸は重力で落ちていきます。<br><strong>画面を押している間は上昇。</strong><br>針の上端にある穴を次々通してください。</p><button id="start">スタート</button></div></div><script>(()=>{const c=document.getElementById('game'),ctx=c.getContext('2d'),scoreEl=document.querySelector('.score'),overlay=document.getElementById('overlay');let W=0,H=0,dpr=1,running=false,pressing=false,last=0,score=0,best=0,speed=170,needles=[],trail=[],raf=0;const player={x:0,y:0,vy:0,r:5};function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;c.style.width=W+'px';c.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0);player.x=W*.27;if(!running)player.y=H*.52}function rnd(a,b){return a+Math.random()*(b-a)}function makeNeedle(x=W+80){const eyeH=rnd(44,98),eyeCenter=rnd(H*.16,H*.69),w=rnd(8,12);return{x,w,top:Math.max(14,eyeCenter-eyeH*.54-8),eyeCenter,eyeH,passed:false}}function reset(){score=0;speed=170;needles=[];trail=[];scoreEl.textContent='0';player.x=W*.27;player.y=H*.52;player.vy=0;for(let i=0;i<4;i++)needles.push(makeNeedle(W+230+i*rnd(250,320)))}function start(){reset();running=true;pressing=false;overlay.style.display='none';last=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}function gameOver(){if(!running)return;running=false;pressing=false;best=Math.max(score,Number(localStorage.getItem('ito-scroll-best')||0));localStorage.setItem('ito-scroll-best',best);navigator.vibrate?.([50,35,80]);overlay.innerHTML=`<div class="card"><h1>${score}本</h1><p>ベスト <strong>${best}本</strong></p><button id="again">もう一回</button></div>`;overlay.style.display='flex';document.getElementById('again').onclick=start}function update(dt){speed=170+Math.min(120,score*6);const gravity=620,thrust=-1380;player.vy+=gravity*dt;if(pressing)player.vy+=thrust*dt;player.vy=Math.max(-470,Math.min(370,player.vy));player.y+=player.vy*dt;if(player.y<8||player.y>H-8){gameOver();return}trail.push({y:player.y});if(trail.length>75)trail.shift();for(const n of needles)n.x-=speed*dt;const lastN=needles[needles.length-1];if(lastN&&lastN.x<W-180)needles.push(makeNeedle(W+rnd(225,325)));needles=needles.filter(n=>n.x>-80);for(const n of needles){const hitHalf=n.w*.34,tipX=player.x,tipY=player.y;const eyeTop=n.eyeCenter-n.eyeH*.50,eyeBottom=n.eyeCenter+n.eyeH*.50;if(tipX>n.x-hitHalf&&tipX<n.x+hitHalf){if(tipY<eyeTop||tipY>eyeBottom){gameOver();return}}if(!n.passed&&n.x+hitHalf<tipX){n.passed=true;score++;scoreEl.textContent=score;navigator.vibrate?.(16)}}}function drawBg(){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#16202d');g.addColorStop(1,'#0d1118');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.strokeStyle='#ffffff08';for(let y=H*.2;y<H;y+=80){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}}function drawNeedle(n){const x=n.x,w=n.w,eyeTop=n.eyeCenter-n.eyeH*.5,eyeBottom=n.eyeCenter+n.eyeH*.5,shaft=w*.34;const grad=ctx.createLinearGradient(x-w,0,x+w,0);grad.addColorStop(0,'#6d757d');grad.addColorStop(.28,'#cbd2d8');grad.addColorStop(.5,'#fff');grad.addColorStop(.68,'#b8c0c7');grad.addColorStop(1,'#5b636b');ctx.fillStyle=grad;ctx.shadowColor='#0007';ctx.shadowBlur=3;ctx.beginPath();ctx.moveTo(x,n.top);ctx.lineTo(x-w*.42,eyeTop+5);ctx.lineTo(x-w*.40,eyeBottom-5);ctx.quadraticCurveTo(x-w*.37,eyeBottom+6,x-shaft,eyeBottom+10);ctx.lineTo(x-shaft,H-22);ctx.lineTo(x,H+8);ctx.lineTo(x+shaft,H-22);ctx.lineTo(x+shaft,eyeBottom+10);ctx.quadraticCurveTo(x+w*.37,eyeBottom+6,x+w*.40,eyeBottom-5);ctx.lineTo(x+w*.42,eyeTop+5);ctx.closePath();ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#10151d';ctx.beginPath();ctx.ellipse(x,n.eyeCenter,Math.max(1.8,w*.22),n.eyeH*.46,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#f9fbfc';ctx.lineWidth=.8;ctx.stroke();ctx.strokeStyle='#ffffff99';ctx.lineWidth=.6;ctx.beginPath();ctx.moveTo(x-shaft*.10,eyeBottom+11);ctx.lineTo(x-shaft*.10,H-24);ctx.stroke()}function drawThread(){if(trail.length<2)return;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#ef4151';ctx.lineWidth=6;ctx.shadowColor='#ef415177';ctx.shadowBlur=8;ctx.beginPath();for(let i=0;i<trail.length;i++){const p=trail[i],age=trail.length-1-i,tx=player.x-age*5.2,sag=Math.pow(age/trail.length,1.65)*58,ty=p.y+sag;if(i===0)ctx.moveTo(tx,ty);else ctx.lineTo(tx,ty)}ctx.stroke();ctx.shadowBlur=0;ctx.fillStyle='#ff6874';ctx.beginPath();ctx.arc(player.x,player.y,7,0,Math.PI*2);ctx.fill()}function draw(){drawBg();for(const n of needles)drawNeedle(n);drawThread()}function loop(t){const dt=Math.min(.033,(t-last)/1000);last=t;if(running)update(dt);draw();if(running)raf=requestAnimationFrame(loop)}function down(e){if(running){pressing=true;e.preventDefault()}}function up(e){pressing=false;if(running)e?.preventDefault?.()}addEventListener('pointerdown',down,{passive:false});addEventListener('pointerup',up,{passive:false});addEventListener('pointercancel',up,{passive:false});addEventListener('resize',resize);document.getElementById('start').onclick=start;resize();reset();draw()})();</script></body></html>
