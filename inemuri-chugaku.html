<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>居眠り中学💤</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;background:#f7ead4;color:#263756}body{padding:max(8px,env(safe-area-inset-top)) 10px max(8px,env(safe-area-inset-bottom));touch-action:manipulation}.wrap{width:min(460px,100%);margin:auto}.top{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;margin-bottom:8px}.title{font-size:31px;line-height:.95;font-weight:1000;letter-spacing:-3px;color:#2b3c5c}.title .z{font-size:22px;color:#176dd6;letter-spacing:-7px;margin-left:3px}.sub{font-size:8px;font-weight:1000;letter-spacing:.08em;color:#2b3c5c;margin-top:5px}.score{flex:0 0 108px;background:linear-gradient(#40516f,#18294d);color:#fff;border:3px solid #fff;border-radius:19px;padding:7px 9px 6px;text-align:right;box-shadow:0 5px 0 #0d1d3a}.score b{font-size:25px}.score span{font-size:12px;font-weight:900;margin-left:2px}.stage{position:relative;height:470px;border:4px solid #fff;border-radius:22px;overflow:hidden;background:#f7ead4 url('./assets/BD4D7505-B26B-4F25-89EA-8CD8EBE63C44.png?v=clean1') center top/100% auto no-repeat;box-shadow:0 7px 14px #70583825;isolation:isolate}.sprite{position:absolute;background-image:url('./assets/4DB43742-A93C-480C-94BF-160B7F422EEC.png?v=clean1');background-repeat:no-repeat;background-size:768px 512px;opacity:1;pointer-events:none}.teacher{z-index:5;left:50%;top:31%;transform-origin:50% 100%;transition:transform .22s,left .22s,top .22s}.teacher.back{width:124px;height:97px;background-position:-10px -21px;transform:translateX(-50%) scale(1.38)}.teacher.turn{width:134px;height:97px;background-position:-146px -21px;transform:translateX(-50%) scale(1.4)}.teacher.front{width:138px;height:97px;background-position:-293px -21px;transform:translateX(-50%) scale(1.42)}.teacher.erase{left:88%;top:36%;width:139px;height:97px;background-position:-442px -21px;transform:translateX(-50%) scale(1.46)}.teacher.read{width:106px;height:97px;background-position:-592px -21px;transform:translateX(-50%) scale(1.4)}.student{z-index:7;left:50%;top:54.5%;transform-origin:50% 100%;transition:transform .15s}.student.normal,.student.sleepy,.student.light,.student.deep,.student.wake{width:103px;height:82px}.student.normal{background-position:-12px -237px;transform:translateX(-50%) scale(1.76)}.student.sleepy{background-position:-123px -237px;transform:translateX(-50%) scale(1.76)}.student.light{background-position:-235px -237px;transform:translateX(-50%) scale(1.79)}.student.deep{background-position:-346px -237px;transform:translateX(-50%) scale(1.83)}.student.wake{background-position:-458px -237px;transform:translateX(-50%) scale(1.79)}.student.caught{width:152px;height:82px;background-position:-568px -237px;transform:translateX(-50%) scale(1.58)}.fx{z-index:9;opacity:0;transition:opacity .12s,transform .15s}.fx.on{opacity:1}.zzz1{left:58%;top:51%;width:76px;height:56px;background-position:-12px -337px}.zzz2{left:57%;top:49%;width:77px;height:56px;background-position:-96px -337px;transform:scale(1.15)}.zzz3{left:56%;top:47%;width:78px;height:56px;background-position:-179px -337px;transform:scale(1.35)}.drool{left:52%;top:61%;width:76px;height:56px;background-position:-263px -337px;transform:scale(.72)}.alert{position:absolute;z-index:12;left:50%;top:45%;transform:translateX(-50%);opacity:0;font-size:31px;font-weight:1000;color:#e83232;text-shadow:0 3px #fff}.alert.on{animation:pop .42s ease}@keyframes pop{15%,70%{opacity:1;transform:translateX(-50%) scale(1.12)}100%{opacity:0}}.info{display:grid;gap:6px;margin-top:8px}.depth,.status{border:3px solid #fff;border-radius:17px;padding:8px 12px;text-align:center;font-size:13px;font-weight:1000;box-shadow:0 4px 0 #d7c8af}.depth{background:#fff4d9;color:#342f2c}.status{background:linear-gradient(#35588e,#203d72);color:#fff;box-shadow:0 4px 0 #172e59}.control{margin-top:9px;width:100%;height:92px;border:4px solid #fff;border-radius:24px;background:linear-gradient(#7367ee,#5b52cc);color:#fff;font-size:23px;font-weight:1000;box-shadow:0 7px 0 #4940a4;touch-action:none}.control small{display:block;font-size:10px;margin-top:5px}.control.down{transform:translateY(4px);box-shadow:0 3px 0 #4940a4}.foot,.home{text-align:center;color:#9b8c78;font-weight:900;font-size:10px}.foot{margin:12px 0 4px}.home{display:block;text-decoration:none}.overlay{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;padding:22px;background:#2b3148e8}.card{width:min(355px,100%);text-align:center;background:#fff4dd;border:5px solid #fff;border-radius:28px;padding:24px}.card h1{font-size:39px;margin:0 0 8px}.card p{font-weight:800;line-height:1.65}.card button{width:100%;border:4px solid #fff;border-radius:20px;padding:16px;background:#655bdc;color:#fff;font-size:19px;font-weight:1000}.result{font-size:31px;font-weight:1000;color:#e2505b}@media(max-height:760px){.stage{height:420px}.control{height:80px}.depth,.status{padding:6px 10px}.teacher{top:31%}.teacher.erase{top:36%}}@media(max-width:390px){.title{font-size:29px}.score{flex-basis:104px}.student.normal,.student.sleepy,.student.light,.student.deep,.student.wake{transform:translateX(-50%) scale(1.66)}.teacher.back{transform:translateX(-50%) scale(1.3)}.teacher.turn{transform:translateX(-50%) scale(1.32)}.teacher.front{transform:translateX(-50%) scale(1.34)}.teacher.erase{left:89%;transform:translateX(-50%) scale(1.36)}.teacher.read{transform:translateX(-50%) scale(1.32)}}</style></head><body><main class="wrap"><div class="top"><div><div class="title">居眠り中学<span class="z">ᶻᶻᶻ</span></div><div class="sub">SLEEP WITHOUT GETTING CAUGHT</div></div><div class="score"><b id="score">0.00</b><span>s</span></div></div><section class="stage"><div id="teacher" class="sprite teacher back"></div><div id="student" class="sprite student normal"></div><div id="zzz1" class="sprite fx zzz1"></div><div id="zzz2" class="sprite fx zzz2"></div><div id="zzz3" class="sprite fx zzz3"></div><div id="drool" class="sprite fx drool"></div><div id="alert" class="alert">先生が見た！</div></section><div class="info"><div id="depth" class="depth">眠気：起きてる</div><div id="status" class="status">先生は黒板を向いています</div></div><button class="control" id="sleepBtn">長押しで居眠り ᶻᶻᶻ<small>押し続けるほど深く眠る！</small></button><div class="foot">ミニゲームパック　by shigenobu-ai</div><a class="home" href="./">ミニゲームパックへ戻る</a></main><div class="overlay" id="overlay"><div class="card"><h1>居眠り中学💤</h1><p>先生にバレないように寝よう。<br><b>長押し＝寝る　離す＝起きる</b><br>長く押すほど深い眠りになります。</p><button id="startBtn">授業開始！</button></div></div><script>const teacher=document.getElementById('teacher'),student=document.getElementById('student'),sleepBtn=document.getElementById('sleepBtn'),scoreEl=document.getElementById('score'),overlay=document.getElementById('overlay'),statusEl=document.getElementById('status'),depthEl=document.getElementById('depth'),alertEl=document.getElementById('alert'),fx=[zzz1,zzz2,zzz3,drool];let running=false,sleeping=false,score=0,last=0,raf=0,nextAction=0,teacherState='back',sleepStart=0,started=false,token=0;const rand=(a,b)=>a+Math.random()*(b-a);function tstate(s){teacherState=s;teacher.className='sprite teacher '+s;statusEl.textContent=s==='back'?'先生は黒板を向いています':s==='turn'?'先生が振り向きそう…':s==='front'?'先生が見てる！':s==='erase'?'黒板消しを取りに行った！':'教科書を読んでいる…';if(s==='front'){alertEl.classList.remove('on');void alertEl.offsetWidth;alertEl.classList.add('on')}}function clearFx(){fx.forEach(x=>x.classList.remove('on'))}function sleepVisual(h){clearFx();if(!sleeping){student.className='sprite student normal';depthEl.textContent='眠気：起きてる';return}if(h<.8){student.className='sprite student sleepy';zzz1.classList.add('on');depthEl.textContent='眠気：うとうと'}else if(h<2){student.className='sprite student light';zzz2.classList.add('on');depthEl.textContent='眠気：居眠り'}else{student.className='sprite student deep';zzz3.classList.add('on');depthEl.textContent='眠気：深い';if(h>3.3)drool.classList.add('on')}}function schedule(){nextAction=performance.now()+rand(1450,3100)}function startGame(e){if(e){e.preventDefault();e.stopPropagation()}if(started&&running)return;started=running=true;sleeping=false;score=0;scoreEl.textContent='0.00';overlay.style.display='none';student.className='sprite student normal';clearFx();depthEl.textContent='眠気：起きてる';tstate('back');last=performance.now();schedule();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}function gameOver(){if(!running)return;running=false;sleeping=false;started=false;clearFx();student.className='sprite student caught';setTimeout(()=>{overlay.innerHTML='<div class="card"><h1>見つかった！</h1><div class="result">'+score.toFixed(2)+' 秒</div><p>居眠り記録</p><button id="retryBtn">もう一回</button></div>';overlay.style.display='flex';document.getElementById('retryBtn').onclick=startGame},360)}function teacherEvent(now){const r=Math.random();if(r<.25){tstate('erase');nextAction=now+rand(700,1150)}else if(r<.48){tstate('read');nextAction=now+rand(700,1200)}else{tstate('turn');const my=++token;nextAction=Infinity;setTimeout(()=>{if(!running||my!==token)return;tstate('front');if(sleeping)return gameOver();setTimeout(()=>{if(!running||my!==token)return;tstate('back');schedule()},rand(650,1000))},rand(280,520))}}function loop(now){if(!running)return;const dt=Math.min(.05,Math.max(0,(now-last)/1000));last=now;if(sleeping){score+=dt;scoreEl.textContent=score.toFixed(2);sleepVisual((now-sleepStart)/1000)}if(now>=nextAction){if(teacherState==='back')teacherEvent(now);else{tstate('back');schedule()}}raf=requestAnimationFrame(loop)}function down(e){e.preventDefault();if(!running||sleeping)return;if(teacherState==='front')return gameOver();sleeping=true;sleepStart=performance.now();sleepBtn.classList.add('down');sleepVisual(0)}function up(e){if(e)e.preventDefault();if(!running||!sleeping)return;sleeping=false;sleepBtn.classList.remove('down');student.className='sprite student wake';clearFx();depthEl.textContent='眠気：起きた！';setTimeout(()=>{if(running&&!sleeping){student.className='sprite student normal';depthEl.textContent='眠気：起きてる'}},260)}document.getElementById('startBtn').onclick=startGame;sleepBtn.addEventListener('pointerdown',down);sleepBtn.addEventListener('pointerup',up);sleepBtn.addEventListener('pointercancel',up);window.addEventListener('pointerup',up);</script></body></html>
