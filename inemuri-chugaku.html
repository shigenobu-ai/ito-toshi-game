<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>居眠り中学💤</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;background:#f5ead7;color:#24304a}body{padding:max(10px,env(safe-area-inset-top)) 10px max(12px,env(safe-area-inset-bottom));touch-action:manipulation}.wrap{width:min(470px,100%);margin:auto}.top{display:flex;justify-content:space-between;align-items:end;margin-bottom:8px}.title{font-size:31px;font-weight:1000;letter-spacing:-2px}.sub{font-size:9px;font-weight:900;color:#73809a}.score{background:#24304a;color:#fff;border:3px solid #fff;border-radius:16px;padding:7px 10px;min-width:108px;text-align:right;box-shadow:0 4px 0 #11192a}.score small{display:block;font-size:8px;color:#bdc7da;font-weight:900}.score b{font-size:22px}.room{position:relative;height:485px;overflow:hidden;border:5px solid #fff;border-radius:24px;background:#f0dfbf url('./assets/232E222D-6039-4ECC-AE12-11EE095D2D60.png') center/cover no-repeat;box-shadow:0 8px 0 #9f8563}.board{display:none}.teacher{position:absolute;right:66px;top:150px;width:118px;height:165px;transition:transform .2s ease;filter:drop-shadow(0 5px 3px #0003)}.teacher.back{transform:rotate(-7deg)}.teacher.look{transform:rotate(9deg) translateX(-25px) scale(1.08)}.teacher.fake{animation:fake .45s ease}@keyframes fake{50%{transform:rotate(3deg) translateX(-10px)}}.head{position:absolute;left:30px;top:0;width:58px;height:58px;border-radius:50%;background:#f1c7a8;border:3px solid #5f493d}.hair{position:absolute;left:24px;top:-4px;width:70px;height:30px;background:#31343c;border-radius:50%}.face{position:absolute;left:42px;top:21px;font-size:20px;z-index:2}.bodyT{position:absolute;left:15px;top:53px;width:88px;height:104px;border-radius:22px;background:#342d2a;border:3px solid #211d1b}.desk{position:absolute;left:26px;right:26px;bottom:62px;height:82px;background:#b57c43;border:5px solid #85582f;border-radius:8px;box-shadow:0 7px 0 #684425cc}.student{position:absolute;left:50%;bottom:99px;transform:translateX(-50%);width:136px;height:165px;transition:transform .18s ease,filter .18s ease;filter:drop-shadow(0 5px 3px #0003)}.student.sleep1{transform:translateX(-50%) rotate(6deg) translateY(8px)}.student.sleep2{transform:translateX(-50%) rotate(11deg) translateY(16px) scale(1.02)}.student.sleep3{transform:translateX(-50%) rotate(16deg) translateY(25px) scale(1.04);animation:deepBob .9s ease-in-out infinite}@keyframes deepBob{50%{transform:translateX(-50%) rotate(18deg) translateY(29px) scale(1.045)}}.sHead{position:absolute;left:35px;top:0;width:66px;height:66px;border:4px solid #5b453a;border-radius:50%;background:#f4c9ab;z-index:3}.sHair{position:absolute;left:30px;top:-5px;width:76px;height:33px;background:#2d3038;border-radius:50%;z-index:4}.sFace{position:absolute;left:50px;top:27px;font-size:22px;z-index:5}.sBody{position:absolute;left:18px;top:61px;width:100px;height:98px;border-radius:24px;background:#263f71;border:4px solid #17284d}.zzz{position:absolute;left:58%;bottom:240px;font-weight:1000;color:#2867c7;opacity:0;text-shadow:0 2px 0 #fff;transition:font-size .18s ease,opacity .18s ease,transform .18s ease}.zzz.on{opacity:1}.zzz.level1{font-size:22px;transform:rotate(-8deg)}.zzz.level2{font-size:32px;transform:translateY(-10px) rotate(-10deg);animation:zfloat 1s ease-in-out infinite}.zzz.level3{font-size:43px;transform:translateY(-21px) rotate(-12deg);animation:zfloat .75s ease-in-out infinite}@keyframes zfloat{50%{transform:translateY(-28px) rotate(-15deg);opacity:.58}}.drool{position:absolute;left:55%;bottom:202px;font-size:25px;opacity:0;transition:opacity .2s}.drool.on{opacity:1;animation:drool 1s ease-in-out infinite}@keyframes drool{50%{transform:translateY(5px) scale(1.1)}}.sleepDepth{position:absolute;left:12px;right:12px;bottom:38px;text-align:center;font-size:11px;font-weight:1000;color:#27334d;text-shadow:0 1px 0 #fff}.status{position:absolute;left:12px;right:12px;bottom:12px;text-align:center;font-size:12px;font-weight:1000;background:#ffffffb8;border-radius:10px;padding:5px}.control{margin-top:11px;height:92px;width:100%;border:4px solid #fff;border-radius:24px;background:linear-gradient(#7e78e7,#625ccc);color:#fff;font-size:20px;font-weight:1000;box-shadow:0 7px 0 #4741a0;touch-action:none}.control.down{transform:translateY(4px);box-shadow:0 3px 0 #4741a0}.hint{text-align:center;font-size:11px;font-weight:800;color:#7b6d5f;margin:8px 0}.home{display:block;text-align:center;text-decoration:none;color:#fff;background:#465268;border:3px solid #fff;border-radius:16px;padding:10px;font-size:11px;font-weight:1000}.overlay{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;padding:22px;background:#2b3148e8}.card{width:min(355px,100%);text-align:center;background:#fff4dd;border:5px solid #fff;border-radius:28px;padding:24px}.card h1{font-size:40px;margin:0 0 8px;color:#574fae}.card p{font-weight:800;line-height:1.65}.card button{position:relative;z-index:10000;width:100%;border:4px solid #fff;border-radius:18px;padding:16px;background:linear-gradient(#8c86ef,#625ccc);color:#fff;font-size:19px;font-weight:1000;box-shadow:0 6px 0 #4741a0;touch-action:manipulation}.result{font-size:31px;font-weight:1000;color:#e2505b;margin:7px 0}</style></head><body><main class="wrap"><div class="top"><div><div class="title">居眠り中学💤</div><div class="sub">SLEEP WITHOUT GETTING CAUGHT</div></div><div class="score"><small>睡眠時間</small><b id="score">0.00</b>s</div></div><section class="room"><div class="board"></div><div class="teacher back" id="teacher"><div class="hair"></div><div class="head"></div><div class="face" id="tface">・_・</div><div class="bodyT"></div></div><div class="desk"></div><div class="student" id="student"><div class="sHair"></div><div class="sHead"></div><div class="sFace" id="sface">・ᴗ・</div><div class="sBody"></div></div><div class="zzz" id="zzz">Z<br>z<br>z</div><div class="drool" id="drool">💧</div><div class="sleepDepth" id="sleepDepth">眠気レベル：起きてる</div><div class="status" id="status">先生は黒板を見ています</div></section><button class="control" id="sleepBtn">長押しで居眠り 💤</button><div class="hint">押し続けるほど深い眠りになる / 先生が振り向く前に離す</div><a class="home" href="./">ミニゲームパックへ戻る</a></main><div class="overlay" id="overlay"><div class="card"><h1>居眠り中学💤</h1><p>授業中、先生にバレないように居眠りしよう。<br><b>長押し＝寝る　離す＝起きる</b><br>押し続けるほど眠りが深くなります。</p><button id="startBtn" type="button">授業開始！</button></div></div><script>const teacher=document.getElementById('teacher'),tface=document.getElementById('tface'),student=document.getElementById('student'),sface=document.getElementById('sface'),zzz=document.getElementById('zzz'),drool=document.getElementById('drool'),sleepDepth=document.getElementById('sleepDepth'),statusEl=document.getElementById('status'),scoreEl=document.getElementById('score'),sleepBtn=document.getElementById('sleepBtn'),overlay=document.getElementById('overlay'),startBtn=document.getElementById('startBtn');let running=false,sleeping=false,score=0,last=0,look=false,raf=0,nextTurn=0,phase='back',dangerStart=0,started=false,sleepStart=0,sleepLevel=0;function rand(a,b){return a+Math.random()*(b-a)}function setTeacher(p){phase=p;teacher.className='teacher '+p;if(p==='look'){look=true;dangerStart=performance.now();tface.textContent='ಠ_ಠ';statusEl.textContent='先生が見てる！'}else if(p==='fake'){look=false;tface.textContent='・_・';statusEl.textContent='先生が振り向きそう…'}else{look=false;tface.textContent='・_・';statusEl.textContent='先生は黒板を見ています'}}function schedule(){nextTurn=performance.now()+rand(1400,3200)}function resetSleepVisual(){sleepLevel=0;student.className='student';zzz.className='zzz';drool.className='drool';sleepDepth.textContent='眠気レベル：起きてる'}function setSleepLevel(level){if(level===sleepLevel)return;sleepLevel=level;student.className='student sleep'+level;zzz.className='zzz on level'+level;if(level===1){sface.textContent='−_−';drool.className='drool';sleepDepth.textContent='眠気レベル：うとうと'}else if(level===2){sface.textContent='＝_＝';drool.className='drool';sleepDepth.textContent='眠気レベル：居眠り中'}else{ sface.textContent='￣﹃￣';drool.className='drool on';sleepDepth.textContent='眠気レベル：爆睡中 💧'}}function begin(e){if(e){e.preventDefault();e.stopPropagation()}if(started&&running)return;started=true;overlay.style.display='none';running=true;sleeping=false;score=0;last=performance.now();scoreEl.textContent='0.00';resetSleepVisual();sleepBtn.classList.remove('down');sface.textContent='・ᴗ・';setTeacher('back');schedule();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}function lose(){if(!running)return;running=false;sleeping=false;started=false;resetSleepVisual();sleepBtn.classList.remove('down');sface.textContent='😱';setTeacher('look');setTimeout(()=>{overlay.innerHTML='<div class="card"><h1>見つかった！</h1><div class="result">'+score.toFixed(2)+' 秒</div><button id="retryBtn" type="button">もう一回</button></div>';overlay.style.display='flex';const r=document.getElementById('retryBtn');r.addEventListener('pointerup',begin);r.addEventListener('click',begin)},250)}function loop(now){if(!running)return;const dt=Math.max(0,Math.min(.05,(now-last)/1000));last=now;if(sleeping){score+=dt;scoreEl.textContent=score.toFixed(2);const held=(now-sleepStart)/1000;if(held<1.25)setSleepLevel(1);else if(held<3.0)setSleepLevel(2);else setSleepLevel(3);if(look&&now-dangerStart>90){lose();return}}if(now>=nextTurn){if(phase==='back'){if(Math.random()<.3){setTeacher('fake');nextTurn=now+rand(320,620)}else{setTeacher('look');nextTurn=now+rand(650,1050)}}else{setTeacher('back');schedule()}}raf=requestAnimationFrame(loop)}function down(e){if(e)e.preventDefault();if(!running||sleeping)return;sleeping=true;sleepStart=performance.now();sleepBtn.classList.add('down');setSleepLevel(1);if(look)lose()}function up(e){if(e)e.preventDefault();if(!running||!sleeping)return;sleeping=false;resetSleepVisual();sleepBtn.classList.remove('down');sface.textContent=look?'😳':'・ᴗ・'}startBtn.addEventListener('pointerup',begin);startBtn.addEventListener('click',begin);sleepBtn.addEventListener('pointerdown',down);sleepBtn.addEventListener('pointerup',up);sleepBtn.addEventListener('pointercancel',up);window.addEventListener('pointerup',up);</script></body></html>
