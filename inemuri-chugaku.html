<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>居眠り中学💤</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;background:#f5ead7;color:#24304a}
body{padding:max(10px,env(safe-area-inset-top)) 10px max(12px,env(safe-area-inset-bottom));touch-action:manipulation}
.wrap{width:min(470px,100%);margin:auto}.top{display:flex;justify-content:space-between;align-items:end;margin-bottom:8px}.title{font-size:31px;font-weight:1000;letter-spacing:-2px}.sub{font-size:9px;font-weight:900;color:#73809a}.score{background:#24304a;color:#fff;border:3px solid #fff;border-radius:16px;padding:7px 10px;min-width:112px;text-align:right;box-shadow:0 4px 0 #11192a}.score small{display:block;font-size:8px;color:#bdc7da;font-weight:900}.score b{font-size:22px}
.room{position:relative;height:500px;overflow:hidden;border:5px solid #fff;border-radius:24px;background:#f0dfbf url('./assets/AE1780FF-932D-4DCD-9F6D-01DE2D4CFF89.png?v=inemuri2') center/cover no-repeat;box-shadow:0 8px 0 #9f8563}
.sprite{position:absolute;background-image:url('./assets/232E222D-6039-4ECC-AE12-11EE095D2D60.png?v=inemuri2');background-repeat:no-repeat;background-size:768px 512px;mix-blend-mode:multiply;pointer-events:none}
.teacher{z-index:3;right:63px;top:126px;transition:transform .16s ease,opacity .12s}.teacher.back{width:124px;height:97px;background-position:-10px -21px;transform:scale(1.18)}.teacher.turn{width:134px;height:97px;background-position:-146px -21px;transform:scale(1.22)}.teacher.front{width:138px;height:97px;background-position:-293px -21px;transform:scale(1.25)}.teacher.erase{width:139px;height:97px;background-position:-442px -21px;transform:scale(1.18)}.teacher.read{width:106px;height:97px;background-position:-592px -21px;transform:scale(1.2)}
.student{z-index:5;left:50%;bottom:96px;transform:translateX(-50%) scale(1.55);transform-origin:50% 100%;transition:transform .16s ease}.student.normal{width:103px;height:82px;background-position:-12px -237px}.student.sleepy{width:103px;height:82px;background-position:-123px -237px}.student.light{width:103px;height:82px;background-position:-235px -237px}.student.deep{width:103px;height:82px;background-position:-346px -237px}.student.wake{width:103px;height:82px;background-position:-458px -237px}.student.caught{width:152px;height:82px;background-position:-568px -237px;transform:translateX(-50%) scale(1.4)}
.fx{z-index:7;opacity:0;transition:opacity .12s,transform .15s;mix-blend-mode:multiply}.fx.on{opacity:1}.zzz1{left:58%;bottom:220px;width:76px;height:56px;background-position:-12px -337px;transform:scale(1)}.zzz2{left:57%;bottom:226px;width:77px;height:56px;background-position:-96px -337px;transform:scale(1.15)}.zzz3{left:55%;bottom:235px;width:78px;height:56px;background-position:-179px -337px;transform:scale(1.35)}.drool{left:52%;bottom:173px;width:76px;height:56px;background-position:-263px -337px;transform:scale(.7)}
.alert{position:absolute;z-index:8;left:50%;top:212px;transform:translateX(-50%) scale(.8);opacity:0;font-size:42px;font-weight:1000;color:#e83232;text-shadow:0 3px #fff,0 5px #7c1010}.alert.on{animation:pop .42s ease}@keyframes pop{15%,70%{opacity:1;transform:translateX(-50%) scale(1.15)}100%{opacity:0;transform:translateX(-50%) scale(1)}}
.depth{position:absolute;left:16px;right:16px;bottom:45px;z-index:10;text-align:center;font-size:12px;font-weight:1000;background:#fffbdcdd;border:3px solid #fff;border-radius:12px;padding:5px;color:#3d342e}.status{position:absolute;left:16px;right:16px;bottom:12px;z-index:10;text-align:center;font-size:12px;font-weight:1000;background:#263f71e8;color:#fff;border:2px solid #fff;border-radius:12px;padding:6px}
.control{margin-top:11px;height:92px;width:100%;border:4px solid #fff;border-radius:24px;background:linear-gradient(#7e78e7,#625ccc);color:#fff;font-size:20px;font-weight:1000;box-shadow:0 7px 0 #4741a0;touch-action:none}.control.down{transform:translateY(4px);box-shadow:0 3px 0 #4741a0}.hint{text-align:center;font-size:11px;font-weight:800;color:#7b6d5f;margin:8px 0}.home{display:block;text-align:center;text-decoration:none;color:#fff;background:#465268;border:3px solid #fff;border-radius:16px;padding:10px;font-size:11px;font-weight:1000}
.overlay{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;padding:22px;background:#2b3148e8}.card{width:min(355px,100%);text-align:center;background:#fff4dd;border:5px solid #fff;border-radius:28px;padding:24px;box-shadow:0 12px 30px #1118}.card h1{font-size:40px;margin:0 0 8px;color:#574fae}.card p{font-weight:800;line-height:1.65}.card button{position:relative;z-index:10000;width:100%;border:4px solid #fff;border-radius:18px;padding:16px;background:linear-gradient(#ffd84d,#ffad20);color:#5b3500;font-size:19px;font-weight:1000;box-shadow:0 6px 0 #c97b0d;touch-action:manipulation}.result{font-size:31px;font-weight:1000;color:#e2505b;margin:7px 0}
</style></head><body>
<main class="wrap"><div class="top"><div><div class="title">居眠り中学💤</div><div class="sub">SLEEP WITHOUT GETTING CAUGHT</div></div><div class="score"><small>睡眠時間</small><b id="score">0.00</b>s</div></div>
<section class="room" id="room"><div id="teacher" class="sprite teacher back"></div><div id="student" class="sprite student normal"></div><div id="zzz1" class="sprite fx zzz1"></div><div id="zzz2" class="sprite fx zzz2"></div><div id="zzz3" class="sprite fx zzz3"></div><div id="drool" class="sprite fx drool"></div><div id="alert" class="alert">先生が見た！</div><div id="depth" class="depth">眠気：起きてる</div><div id="status" class="status">先生は黒板を向いています</div></section>
<button class="control" id="sleepBtn">長押しで居眠り 💤</button><div class="hint">押し続けるほど深く眠る / 振り向く前に指を離す</div><a class="home" href="./">ミニゲームパックへ戻る</a></main>
<div class="overlay" id="overlay"><div class="card"><h1>居眠り中学💤</h1><p>先生にバレないように寝よう。<br><b>長押し＝寝る　離す＝起きる</b><br>長く押すほど深い眠りになります。</p><button id="startBtn" type="button">授業開始！</button></div></div>
<script>
const teacher=document.getElementById('teacher'),student=document.getElementById('student'),sleepBtn=document.getElementById('sleepBtn'),scoreEl=document.getElementById('score'),overlay=document.getElementById('overlay'),statusEl=document.getElementById('status'),depthEl=document.getElementById('depth'),alertEl=document.getElementById('alert'),fx=[document.getElementById('zzz1'),document.getElementById('zzz2'),document.getElementById('zzz3'),document.getElementById('drool')];
let running=false,sleeping=false,score=0,last=0,raf=0,nextAction=0,teacherState='back',sleepStart=0,started=false,token=0;
function rand(a,b){return a+Math.random()*(b-a)}
function tstate(s){teacherState=s;teacher.className='sprite teacher '+s;if(s==='back')statusEl.textContent='先生は黒板を向いています';if(s==='turn')statusEl.textContent='先生が振り向きそう…';if(s==='front'){statusEl.textContent='先生が見てる！';alertEl.classList.remove('on');void alertEl.offsetWidth;alertEl.classList.add('on')}if(s==='erase')statusEl.textContent='黒板消しを取っている…';if(s==='read')statusEl.textContent='教科書を読んでいる…'}
function clearFx(){fx.forEach(x=>x.classList.remove('on'))}
function sleepVisual(held){clearFx();if(!sleeping){student.className='sprite student normal';depthEl.textContent='眠気：起きてる';return}if(held<.8){student.className='sprite student sleepy';fx[0].classList.add('on');depthEl.textContent='眠気：うとうと'}else if(held<2){student.className='sprite student light';fx[1].classList.add('on');depthEl.textContent='眠気：居眠り'}else{student.className='sprite student deep';fx[2].classList.add('on');depthEl.textContent='眠気：爆睡中 💤';if(held>3.3)fx[3].classList.add('on')}}
function schedule(){nextAction=performance.now()+rand(1450,3100)}
function startGame(e){if(e){e.preventDefault();e.stopPropagation()}if(started&&running)return;started=true;running=true;sleeping=false;score=0;scoreEl.textContent='0.00';overlay.style.display='none';student.className='sprite student normal';clearFx();depthEl.textContent='眠気：起きてる';tstate('back');last=performance.now();schedule();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}
function gameOver(){if(!running)return;running=false;sleeping=false;started=false;clearFx();student.className='sprite student caught';setTimeout(()=>{overlay.innerHTML='<div class="card"><h1>見つかった！</h1><div class="result">'+score.toFixed(2)+' 秒</div><p>居眠り記録</p><button id="retryBtn" type="button">もう一回</button></div>';overlay.style.display='flex';const b=document.getElementById('retryBtn');b.addEventListener('pointerup',startGame);b.addEventListener('click',startGame)},360)}
function teacherEvent(now){const r=Math.random();if(r<.25){tstate('erase');nextAction=now+rand(650,1050)}else if(r<.48){tstate('read');nextAction=now+rand(700,1200)}else{tstate('turn');const my=++token;nextAction=Infinity;setTimeout(()=>{if(!running||my!==token)return;tstate('front');if(sleeping){gameOver();return}setTimeout(()=>{if(!running||my!==token)return;tstate('back');schedule()},rand(650,1000))},rand(280,520))}}
function loop(now){if(!running)return;const dt=Math.min(.05,Math.max(0,(now-last)/1000));last=now;if(sleeping){score+=dt;scoreEl.textContent=score.toFixed(2);sleepVisual((now-sleepStart)/1000)}if(now>=nextAction){if(teacherState==='back')teacherEvent(now);else{tstate('back');schedule()}}raf=requestAnimationFrame(loop)}
function down(e){if(e)e.preventDefault();if(!running||sleeping)return;if(teacherState==='front'){gameOver();return}sleeping=true;sleepStart=performance.now();sleepBtn.classList.add('down');sleepVisual(0)}
function up(e){if(e)e.preventDefault();if(!running||!sleeping)return;sleeping=false;sleepBtn.classList.remove('down');student.className='sprite student wake';clearFx();depthEl.textContent='眠気：起きた！';setTimeout(()=>{if(running&&!sleeping){student.className='sprite student normal';depthEl.textContent='眠気：起きてる'}},260)}
const startBtn=document.getElementById('startBtn');startBtn.addEventListener('pointerup',startGame);startBtn.addEventListener('click',startGame);sleepBtn.addEventListener('pointerdown',down);sleepBtn.addEventListener('pointerup',up);sleepBtn.addEventListener('pointercancel',up);window.addEventListener('pointerup',up);
</script></body></html>
