h:190px}.effect{z-index:9;opacity:0;transition:opacity .12s,transform .15s}.effect.on{opacity:1}.teacherFx{left:66%;top:20%;width:58px}.teacherFx.erasefx{left:75%;top:29%;width:62px}.zzz1{left:57%;top:51%;width:55px}.zzz2{left:56%;top:48%;width:62px}.zzz3{left:55%;top:45%;width:72px}.drool{left:53%;top:61%;width:44px}.studentFx{left:61%;top:52%;width:58px}.alert{position:absolute;z-index:12;left:50%;top:45%;transform:translateX(-50%);opacity:0;font-size:31px;font-weight:1000;color:#e83232;text-shadow:0 3px #fff}.alert.on{animation:pop .42s ease}@keyframes pop{15%,70%{opacity:1;transform:translateX(-50%) scale(1.12)}100%{opacity:0}}.info{display:grid;gap:6px;margin-top:8px}.depth,.status{border:3px solid #fff;border-radius:17px;padding:8px 12px;text-align:center;font-size:13px;font-weight:1000;box-shadow:0 4px 0 #d7c8af}.depth{background:#fff4d9;color:#342f2c}.status{background:linear-gradient(#35588e,#203d72);color:#fff;box-shadow:0 4px 0 #172e59}.control{margin-top:9px;width:100%;height:92px;border:4px solid #fff;border-radius:24px;background:linear-gradient(#7367ee,#5b52cc);color:#fff;font-size:23px;font-weight:1000;box-shadow:0 7px 0 #4940a4;touch-action:none}.control small{display:block;font-size:10px;margin-top:5px}.control.down{transform:translateY(4px);box-shadow:0 3px 0 #4940a4}.foot,.home{text-align:center;color:#9b8c78;font-weight:900;font-size:10px}.foot{margin:12px 0 4px}.home{display:block;text-decoration:none}.overlay{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;padding:22px;background:#2b3148e8}.card{width:min(355px,100%);text-align:center;background:#fff4dd;border:5px solid #fff;border-radius:28px;padding:24px}.card h1{font-size:39px;margin:0 0 8px}.card p{font-weight:800;line-height:1.65}.card button{width:100%;border:4px solid #fff;border-radius:20px;padding:16px;background:#655bdc;color:#fff;font-size:19px;font-weight:1000}.result{font-size:31px;font-weight:1000;color:#e2505b}@media(max-height:760px){.stage{height:420px}.control{height:80px}.depth,.status{padding:6px 10px}.teacher{top:23.5%;width:168px}.teacher.erase{top:31.5%;width:186px}.student{width:164px}.student.deep{width:170px}.student.caught{width:176px}}@media(max-width:390px){.title{font-size:29px}.score{flex-basis:104px}}</style></head><body><main class="wrap"><div class="top"><div><div class="title">居眠り中学<span class="z">ᶻᶻᶻ</span></div><div class="sub">SLEEP WITHOUT GETTING CAUGHT</div></div><div class="score"><b id="score">0.00</b><span>s</span></div></div><section class="stage"><img id="teacher" class="actor teacher" alt=""><img id="teacherFx" class="effect teacherFx" alt=""><img id="student" class="actor student" alt=""><img id="zzz1" class="effect zzz1" alt=""><img id="zzz2" class="effect zzz2" alt=""><img id="zzz3" class="effect zzz3" alt=""><img id="drool" class="effect drool" alt=""><img id="studentFx" class="effect studentFx" alt=""><div id="alert" class="alert">先生が見た！</div></section><div class="info"><div id="depth" class="depth">眠気：起きてる</div><div id="status" class="status">先生は黒板を向いています</div></div><button class="control" id="sleepBtn">長押しで居眠り ᶻᶻᶻ<small>押し続けるほど深く眠る！</small></button><div class="foot">ミニゲームパック　by shigenobu-ai</div><a class="home" href="./">ミニゲームパックへ戻る</a></main><div class="overlay" id="overlay"><div class="card"><h1>居眠り中学💤</h1><p>先生にバレないように寝よう。<br><b>長押し＝寝る　離す＝起きる</b><br>長く押すほど深い眠りになります。</p><button id="startBtn">授業開始！</button></div></div><script>const SHEET='./assets/4DB43742-A93C-480C-94BF-160B7F422EEC.png?v=ui-final1',BASE_W=1536,BASE_H=1024;const MAP={teacher_back:[40,35,220,210],teacher_turn:[300,35,230,210],teacher_front:[590,25,220,220],teacher_erase:[850,25,250,220],teacher_read:[1140,25,260,220],teacher_surprise:[35,275,150,125],teacher_exclamation:[260,270,100,130],teacher_question:[455,270,105,130],teacher_glint:[635,275,105,120],student_normal:[40,465,185,185],student_sleepy:[280,465,190,185],student_doze_light:[505,465,195,185],student_doze_deep:[730,465,195,185],student_wake:[960,455,210,195],student_caught:[1185,455,220,195],effect_zzz_small:[35,675,120,120],effect_zzz_middle:[225,670,120,125],effect_zzz_large:[395,670,130,125],effect_drool:[555,675,120,120],effect_shock:[1065,675,125,120]};const A={};function floodTransparent(ctx,w,h){const d=ctx.getImageData(0,0,w,h),p=d.data,seen=new Uint8Array(w*h),q=[];const bg=i=>{const r=p[i],g=p[i+1],b=p[i+2],mx=Math.max(r,g,b),mn=Math.min(r,g,b);return mn>205&&mx-mn<20};const push=(x,y)=>{if(x<0||y<0||x>=w||y>=h)return;const n=y*w+x;if(seen[n])return;const i=n*4;if(!bg(i))return;seen[n]=1;q.push(n)};for(let x=0;x<w;x++){push(x,0);push(x,h-1)}for(let y=0;y<h;y++){push(0,y);push(w-1,y)}for(let k=0;k<q.length;k++){const n=q[k],x=n%w,y=(n/w)|0,i=n*4;p[i+3]=0;push(x+1,y);push(x-1,y);push(x,y+1);push(x,y-1)}ctx.putImageData(d,0,0)}function keepLargest(ctx,w,h){const d=ctx.getImageData(0,0,w,h),p=d.data,seen=new Uint8Array(w*h);let best=[];for(let n=0;n<w*h;n++){if(seen[n]||p[n*4+3]<16)continue;const q=[n],comp=[];seen[n]=1;for(let k=0;k<q.length;k++){const m=q[k],x=m%w,y=(m/w)|0;comp.push(m);for(const z of [m-1,m+1,m-w,m+w]){if(z<0||z>=w*h||seen[z]||p[z*4+3]<16)continue;const zx=z%w;if(Math.abs(zx-x)>1)continue;seen[z]=1;q.push(z)}}if(comp.length>best.length)best=comp}const keep=new Uint8Array(w*h);best.forEach(n=>keep[n]=1);for(let n=0;n<w*h;n++)if(!keep[n])p[n*4+3]=0;ctx.putImageData(d,0,0)}function trimCanvas(c){const ctx=c.getContext('2d'),d=ctx.getImageData(0,0,c.width,c.height).data;let minX=c.width,minY=c.height,maxX=-1,maxY=-1;for(let y=0;y<c.height;y++)for(let x=0;x<c.width;x++)if(d[(y*c.width+x)*4+3]>8){if(x<minX)minX=x;if(x>maxX)maxX=x;if(y<minY)minY=y;if(y>maxY)maxY=y}if(maxX<0)return c;const pad=3,x=Math.max(0,minX-pad),y=Math.max(0,minY-pad),w=Math.min(c.width-x,maxX-minX+1+pad*2),h=Math.min(c.height-y,maxY-minY+1+pad*2),o=document.createElement('canvas');o.width=w;o.height=h;o.getContext('2d').drawImage(c,x,y,w,h,0,0,w,h);return o}function cut(img,key){const b=MAP[key],sx=img.naturalWidth/BASE_W,sy=img.naturalHeight/BASE_H,c=document.createElement('canvas');c.width=Math.round(b[2]*sx);c.height=Math.round(b[3]*sy);const ctx=c.getContext('2d',{willReadFrequently:true});ctx.drawImage(img,b[0]*sx,b[1]*sy,b[2]*sx,b[3]*sy,0,0,c.width,c.height);floodTransparent(ctx,c.width,c.height);keepLargest(ctx,c.width,c.height);return trimCanvas(c).toDataURL('image/png')}function loadAssets(){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>{Object.keys(MAP).forEach(k=>A[k]=cut(im,k));res()};im.onerror=rej;im.src=SHEET})}const teacher=document.getElementById('teacher'),teacherFx=document.getElementById('teacherFx'),student=document.getElementById('student'),studentFx=document.getElementById('studentFx'),sleepBtn=document.getElementById('sleepBtn'),scoreEl=document.getElementById('score'),overlay=document.getElementById('overlay'),statusEl=document.getElementById('status'),depthEl=document.getElementById('depth'),alertEl=document.getElementById('alert'),zzz1=document.getElementById('zzz1'),zzz2=document.getElementById('zzz2'),zzz3=document.getElementById('zzz3'),drool=document.getElementById('drool');let running=false,sleeping=false,score=0,last=0,raf=0,nextAction=0,teacherState='back',sleepStart=0,started=false,token=0,ready=false;const rand=(a,b)=>a+Math.random()*(b-a);function showFx(el,key){el.src=A[key];el.classList.add('on')}function hideFx(el){el.classList.remove('on')}function tstate(s){teacherState=s;teacher.className='actor teacher '+s;teacher.src=A['teacher_'+s];hideFx(teacherFx);teacherFx.className='effect teacherFx';if(s==='back')statusEl.textContent='先生は黒板を向いています';if(s==='turn'){statusEl.textContent='先生が振り向きそう…';showFx(teacherFx,'teacher_exclamation')}if(s==='front'){statusEl.textContent='先生が見てる！';showFx(teacherFx,'teacher_surprise');alertEl.classList.remove('on');void alertEl.offsetWidth;alertEl.classList.add('on')}if(s==='erase'){statusEl.textContent='黒板消しを取りに行った！';teacherFx.classList.add('erasefx');showFx(teacherFx,'teacher_glint')}if(s==='read'){statusEl.textContent='教科書を読んでいる…';showFx(teacherFx,'teacher_question')}}function clearSleepFx(){[zzz1,zzz2,zzz3,drool,studentFx].forEach(hideFx)}function studentState(s){student.className='actor student '+s;student.src=A['student_'+(s==='light'?'doze_light':s==='deep'?'doze_deep':s)]}function sleepVisual(h){clearSleepFx();if(!sleeping){studentState('normal');depthEl.textContent='眠気：起きてる';return}if(h<.8){studentState('sleepy');showFx(zzz1,'effect_zzz_small');depthEl.textContent='眠気：うとうと'}else if(h<2){studentState('light');showFx(zzz2,'effect_zzz_middle');depthEl.textContent='眠気：居眠り'}else{studentState('deep');showFx(zzz3,'effect_zzz_large');depthEl.textContent='眠気：深い';if(h>3.3)showFx(drool,'effect_drool')}}function schedule(){nextAction=performance.now()+rand(1450,3100)}function startGame(e){if(e){e.preventDefault();e.stopPropagation()}if(!ready||started&&running)return;started=running=true;sleeping=false;score=0;scoreEl.textContent='0.00';overlay.style.display='none';studentState('normal');clearSleepFx();depthEl.textContent='眠気：起きてる';tstate('back');last=performance.now();schedule();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}function gameOver(){if(!running)return;running=false;sleeping=false;started=false;clearSleepFx();studentState('caught');showFx(studentFx,'effect_shock');setTimeout(()=>{overlay.innerHTML='<div class="card"><h1>見つかった！</h1><div class="result">'+score.toFixed(2)+' 秒</div><p>居眠り記録</p><button id="retryBtn">もう一回</button></div>';overlay.style.display='flex';document.getElementById('retryBtn').onclick=startGame},360)}function teacherEvent(now){const r=Math.random();if(r<.25){tstate('erase');nextAction=now+rand(700,1150)}else if(r<.48){tstate('read');nextAction=now+rand(700,1200)}else{tstate('turn');const my=++token;nextAction=Infinity;setTimeout(()=>{if(!running||my!==token)return;tstate('front');if(sleeping)return gameOver();setTimeout(()=>{if(!running||my!==token)return;tstate('back');schedule()},rand(650,1000))},rand(280,520))}}function loop(now){if(!running)return;const dt=Math.min(.05,Math.max(0,(now-last)/1000));last=now;if(sleeping){score+=dt;scoreEl.textContent=score.toFixed(2);sleepVisual((now-sleepStart)/1000)}if(now>=nextAction){if(teacherState==='back')teacherEvent(now);else{tstate('back');schedule()}}raf=requestAnimationFrame(loop)}function down(e){e.preventDefault();if(!running||sleeping)return;if(teacherState==='front')return gameOver();sleeping=true;sleepStart=performance.now();sleepBtn.classList.add('down');sleepVisual(0)}function up(e){if(e)e.preventDefault();if(!running||!sleeping)return;sleeping=false;sleepBtn.classList.remove('down');studentState('wake');clearSleepFx();depthEl.textContent='眠気：起きた！';setTimeout(()=>{if(running&&!sleeping){studentState('normal');depthEl.textContent='眠気：起きてる'}},260)}document.getElementById('startBtn').onclick=startGame;sleepBtn.addEventListener('pointerdown',down);sleepBtn.addEventListener('pointerup',up);sleepBtn.addEventListener('pointercancel',up);window.addEventListener('pointerup',up);loadAssets().then(()=>{ready=true;studentState('normal');tstate('back')}).catch(()=>{statusEl.textContent='素材の読み込みに失敗しました'});</script></body></html>
