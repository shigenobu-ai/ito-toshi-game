<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>居眠り中学💤</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;background:#f5ead7;color:#24304a}body{padding:max(10px,env(safe-area-inset-top)) 10px max(12px,env(safe-area-inset-bottom));touch-action:manipulation}.wrap{width:min(470px,100%);margin:auto}.top{display:flex;justify-content:space-between;align-items:end;margin-bottom:8px}.title{font-size:31px;font-weight:1000;letter-spacing:-2px}.sub{font-size:9px;font-weight:900;color:#73809a}.score{background:#24304a;color:#fff;border:3px solid #fff;border-radius:16px;padding:7px 10px;min-width:108px;text-align:right;box-shadow:0 4px 0 #11192a}.score small{display:block;font-size:8px;color:#bdc7da;font-weight:900}.score b{font-size:22px}.room{position:relative;height:485px;overflow:hidden;border:5px solid #fff;border-radius:24px;background:linear-gradient(#d8efff 0 16%,#eff7fb 16% 61%,#d7b88b 61%);box-shadow:0 8px 0 #9f8563}.board{position:absolute;right:18px;top:20px;width:270px;height:120px;border:9px solid #b77d45;background:#356b52;color:#eaf6da;padding:14px;font-weight:900;line-height:1.5}.teacher{position:absolute;right:92px;top:165px;width:100px;height:145px;transition:transform .2s ease}.teacher.back{transform:rotate(-7deg)}.teacher.look{transform:rotate(9deg) translateX(-25px) scale(1.08)}.teacher.fake{animation:fake .45s ease}@keyframes fake{50%{transform:rotate(3deg) translateX(-10px)}}.head{position:absolute;left:23px;top:0;width:54px;height:54px;border-radius:50%;background:#f1c7a8;border:3px solid #5f493d}.hair{position:absolute;left:18px;top:-4px;width:64px;height:28px;background:#31343c;border-radius:50%}.face{position:absolute;left:35px;top:20px;font-size:20px;z-index:2}.bodyT{position:absolute;left:12px;top:50px;width:76px;height:90px;border-radius:20px;background:#4f72a7;border:3px solid #314a70}.desk{position:absolute;left:30px;right:30px;bottom:72px;height:78px;background:#b57c43;border:5px solid #85582f;border-radius:8px;box-shadow:0 7px 0 #684425}.student{position:absolute;left:50%;bottom:104px;transform:translateX(-50%);width:126px;height:155px;transition:transform .16s ease}.student.sleep{transform:translateX(-50%) rotate(12deg) translateY(18px)}.sHead{position:absolute;left:32px;top:0;width:62px;height:62px;border:4px solid #5b453a;border-radius:50%;background:#f4c9ab;z-index:3}.sHair{position:absolute;left:28px;top:-5px;width:70px;height:31px;background:#2d3038;border-radius:50%;z-index:4}.sFace{position:absolute;left:47px;top:25px;font-size:21px;z-index:5}.sBody{position:absolute;left:17px;top:56px;width:92px;height:94px;border-radius:24px;background:#263f71;border:4px solid #17284d}.zzz{position:absolute;left:58%;bottom:240px;font-size:26px;font-weight:1000;color:#6d65c8;opacity:0}.zzz.on{opacity:1}.status{position:absolute;left:12px;right:12px;bottom:12px;text-align:center;font-size:12px;font-weight:1000}.control{margin-top:11px;height:92px;width:100%;border:4px solid #fff;border-radius:24px;background:linear-gradient(#7e78e7,#625ccc);color:#fff;font-size:20px;font-weight:1000;box-shadow:0 7px 0 #4741a0;touch-action:none}.control.down{transform:translateY(4px);box-shadow:0 3px 0 #4741a0}.hint{text-align:center;font-size:11px;font-weight:800;color:#7b6d5f;margin:8px 0}.home{display:block;text-align:center;text-decoration:none;color:#fff;background:#465268;border:3px solid #fff;border-radius:16px;padding:10px;font-size:11px;font-weight:1000}.overlay{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;padding:22px;background:#2b3148e8}.card{width:min(355px,100%);text-align:center;background:#fff4dd;border:5px solid #fff;border-radius:28px;padding:24px}.card h1{font-size:40px;margin:0 0 8px;color:#574fae}.card p{font-weight:800;line-height:1.65}.card button{position:relative;z-index:10000;width:100%;border:4px solid #fff;border-radius:18px;padding:16px;background:linear-gradient(#8c86ef,#625ccc);color:#fff;font-size:19px;font-weight:1000;box-shadow:0 6px 0 #4741a0;touch-action:manipulation}.result{font-size:31px;font-weight:1000;color:#e2505b;margin:7px 0}</style></head><body><main class="wrap"><div class="top"><div><div class="title">居眠り中学💤</div><div class="sub">SLEEP WITHOUT GETTING CAUGHT</div></div><div class="score"><small>睡眠時間</small><b id="score">0.00</b>s</div></div><section class="room"><div class="board">1時間目　国語<br>先生にバレずに<br>どこまで眠れる？</div><div class="teacher back" id="teacher"><div class="hair"></div><div class="head"></div><div class="face" id="tface">・_・</div><div class="bodyT"></div></div><div class="desk"></div><div class="student" id="student"><div class="sHair"></div><div class="sHead"></div><div class="sFace" id="sface">・ᴗ・</div><div class="sBody"></div></div><div class="zzz" id="zzz">Z<br>z<br>z</div><div class="status" id="status">先生は黒板を見ています</div></section><button class="control" id="sleepBtn">長押しで居眠り 💤</button><div class="hint">押している間だけ寝る / 先生が振り向く前に指を離す</div><a class="home" href="./">ミニゲームパックへ戻る</a></main><div class="overlay" id="overlay"><div class="card"><h1>居眠り中学💤</h1><p>授業中、先生にバレないように居眠りしよう。<br><b>長押し＝寝る　離す＝起きる</b></p><button id="startBtn" type="button">授業開始！</button></div></div><script>const teacher=document.getElementById('teacher'),tface=document.getElementById('tface'),student=document.getElementById('student'),sface=document.getElementById('sface'),zzz=document.getElementById('zzz'),statusEl=document.getElementById('status'),scoreEl=document.getElementById('score'),sleepBtn=document.getElementById('sleepBtn'),overlay=document.getElementById('overlay'),startBtn=document.getElementById('startBtn');let running=false,sleeping=false,score=0,last=0,look=false,raf=0,nextTurn=0,phase='back',dangerStart=0,started=false;function rand(a,b){return a+Math.random()*(b-a)}function setTeacher(p){phase=p;teacher.className='teacher '+p;if(p==='look'){look=true;dangerStart=performance.now();tface.textContent='ಠ_ಠ';statusEl.textContent='先生が見てる！'}else if(p==='fake'){look=false;tface.textContent='・_・';statusEl.textContent='先生が振り向きそう…'}else{look=false;tface.textContent='・_・';statusEl.textContent='先生は黒板を見ています'}}function schedule(){nextTurn=performance.now()+rand(1400,3200)}function begin(e){if(e){e.preventDefault();e.stopPropagation()}if(started&&running)return;started=true;overlay.style.display='none';running=true;sleeping=false;score=0;last=performance.now();scoreEl.textContent='0.00';student.classList.remove('sleep');zzz.classList.remove('on');sleepBtn.classList.remove('down');sface.textContent='・ᴗ・';setTeacher('back');schedule();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}function lose(){if(!running)return;running=false;sleeping=false;started=false;student.classList.remove('sleep');zzz.classList.remove('on');sleepBtn.classList.remove('down');sface.textContent='😱';setTeacher('look');setTimeout(()=>{overlay.innerHTML='<div class="card"><h1>見つかった！</h1><div class="result">'+score.toFixed(2)+' 秒</div><button id="retryBtn" type="button">もう一回</button></div>';overlay.style.display='flex';const r=document.getElementById('retryBtn');r.addEventListener('pointerup',begin);r.addEventListener('click',begin)},250)}function loop(now){if(!running)return;const dt=Math.max(0,Math.min(.05,(now-last)/1000));last=now;if(sleeping){score+=dt;scoreEl.textContent=score.toFixed(2);if(look&&now-dangerStart>90){lose();return}}if(now>=nextTurn){if(phase==='back'){if(Math.random()<.3){setTeacher('fake');nextTurn=now+rand(320,620)}else{setTeacher('look');nextTurn=now+rand(650,1050)}}else{setTeacher('back');schedule()}}raf=requestAnimationFrame(loop)}function down(e){if(e)e.preventDefault();if(!running||sleeping)return;sleeping=true;student.classList.add('sleep');zzz.classList.add('on');sleepBtn.classList.add('down');sface.textContent='−_−';if(look)lose()}function up(e){if(e)e.preventDefault();if(!running||!sleeping)return;sleeping=false;student.classList.remove('sleep');zzz.classList.remove('on');sleepBtn.classList.remove('down');sface.textContent=look?'😳':'・ᴗ・'}startBtn.addEventListener('pointerup',begin);startBtn.addEventListener('click',begin);sleepBtn.addEventListener('pointerdown',down);sleepBtn.addEventListener('pointerup',up);sleepBtn.addEventListener('pointercancel',up);window.addEventListener('pointerup',up);</script></body></html>
