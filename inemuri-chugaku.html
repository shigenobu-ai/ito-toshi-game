<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>居眠り中学💤</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;background:#f5ead7;color:#24304a;overscroll-behavior:none}body{padding:max(10px,env(safe-area-inset-top)) 10px max(12px,env(safe-area-inset-bottom));touch-action:manipulation}.wrap{width:min(470px,100%);margin:auto}.top{display:flex;justify-content:space-between;align-items:end;margin-bottom:8px}.title{font-size:31px;font-weight:1000;letter-spacing:-2px}.sub{font-size:9px;font-weight:900;color:#73809a;letter-spacing:.12em}.score{background:#24304a;color:#fff;border:3px solid #fff;border-radius:16px;padding:7px 10px;min-width:108px;text-align:right;box-shadow:0 4px 0 #11192a}.score small{display:block;font-size:8px;color:#bdc7da;font-weight:900}.score b{font-size:22px}.room{position:relative;height:485px;overflow:hidden;border:5px solid #fff;border-radius:24px;background:linear-gradient(#d8efff 0 16%,#eff7fb 16% 61%,#d7b88b 61%);box-shadow:0 8px 0 #9f8563,0 14px 25px #5c463633}.window{position:absolute;left:18px;top:20px;width:112px;height:92px;border:8px solid #e9d5b6;background:linear-gradient(#7ccfff,#d7f5ff);box-shadow:inset 0 0 0 3px #fff}.window:before,.window:after{content:"";position:absolute;background:#e9d5b6}.window:before{left:45px;top:0;width:8px;height:100%}.window:after{left:0;top:38px;width:100%;height:8px}.board{position:absolute;right:17px;top:18px;width:260px;height:128px;border:9px solid #b77d45;border-radius:4px;background:#356b52;color:#eaf6da;padding:14px 16px;font-weight:900;font-size:15px;line-height:1.5;box-shadow:0 4px 0 #83582f}.clock{position:absolute;right:31px;top:159px;width:54px;height:54px;border:5px solid #fff;border-radius:50%;background:#fff;box-shadow:0 2px 0 #b2bdc7}.clock:before{content:"";position:absolute;left:24px;top:8px;width:3px;height:18px;background:#24304a;transform-origin:bottom;transform:rotate(12deg)}.clock:after{content:"";position:absolute;left:24px;top:25px;width:15px;height:3px;background:#24304a;transform-origin:left;transform:rotate(25deg)}.teacher{position:absolute;right:95px;top:165px;width:95px;height:142px;transform-origin:50% 72%;transition:transform .16s ease}.head{position:absolute;left:22px;top:0;width:52px;height:52px;border-radius:50%;background:#f1c7a8;border:3px solid #5f493d}.hair{position:absolute;left:18px;top:-4px;width:59px;height:27px;background:#31343c;border-radius:45% 55% 35% 40%}.body{position:absolute;left:11px;top:48px;width:74px;height:88px;border-radius:20px 20px 8px 8px;background:#4f72a7;border:3px solid #314a70}.face{position:absolute;left:34px;top:21px;font-size:19px;z-index:2;transform:scaleX(-1)}.teacher.look{transform:rotate(0deg) scaleX(-1)}.teacher.back{transform:rotate(0deg)}.teacher.fake{animation:fake .42s ease}@keyframes fake{50%{transform:rotate(-9deg)}}.desk{position:absolute;left:30px;right:30px;bottom:73px;height:77px;background:#b57c43;border:5px solid #85582f;border-radius:8px;box-shadow:0 7px 0 #684425}.desk:after{content:"";position:absolute;left:25px;right:25px;top:17px;height:5px;background:#d9a56e}.student{position:absolute;left:50%;bottom:104px;transform:translateX(-50%);width:126px;height:155px;transition:transform .18s ease}.sHead{position:absolute;left:32px;top:0;width:62px;height:62px;border:4px solid #5b453a;border-radius:50%;background:#f4c9ab;z-index:3}.sHair{position:absolute;left:28px;top:-5px;width:70px;height:31px;background:#2d3038;border-radius:48% 52% 30% 30%;z-index:4}.sFace{position:absolute;left:47px;top:25px;font-size:21px;z-index:5}.sBody{position:absolute;left:17px;top:56px;width:92px;height:94px;border-radius:24px 24px 8px 8px;background:#263f71;border:4px solid #17284d}.student.sleep{transform:translateX(-50%) rotate(11deg) translateY(17px)}.zzz{position:absolute;left:58%;bottom:240px;font-size:25px;font-weight:1000;color:#6d65c8;opacity:0;transform:rotate(-12deg)}.zzz.on{opacity:1;animation:z 1s infinite ease}@keyframes z{50%{transform:translateY(-7px) rotate(-12deg);opacity:.55}}.warning{position:absolute;left:50%;top:225px;transform:translateX(-50%) scale(.8);font-size:45px;opacity:0;z-index:10}.warning.show{animation:warn .35s ease}@keyframes warn{20%,70%{opacity:1;transform:translateX(-50%) scale(1.18)}100%{opacity:0}}.status{position:absolute;left:12px;bottom:10px;right:12px;text-align:center;font-size:12px;font-weight:1000;color:#34435e}.bar{height:10px;background:#fff8;border-radius:999px;overflow:hidden;margin-top:5px;border:2px solid #fff}.fill{height:100%;width:0;background:#6e65cf}.control{margin-top:11px;height:92px;width:100%;border:4px solid #fff;border-radius:24px;background:linear-gradient(#7e78e7,#625ccc);color:white;font-size:20px;font-weight:1000;box-shadow:0 7px 0 #4741a0;touch-action:none}.control:active,.control.down{transform:translateY(4px);box-shadow:0 3px 0 #4741a0;background:#5852b7}.hint{text-align:center;font-size:11px;font-weight:800;color:#7b6d5f;margin:8px 0}.home{display:block;text-align:center;text-decoration:none;color:#fff;background:#465268;border:3px solid #fff;border-radius:16px;padding:10px;font-size:11px;font-weight:1000}.overlay{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:22px;background:#2b3148dd;backdrop-filter:blur(7px)}.card{width:min(355px,100%);text-align:center;background:#fff4dd;border:5px solid #fff;border-radius:28px;padding:24px;box-shadow:0 12px 30px #1118}.card h1{font-size:40px;margin:0 0 8px;color:#574fae}.card p{font-weight:800;line-height:1.65}.card button{width:100%;border:4px solid #fff;border-radius:18px;padding:14px;background:linear-gradient(#8c86ef,#625ccc);color:#fff;font-size:19px;font-weight:1000;box-shadow:0 6px 0 #4741a0}.result{font-size:31px;font-weight:1000;color:#e2505b;margin:7px 0}</style></head><body><main class="wrap"><div class="top"><div><div class="title">居眠り中学💤</div><div class="sub">SLEEP WITHOUT GETTING CAUGHT</div></div><div class="score"><small>睡眠時間</small><b id="score">0.00</b>s</div></div><section class="room"><div class="window"></div><div class="board">1時間目　国語<br>先生にバレずに<br>どこまで眠れる？</div><div class="clock"></div><div class="teacher back" id="teacher"><div class="hair"></div><div class="head"></div><div class="face" id="tface">・_・</div><div class="body"></div></div><div class="warning" id="warning">⚠️</div><div class="desk"></div><div class="student" id="student"><div class="sHair"></div><div class="sHead"></div><div class="sFace" id="sface">・ᴗ・</div><div class="sBody"></div></div><div class="zzz" id="zzz">Z<br>z<br>z</div><div class="status"><span id="status">先生は黒板を見ています</span><div class="bar"><div class="fill" id="fill"></div></div></div></section><button class="control" id="sleepBtn">長押しで居眠り 💤</button><div class="hint">押している間だけ寝る / 先生が振り向く前に指を離す</div><a class="home" href="./">ミニゲームパックへ戻る</a></main><div class="overlay" id="overlay"><div class="card"><h1>居眠り中学💤</h1><p>授業中、先生にバレないように居眠りしよう。<br><b>長押し＝寝る　離す＝起きる</b><br>先生はフェイントもしてきます。</p><button id="start">授業開始！</button></div></div><script>(()=>{const teacher=document.getElementById('teacher'),tface=document.getElementById('tface'),student=document.getElementById('student'),sface=document.getElementById('sface'),zzz=document.getElementById('zzz'),warning=document.getElementById('warning'),status=document.getElementById('status'),fill=document.getElementById('fill'),scoreEl=document.getElementById('score'),sleepBtn=document.getElementById('sleepBtn'),overlay=document.getElementById('overlay'),start=document.getElementById('start');let running=false,sleeping=false,score=0,last=0,look=false,timer=0,nextTurn=0,phase='back',dangerStart=0;function rand(a,b){return a+Math.random()*(b-a)}function setTeacher(p){phase=p;teacher.classList.remove('look','back','fake');if(p==='look'){teacher.classList.add('look');tface.textContent='ಠ_ಠ';status.textContent='先生が見てる！';look=true;dangerStart=performance.now();warning.classList.remove('show');void warning.offsetWidth;warning.classList.add('show')}else if(p==='fake'){teacher.classList.add('back','fake');tface.textContent='・_・';status.textContent='先生が振り向きそう…';look=false}else{teacher.classList.add('back');tface.textContent='・_・';status.textContent='先生は黒板を見ています';look=false}}function schedule(){nextTurn=performance.now()+rand(1600,3900)}function lose(){if(!running)return;running=false;sleeping=false;student.classList.remove('sleep');zzz.classList.remove('on');sleepBtn.classList.remove('down');sface.textContent='😱';teacher.classList.add('look');status.textContent='バレた！';setTimeout(()=>{overlay.innerHTML='<div class="card"><h1>見つかった！</h1><div class="result">'+score.toFixed(2)+' 秒</div><p>先生に見つからず眠れました。</p><button id="retry">もう一回</button></div>';overlay.style.display='flex';document.getElementById('retry').onclick=begin},350)}function begin(){overlay.style.display='none';running=true;sleeping=false;score=0;last=performance.now();setTeacher('back');student.classList.remove('sleep');zzz.classList.remove('on');sface.textContent='・ᴗ・';scoreEl.textContent='0.00';fill.style.width='0%';schedule();cancelAnimationFrame(timer);timer=requestAnimationFrame(loop)}function loop(now){if(!running)return;const dt=(now-last)/1000;last=now;if(sleeping){score+=dt;scoreEl.textContent=score.toFixed(2);fill.style.width=Math.min(100,(score%10)*10)+'%';if(look&&now-dangerStart>90){lose();return}}if(now>=nextTurn){if(phase==='back'){if(Math.random()<.32){setTeacher('fake');nextTurn=now+rand(300,650)}else{setTeacher('look');nextTurn=now+rand(620,1150)}}else if(phase==='fake'){setTeacher('back');schedule()}else{setTeacher('back');schedule()}}timer=requestAnimationFrame(loop)}function down(e){if(e)e.preventDefault();if(!running)return;sleeping=true;student.classList.add('sleep');zzz.classList.add('on');sleepBtn.classList.add('down');sface.textContent='−_−';if(look){lose()}}function up(e){if(e)e.preventDefault();if(!running)return;sleeping=false;student.classList.remove('sleep');zzz.classList.remove('on');sleepBtn.classList.remove('down');sface.textContent=look?'😳':'・ᴗ・'}sleepBtn.addEventListener('pointerdown',down);window.addEventListener('pointerup',up);window.addEventListener('pointercancel',up);sleepBtn.addEventListener('touchstart',down,{passive:false});window.addEventListener('touchend',up,{passive:false});start.onclick=begin})()</script></body></html>
