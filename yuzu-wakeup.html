<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>ゆずちゃんウェイクアップ</title>
<style>
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;background:#151329;color:#fff}body{min-height:100dvh;padding:max(16px,env(safe-area-inset-top)) 16px max(18px,env(safe-area-inset-bottom));background:radial-gradient(circle at 50% 0,#34305b,#17152d 55%,#0d0c18)}
.wrap{width:min(560px,100%);margin:auto}.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.title{font-size:23px;font-weight:1000}.time{background:#0007;border:1px solid #ffffff1c;border-radius:15px;padding:8px 14px;text-align:center}.time b{font-size:22px;display:block}.time span{font-size:10px;color:#bbb9d3}
.panel{margin-top:15px;background:#211f3b;border:1px solid #ffffff18;border-radius:24px;padding:16px;box-shadow:0 18px 40px #0007}.label{display:flex;justify-content:space-between;font-size:12px;color:#c9c7df}.bar{height:18px;background:#0e0d1b;border-radius:999px;overflow:hidden;margin-top:7px;border:1px solid #ffffff18}.fill{height:100%;width:100%;background:linear-gradient(90deg,#7c6cff,#e184ff);transition:width .22s}
.room{height:390px;margin-top:14px;border-radius:28px;position:relative;overflow:hidden;background:linear-gradient(#28264c 0 62%,#42334c 62%);border:1px solid #ffffff18}.window{position:absolute;left:24px;top:26px;width:118px;height:92px;background:#11152c;border:8px solid #554c70;border-radius:8px}.moon{position:absolute;width:42px;height:42px;border-radius:50%;background:#fff1a6;right:12px;top:10px;box-shadow:0 0 24px #fff1a688}.bed{position:absolute;left:7%;right:7%;bottom:28px;height:165px;background:#b4a3ce;border-radius:30px 30px 18px 18px;box-shadow:0 10px 0 #33293d}.pillow{position:absolute;left:15%;top:20px;width:38%;height:62px;border-radius:50%;background:#eeeaf5;transform:rotate(-5deg)}.yuzu{position:absolute;left:22%;top:34px;width:55%;height:100px;transition:.25s;transform-origin:50% 80%}.head{position:absolute;left:25%;top:0;width:72px;height:72px;border-radius:48% 48% 44% 44%;background:#f2c7b1;border:2px solid #9c7468}.hair{position:absolute;left:-3px;right:-3px;top:-5px;height:40px;background:#252126;border-radius:50% 50% 35% 35%}.hair:after{content:"";position:absolute;left:5px;right:4px;top:21px;height:22px;background:#252126;clip-path:polygon(0 0,18% 60%,32% 8%,47% 65%,61% 10%,76% 62%,100% 0,100% 40%,0 40%)}.eye{position:absolute;top:42px;width:15px;height:3px;background:#4b3634;border-radius:50%}.eye.l{left:15px}.eye.r{right:15px}.mouth{position:absolute;left:50%;top:55px;width:15px;height:6px;transform:translateX(-50%);border-bottom:2px solid #a46767;border-radius:50%}.body{position:absolute;left:9%;right:5%;top:66px;height:55px;background:#dad5e6;border-radius:45% 45% 20% 20%}.awake1 .eye{height:7px;border-radius:50%;background:#33292b}.awake2{transform:rotate(-5deg) translateY(-18px)}.awake2 .eye{height:9px;border-radius:50%;background:#33292b}.awake3{transform:translateY(-55px) rotate(0)}.awake3 .eye{height:10px;background:#33292b;border-radius:50%}.bubble{position:absolute;right:14%;top:46px;background:#fff;color:#332c42;padding:10px 13px;border-radius:16px;font-size:13px;font-weight:800;max-width:170px;opacity:0;transition:.15s}.bubble.show{opacity:1}.bubble:after{content:"";position:absolute;left:16px;bottom:-8px;border:9px solid transparent;border-top-color:#fff;border-bottom:0}
.instruction{text-align:center;margin-top:15px;min-height:54px}.instruction strong{display:block;font-size:21px}.instruction span{font-size:12px;color:#c8c5db}.action{width:100%;margin-top:8px;height:82px;border:0;border-radius:22px;background:#fff;color:#17152d;font-size:22px;font-weight:1000;box-shadow:0 7px 0 #aaa2c8}.action:active{transform:translateY(4px);box-shadow:0 3px 0 #aaa2c8}.meter{height:12px;background:#0c0b17;border-radius:99px;overflow:hidden;margin-top:12px;display:none}.meter.show{display:block}.meterFill{height:100%;width:0;background:linear-gradient(90deg,#72e5b0 0 58%,#ffe66d 58% 78%,#ff6b8b 78%)}.bottom{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.bottom button,.home{padding:13px;border:0;border-radius:15px;font-weight:900;text-align:center;text-decoration:none;font-size:14px}.bottom button{background:#292642;color:#fff}.home{background:#292642;color:#fff}
.overlay{position:fixed;inset:0;background:#0b0a15dc;backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:24px;z-index:10}.card{width:min(370px,100%);padding:27px;background:#211f3b;border:1px solid #ffffff1c;border-radius:27px;text-align:center}.card h1{font-size:31px;margin:0 0 10px}.card p{line-height:1.8;color:#cbc8dc}.card button,.card .home{display:block;width:100%;padding:15px;margin-top:12px;border:0;border-radius:16px;font-size:17px;font-weight:1000;text-decoration:none}.card button{background:#fff;color:#17152d}.card .home{background:#302d4b;color:#fff}.hidden{display:none}
</style></head><body>
<main class="wrap"><div class="top"><div class="title">⏰ ゆずちゃんウェイクアップ</div><div class="time"><b id="time">30.0</b><span>残り秒</span></div></div>
<div class="panel"><div class="label"><span>ねむねむゲージ</span><b id="sleepText">100%</b></div><div class="bar"><div id="fill" class="fill"></div></div></div>
<div class="room"><div class="window"><div class="moon"></div></div><div class="bed"><div class="pillow"></div><div id="yuzu" class="yuzu"><div class="body"></div><div class="head"><div class="hair"></div><div class="eye l"></div><div class="eye r"></div><div class="mouth"></div></div></div></div><div id="bubble" class="bubble">あと5分…</div></div>
<div class="instruction"><strong id="instruction">声をかけよう</strong><span id="hint">タイミングよくタップ</span></div><button id="action" class="action">起きて！</button><div id="meter" class="meter"><div id="meterFill" class="meterFill"></div></div>
<div class="bottom"><button id="restart">やり直す</button><a class="home" href="./">メインへ戻る</a></div></main>
<div id="overlay" class="overlay"><div class="card"><h1>ゆずちゃんウェイクアップ</h1><p>寝起きの悪いゆずちゃんを30秒以内に起こそう。<br><strong>タップと長押し</strong>を使い分けます。<br>焦って連打すると、また寝ます。</p><button id="start">スタート</button><a class="home" href="./">ミニゲームパックへ戻る</a></div></div>
<script>
(()=>{const $=id=>document.getElementById(id),time=$('time'),fill=$('fill'),sleepText=$('sleepText'),inst=$('instruction'),hint=$('hint'),action=$('action'),meter=$('meter'),meterFill=$('meterFill'),yuzu=$('yuzu'),bubble=$('bubble'),overlay=$('overlay');
let running=false,sleep=100,endAt=0,raf=0,step=0,holding=false,holdStart=0,lastTap=0,best=Number(localStorage.getItem('yuzu-best')||0);
const lines=['あと5分…','起きてるって…','……寝てない','今日は休みでしょ…','んー……'];
function say(t){bubble.textContent=t;bubble.classList.add('show');setTimeout(()=>bubble.classList.remove('show'),850)}
function render(){sleep=Math.max(0,Math.min(100,sleep));fill.style.width=sleep+'%';sleepText.textContent=Math.round(sleep)+'%';yuzu.className='yuzu '+(sleep>70?'':sleep>42?'awake1':sleep>18?'awake2':'awake3')}
function next(){step++;meter.classList.remove('show');if(step%3===0){inst.textContent='ゆさゆさする';hint.textContent='長押しして、黄色あたりで離す';action.textContent='長押し';meter.classList.add('show')}else{inst.textContent=step%2?'声をかけよう':'目覚まし！';hint.textContent='合図を見て1回だけタップ';action.textContent=step%2?'ゆず、起きて！':'ピピピピ！'}}
function success(power){sleep-=power;say(sleep<=0?'起きた！':lines[Math.floor(Math.random()*lines.length)]);render();if(sleep<=0){finish(true);return}setTimeout(next,350)}
function fail(){sleep+=5;say('まだ寝る…');render();setTimeout(next,350)}
function tap(){if(!running||step%3===0)return;const now=performance.now();if(now-lastTap<260){lastTap=now;fail();return}lastTap=now;success(10+Math.random()*7)}
action.addEventListener('pointerdown',e=>{e.preventDefault();if(!running)return;if(step%3===0){holding=true;holdStart=performance.now();meterFill.style.width='0%'}else tap()});
action.addEventListener('pointerup',e=>{e.preventDefault();if(!running||!holding)return;holding=false;const d=performance.now()-holdStart,p=Math.min(100,d/13);meterFill.style.width=p+'%';if(d>=760&&d<=1050)success(18);else fail()});
action.addEventListener('pointercancel',()=>holding=false);
function tick(t){if(!running)return;const rem=Math.max(0,endAt-t);time.textContent=(rem/1000).toFixed(1);if(holding){meterFill.style.width=Math.min(100,(t-holdStart)/13)+'%'}if(rem<=0){finish(false);return}raf=requestAnimationFrame(tick)}
function start(){cancelAnimationFrame(raf);running=true;sleep=100;step=0;holding=false;time.textContent='30.0';overlay.classList.add('hidden');render();next();endAt=performance.now()+30000;raf=requestAnimationFrame(tick)}
function finish(win){if(!running)return;running=false;cancelAnimationFrame(raf);const elapsed=((30000-Math.max(0,endAt-performance.now()))/1000).toFixed(1);if(win){best=best?Math.min(best,Number(elapsed)):Number(elapsed);localStorage.setItem('yuzu-best',best)}overlay.innerHTML='<div class="card"><h1>'+(win?'ゆずちゃん、起床。':'二度寝しました')+'</h1><p>'+(win?'起床まで <strong>'+elapsed+'秒</strong><br>ベスト '+best.toFixed(1)+'秒':'ねむねむゲージ '+Math.round(sleep)+'%')+'</p><button id="again">もう一回</button><a class="home" href="./">ミニゲームパックへ戻る</a></div>';overlay.classList.remove('hidden');$('again').onclick=start}
$('start').onclick=start;$('restart').onclick=start;render();
})();
</script></body></html>
