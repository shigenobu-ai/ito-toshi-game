<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Lenia Orbium</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080d12;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif}body{padding:max(8px,env(safe-area-inset-top)) 8px max(8px,env(safe-area-inset-bottom));display:flex;flex-direction:column}.top{display:flex;align-items:center;gap:7px;min-height:42px}.back{color:#cbd6e2;text-decoration:none;font-size:22px;padding:5px 8px}.title{font-size:17px;font-weight:900;flex:1}.stat{font-size:10px;color:#93a5b7}.boardWrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}.board{position:relative;background:#03070a;box-shadow:0 0 0 1px #ffffff18;overflow:hidden;border-radius:14px}.board canvas{display:block;width:100%;height:100%;touch-action:none}.badge{position:absolute;top:10px;left:10px;background:#061019d9;border:1px solid #315068;padding:6px 9px;border-radius:999px;color:#82edff;font-size:10px;pointer-events:none}.controls{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px;padding-top:7px}.controls button{border:1px solid #ffffff18;border-radius:12px;background:#182432;color:#fff;min-height:40px;font-weight:800;font-size:11px}.controls .run{background:#25445d}.sliders{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:6px}.box{background:#121c27;border:1px solid #ffffff12;border-radius:12px;padding:7px 9px}.box label{display:flex;justify-content:space-between;font-size:9px;color:#98aabc}.box output{color:#82edff;font-family:ui-monospace,monospace}.box input{width:100%;accent-color:#7ce9ff}.hint{text-align:center;color:#7f91a4;font-size:9px;padding-top:5px;line-height:1.4}.error{display:none;background:#3a221b;color:#ffd5c0;border:1px solid #8d4b3a;border-radius:12px;padding:10px;font-size:11px;line-height:1.5;margin:6px 0}</style></head><body><div class="top"><a class="back" href="index.html">‹</a><div class="title">Lenia Orbium</div><div class="stat">STEP <b id="gen">0</b></div></div><div id="error" class="error"></div><div class="boardWrap" id="wrap"><div class="board" id="board"><canvas id="c"></canvas><div class="badge" id="badge">GPU Lenia · O2(a)</div></div></div><div class="controls"><button id="reset">原種</button><button class="run" id="run">⏸ 停止</button><button id="step">1 step</button><button id="double">2匹</button></div><div class="sliders"><div class="box"><label><span>速度</span><output id="speedO">10/s</output></label><input id="speed" type="range" min="2" max="30" step="2" value="10"></div><div class="box"><label><span>突然変異</span><output id="mutO">0</output></label><input id="mut" type="range" min="0" max="20" step="1" value="0"></div></div><div class="hint">本家Orbium O2(a) · R=13 · μ=.15 · σ=.017 · Δt=.1<br>何も触らず見ると、形を保ちながら移動します。</div><script>'use strict';const N=64,R=13,DT=.1;const ORB='Å.ÉÍÉ00ÂÂ00Ý/Ä.Ç×ÝÝÑÍÎÏÎÈÓ/Ä.ÎáëíåÑÍÊÌÒÑì/Ã.ÅÌæññäÅ000ÁÏă/Â.ÊÐÐàçåÛÍ00000Ñé/Á.ÈÑÌÅÇÙßßÚ000000đ/Ú0ÏË000Øåëìá00000ÕÐ/.ÆÓÁ000Þïøûø000000ð/.úÒ0000ÓøĄċċð00000ã/.ùÒ00000ĂĒęěĖË0000ÕÆ/Á.í00000ąĜ111ü0000ÑÊ/Á.đ00000î11ġ1ğÚ000ÒÉ/Á.í00000Ø11ēěĠõÍÃÉÔÄ/Â.ç0000Èď1đďĔþÞÑÒÓÀ/Â.ãÉ000ÄõĕĎĉćûæÛ×Ì/Â.ÀÝÆ00ÇãÿąÿûòæÜÒÃ/Ã.É×ÍÉÎÜìôóíçÞÔÇ/Ä.ÇÔÔÕÜãæäàÙÑÈ/Å.ÂÌÒÕ××ÖÑÌÄ/Ç.ÁÅÇÈÆÄÀ';const c=document.getElementById('c'),wrap=document.getElementById('wrap'),board=document.getElementById('board'),err=document.getElementById('error');function fit(){const s=Math.floor(Math.min(wrap.clientWidth,wrap.clientHeight));board.style.width=s+'px';board.style.height=s+'px';const d=Math.min(devicePixelRatio||1,2);c.width=Math.floor(s*d);c.height=Math.floor(s*d)}fit();addEventListener('resize',fit);const gl=c.getContext('webgl2',{antialias:false,preserveDrawingBuffer:false});if(!gl){err.style.display='block';err.textContent='この端末ではWebGL2を開始できません。Safariで開いてください。';throw new Error('WebGL2 unavailable')}if(!gl.getExtension('EXT_color_buffer_float')){err.style.display='block';err.textContent='GPU浮動小数点描画に対応していません。Safariで開いてください。';throw new Error('float render unavailable')}function sh(t,s){const x=gl.createShader(t);gl.shaderSource(x,s);gl.compileShader(x);if(!gl.getShaderParameter(x,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(x));return x}function prog(v,f){const p=gl.createProgram();gl.attachShader(p,sh(gl.VERTEX_SHADER,v));gl.attachShader(p,sh(gl.FRAGMENT_SHADER,f));gl.linkProgram(p);if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(p));return p}const VS=`#version 300 es
in vec2 a;out vec2 uv;void main(){uv=a*.5+.5;gl_Position=vec4(a,0,1);}`;const FS=`#version 300 es
precision highp float;uniform sampler2D st;uniform float mu;uniform float sig;in vec2 uv;out vec4 outc;void main(){float u=0.0;float sum=0.0;for(int dy=-13;dy<=13;dy++){for(int dx=-13;dx<=13;dx++){float rr=length(vec2(float(dx),float(dy)))/13.0;if(rr>0.0&&rr<1.0){float w=exp(4.0-4.0/(4.0*rr*(1.0-rr)));u+=texture(st,fract(uv+vec2(float(dx),float(dy))/64.0)).r*w;sum+=w;}}}u/=sum;float d=u-mu;float g=2.0*exp(-(d*d)/(2.0*sig*sig))-1.0;float v=texture(st,uv).r;outc=vec4(clamp(v+.1*g,0.0,1.0),0,0,1);}`;const DS=`#version 300 es
precision highp float;uniform sampler2D st;in vec2 uv;out vec4 outc;void main(){float v=texture(st,uv).r;float t=pow(v,.62);vec3 col=mix(vec3(.004,.01,.018),vec3(.15,.95,1.0),t);col+=vec3(.12,.08,0)*v*v;outc=vec4(col,1);}`;const up=prog(VS,FS),dp=prog(VS,DS),vao=gl.createVertexArray();gl.bindVertexArray(vao);const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);function bind(p){const l=gl.getAttribLocation(p,'a');gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.enableVertexAttribArray(l);gl.vertexAttribPointer(l,2,gl.FLOAT,false,0,0)}function tex(){const t=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,t);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.NEAREST);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.NEAREST);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.REPEAT);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.REPEAT);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA32F,N,N,0,gl.RGBA,gl.FLOAT,null);return t}let a=tex(),bb=tex();const fb=gl.createFramebuffer();function dec(){const fz=x=>x==='0'?0:x==='1'?100:x.charCodeAt(0)-191,fr=s=>s===''?1:s.length===1?fz(s):fz(s[0])*100+fz(s[1]);let rows=[],w=0;for(let row of ORB.split('/')){let lead=0,d=row.indexOf('.');if(d>=0){lead=fr(row.slice(0,d));row=row.slice(d+1)}let q=new Array(lead).fill(0);for(const ch of row)q.push(fz(ch)/100);rows.push(q);w=Math.max(w,q.length)}return{rows,w,h:rows.length}}const orb=dec();function seed(two=false){const data=new Float32Array(N*N*4);function put(cx,cy,mirror=false){let ox=Math.round(cx-orb.w/2),oy=Math.round(cy-orb.h/2);for(let y=0;y<orb.h;y++)for(let x=0;x<orb.rows[y].length;x++){let sx=mirror?orb.rows[y].length-1-x:x,v=orb.rows[y][sx]||0;if(!v)continue;let px=(ox+x+N)%N,py=(oy+y+N)%N,i=(py*N+px)*4;data[i]=Math.max(data[i],v);data[i+3]=1}}if(two){put(20,32);put(45,32,true)}else put(32,32);gl.bindTexture(gl.TEXTURE_2D,a);gl.texSubImage2D(gl.TEXTURE_2D,0,0,0,N,N,gl.RGBA,gl.FLOAT,data);gl.bindTexture(gl.TEXTURE_2D,bb);gl.texSubImage2D(gl.TEXTURE_2D,0,0,0,N,N,gl.RGBA,gl.FLOAT,new Float32Array(N*N*4));gen=0}function one(){gl.viewport(0,0,N,N);gl.bindFramebuffer(gl.FRAMEBUFFER,fb);gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,bb,0);gl.useProgram(up);bind(up);gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,a);gl.uniform1i(gl.getUniformLocation(up,'st'),0);const m=+document.getElementById('mut').value;gl.uniform1f(gl.getUniformLocation(up,'mu'),.15+m*.0005);gl.uniform1f(gl.getUniformLocation(up,'sig'),.017+m*.00008);gl.drawArrays(gl.TRIANGLE_STRIP,0,4);[a,bb]=[bb,a];gen++}function draw(){gl.bindFramebuffer(gl.FRAMEBUFFER,null);gl.viewport(0,0,c.width,c.height);gl.useProgram(dp);bind(dp);gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,a);gl.uniform1i(gl.getUniformLocation(dp,'st'),0);gl.drawArrays(gl.TRIANGLE_STRIP,0,4);document.getElementById('gen').textContent=gen}let running=true,gen=0,acc=0,last=performance.now();function loop(now){const dt=Math.min(250,now-last);last=now;if(running){acc+=dt*(+document.getElementById('speed').value)/1000;let guard=0;while(acc>=1&&guard<3){one();acc--;guard++}}draw();requestAnimationFrame(loop)}document.getElementById('run').onclick=()=>{running=!running;document.getElementById('run').textContent=running?'⏸ 停止':'▶ 再生'};document.getElementById('step').onclick=()=>{one();draw()};document.getElementById('reset').onclick=()=>{document.getElementById('mut').value=0;document.getElementById('mutO').textContent='0';seed(false)};document.getElementById('double').onclick=()=>seed(true);document.getElementById('speed').oninput=e=>document.getElementById('speedO').textContent=e.target.value+'/s';document.getElementById('mut').oninput=e=>document.getElementById('mutO').textContent=e.target.value;seed();requestAnimationFrame(loop);</script></body></html>
