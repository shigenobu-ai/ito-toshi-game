*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;color:#fff;background:linear-gradient(180deg,#67ceff 0%,#8b79ff 45%,#4937a8 100%);overscroll-behavior:none}body{padding:max(10px,env(safe-area-inset-top)) 10px max(12px,env(safe-area-inset-bottom));touch-action:manipulation}.wrap{width:min(460px,100%);margin:auto;display:flex;flex-direction:column;gap:9px}.header{display:flex;align-items:center;justify-content:space-between;gap:8px}.logo{font-size:28px;font-weight:1000;letter-spacing:-2px;text-shadow:0 3px 0 #51339b,0 5px 10px #25185d88}.logo span:nth-child(1){color:#ff5778}.logo span:nth-child(2){color:#ffd842}.logo span:nth-child(3){color:#55e17d}.logo span:nth-child(4){color:#65cfff}.scorebox{min-width:110px;border:3px solid #fff;background:#31216dcc;border-radius:18px;padding:6px 11px;text-align:right;box-shadow:0 4px 0 #211553}.scorebox small{display:block;font-size:9px;color:#dcd8ff;font-weight:900}.scorebox b{font-size:22px}.gameRow{display:grid;grid-template-columns:minmax(0,1fr) 94px;gap:8px;align-items:start}.stageShell{padding:7px;background:linear-gradient(180deg,#efeaff,#b9abff);border:4px solid #fff;border-radius:24px;box-shadow:0 7px 0 #35216f,0 12px 20px #24155866}.stage{position:relative;width:100%;aspect-ratio:6/12;background:#101344;border-radius:15px;overflow:hidden;border:3px solid #6555bd;touch-action:none}canvas{display:block;width:100%;height:100%;touch-action:none}.chain{position:absolute;left:0;right:0;top:42%;text-align:center;font-size:34px;font-weight:1000;color:#fff76a;text-shadow:0 3px 0 #f05b74,0 6px 12px #000;pointer-events:none;opacity:0}.chain.show{animation:chainPop .7s ease}@keyframes chainPop{0%{opacity:0;transform:scale(.4) rotate(-8deg)}28%{opacity:1;transform:scale(1.25) rotate(4deg)}70%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.1)}}.side{display:flex;flex-direction:column;gap:7px}.panel{border:3px solid #fff;border-radius:17px;background:#332274dd;padding:7px;text-align:center;box-shadow:0 5px 0 #241553}.panelTitle{font-size:10px;font-weight:900;color:#d9d4ff;margin-bottom:4px}.nextCanvas{width:66px;height:86px;margin:auto;background:#171747;border-radius:11px;border:2px solid #6f62c6}.chainStat{font-size:10px;font-weight:900}.chainStat strong{display:block;font-size:22px;color:#fff56d}.hero{position:relative;height:154px;overflow:hidden;padding:5px 3px 0;background:linear-gradient(180deg,#fff7,#ffffff18)}.speech{position:absolute;z-index:3;top:5px;left:5px;right:5px;background:#fff;color:#5a388b;border:2px solid #6a4bb0;border-radius:13px;padding:5px 3px;font-size:9px;font-weight:900;line-height:1.2}.girl{position:absolute;left:50%;bottom:-3px;width:75px;height:118px;transform:translateX(-50%);transform-origin:50% 100%}.girl .hairBack{position:absolute;left:10px;top:18px;width:56px;height:70px;background:#5b2ea9;border-radius:28px 28px 22px 22px}.girl .head{position:absolute;left:17px;top:20px;width:43px;height:45px;background:#ffd7bd;border-radius:48% 48% 45% 45%;z-index:2}.girl .bang{position:absolute;left:14px;top:12px;width:48px;height:27px;background:#713ac0;border-radius:30px 30px 14px 16px;z-index:3;transform:rotate(-4deg)}.girl .eye{position:absolute;top:38px;width:7px;height:9px;background:#38275d;border-radius:50%;z-index:4}.girl .eye.l{left:27px}.girl .eye.r{right:22px}.girl .mouth{position:absolute;left:34px;top:53px;width:10px;height:5px;border-bottom:2px solid #b75365;border-radius:50%;z-index:4}.girl .body{position:absolute;left:18px;top:62px;width:42px;height:50px;background:linear-gradient(180deg,#ff79b9,#8e5be8);clip-path:polygon(20% 0,80% 0,100% 100%,0 100%);z-index:2}.girl .bow{position:absolute;left:28px;top:67px;width:23px;height:14px;background:#fff36a;clip-path:polygon(0 20%,45% 50%,0 80%,0 0,45% 50%,100% 0,100% 80%,55% 50%);z-index:4}.girl .arm{position:absolute;top:70px;width:13px;height:44px;background:#ffd7bd;border-radius:9px;z-index:1}.girl .arm.l{left:11px;transform:rotate(16deg)}.girl .arm.r{right:10px;transform:rotate(-16deg)}.star{position:absolute;font-size:16px;opacity:0;pointer-events:none}.hero.cheer .girl{animation:bounce .45s ease}.hero.cheer .girl .arm.r{transform:rotate(-105deg);transform-origin:50% 10%}.hero.magic .girl{animation:jump .65s ease}.hero.magic .star{animation:spark .75s ease}.hero.magic .s1{left:8px;top:58px}.hero.magic .s2{right:5px;top:80px;animation-delay:.08s}.hero.magic .s3{left:21px;top:105px;animation-delay:.14s}@keyframes bounce{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) translateY(-9px) scale(1.04)}}@keyframes jump{0%,100%{transform:translateX(-50%) translateY(0)}40%{transform:translateX(-50%) translateY(-22px) rotate(-4deg)}}@keyframes spark{0%{opacity:0;transform:scale(.3) rotate(0)}40%{opacity:1;transform:scale(1.35) rotate(80deg)}100%{opacity:0;transform:scale(.5) rotate(160deg)}}.controls{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.controls button{height:58px;border:3px solid #fff;border-radius:18px;background:linear-gradient(180deg,#fff,#dce7ff);color:#3b2a78;font-size:27px;font-weight:1000;box-shadow:0 5px 0 #503b9c;touch-action:none}.controls button:active,.controls button.pressed{transform:translateY(3px);box-shadow:0 2px 0 #503b9c;background:#fff7a7}.controls .wide{grid-column:span 2;font-size:16px}.controls .drop{font-size:15px;background:linear-gradient(180deg,#fff9ad,#ffd95f)}.hint{text-align:center;font-size:11px;font-weight:800;color:#eef0ff}.home{display:block;text-align:center;text-decoration:none;color:#fff;background:#30206caa;border:2px solid #ffffff80;border-radius:15px;padding:10px;font-size:13px;font-weight:900}.overlay{position:fixed;inset:0;background:#34216eea;backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;padding:24px;z-index:10}.card{width:min(360px,100%);background:linear-gradient(180deg,#7164d7,#3a276f);border:4px solid #fff;border-radius:28px;padding:24px;text-align:center;box-shadow:0 10px 30px #160c42}.card h1{font-size:44px;margin:0 0 7px;color:#fff46e;text-shadow:0 4px 0 #d75391}.card p{line-height:1.7;color:#f2efff}.card button{width:100%;border:0;border-radius:18px;padding:15px;font-size:19px;font-weight:1000;color:#43307f;background:#fff56e;box-shadow:0 5px 0 #d6a91d}.card .home{margin-top:12px}
</style></head><body><div class="wrap"><div class="header"><div class="logo"><span>ぽ</span><span>よ</span><span>ぽ</span><span>よ</span></div><div class="scorebox"><small>SCORE</small><b id="score">0</b></div></div><div class="gameRow"><div class="stageShell"><div class="stage" id="stage"><canvas id="game" width="300" height="600"></canvas><div id="chain" class="chain"></div></div></div><div class="side"><div class="panel"><div class="panelTitle">NEXT</div><canvas id="next" class="nextCanvas" width="66" height="86"></canvas></div><div class="panel chainStat">CHAIN<strong id="chainCount">0</strong></div><div class="panel hero" id="hero"><div class="speech" id="speech">いくよ！</div><div class="girl"><div class="hairBack"></div><div class="head"></div><div class="bang"></div><div class="eye l"></div><div class="eye r"></div><div class="mouth"></div><div class="body"></div><div class="bow"></div><div class="arm l"></div><div class="arm r"></div></div><div class="star s1">★</div><div class="star s2">✦</div><div class="star s3">★</div></div></div></div><div class="controls"><button type="button" data-act="left">◀</button><button type="button" data-act="rotate">↻</button><button type="button" data-act="right">▶</button><button type="button" class="wide" data-act="down">▼ はやく落とす</button><button type="button" class="drop" data-act="hard">一気に落下</button></div><div class="hint">ボタン / 左右スワイプ / 盤面タップで回転</div><a class="home" href="./">ミニゲームパックへ戻る</a></div><div id="overlay" class="overlay"><div class="card"><h1>ぽよぽよ</h1><p>2個1組のぽよを動かして、<strong>同じ色を4個以上</strong>つなげよう。<br>連鎖するとポヨナも大喜び！</p><button id="start" type="button">スタート！</button><a class="home" href="./">ミニゲームパックへ戻る</a></div></div><script>
(()=>{const C=6,R=12,S=50,canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),nextCanvas=document.getElementById('next'),nctx=nextCanvas.getContext('2d'),scoreEl=document.getElementById('score'),chainEl=document.getElementById('chain'),chainCount=document.getElementById('chainCount'),overlay=document.getElementById('overlay'),stage=document.getElementById('stage'),hero=document.getElementById('hero'),speech=document.getElementById('speech');const colors=['#f24f70','#55d76f','#4ca9f5','#ffd748','#b86af2'];let board,active,nextPair,score=0,running=false,last=0,acc=0,dropMs=650,raf=0,resolving=false,gesture=null,holdTimer=null,repeatTimer=null;function empty(){return Array.from({length:R},()=>Array(C).fill(null))}function rnd(){return Math.floor(Math.random()*colors.length)}function pair(){return{a:rnd(),b:rnd()}}function cells(x,y,rot,p=active){const d=[[0,-1],[1,0],[0,1],[-1,0]][rot];return[{x,y,c:p.a},{x:x+d[0],y:y+d[1],c:p.b}]}function can(x,y,rot){return cells(x,y,rot).every(p=>p.x>=0&&p.x<C&&p.y<R&&(p.y<0||board[p.y][p.x]==null))}function spawn(){const p=nextPair||pair();nextPair=pair();active={x:2,y:1,rot:0,a:p.a,b:p.b};drawNext();speech.textContent='いくよ！';if(!can(active.x,active.y,active.rot)){end();return false}return true}function move(dx,dy){if(!running||resolving||!active)return false;if(can(active.x+dx,active.y+dy,active.rot)){active.x+=dx;active.y+=dy;acc=0;draw();return true}if(dy>0)lock();return false}function rotate(){if(!running||resolving||!active)return;for(const k of [0,-1,1,-2,2]){const nr=(active.rot+1)%4;if(can(active.x+k,active.y,nr)){active.x+=k;active.rot=nr;acc=0;react('cheer','くるん！');draw();return}}}function hard(){if(!running||resolving||!active)return;while(can(active.x,active.y+1,active.rot))active.y++;draw();lock()}function lock(){if(!active)return;for(const p of cells(active.x,active.y,active.rot)){if(p.y<0){end();return}board[p.y][p.x]=p.c}active=null;resolve()}function groups(){const seen=empty().map(r=>r.map(()=>false)),out=[];for(let y=0;y<R;y++)for(let x=0;x<C;x++){if(board[y][x]==null||seen[y][x])continue;const col=board[y][x],q=[[x,y]],g=[];seen[y][x]=true;while(q.length){const [cx,cy]=q.pop();g.push([cx,cy]);for(const[dX,dY]of[[1,0],[-1,0],[0,1],[0,-1]]){const nx=cx+dX,ny=cy+dY;if(nx>=0&&nx<C&&ny>=0&&ny<R&&!seen[ny][nx]&&board[ny][nx]===col){seen[ny][nx]=true;q.push([nx,ny])}}}if(g.length>=4)out.push(g)}return out}function gravity(){for(let x=0;x<C;x++){let w=R-1;for(let y=R-1;y>=0;y--)if(board[y][x]!=null){const v=board[y][x];board[y][x]=null;board[w--][x]=v}}}function sleep(ms){return new Promise(r=>setTimeout(r,ms))}function react(kind,text){speech.textContent=text;hero.classList.remove('cheer','magic');void hero.offsetWidth;hero.classList.add(kind);setTimeout(()=>hero.classList.remove(kind),760)}function showChain(n){chainCount.textContent=n;chainEl.textContent=n+'れんさ！';chainEl.classList.remove('show');void chainEl.offsetWidth;chainEl.classList.add('show');react(n>=2?'magic':'cheer',n>=4?'すごーい！！':n>=2?n+'れんさ！':'やった！')}async function resolve(){resolving=true;let ch=0;while(running){const gs=groups();if(!gs.length)break;ch++;showChain(ch);await sleep(150);let removed=0;for(const g of gs)for(const[x,y]of g){board[y][x]=null;removed++}score+=removed*10*ch*ch;scoreEl.textContent=score;draw();navigator.vibrate?.(20);await sleep(180);gravity();draw();await sleep(150)}resolving=false;if(running){spawn();draw()}}function start(){board=empty();active=null;nextPair=pair();score=0;scoreEl.textContent='0';chainCount.textContent='0';running=true;resolving=false;overlay.style.display='none';spawn();last=performance.now();acc=0;cancelAnimationFrame(raf);raf=requestAnimationFrame(loop);draw()}function end(){running=false;cancelAnimationFrame(raf);react('cheer','また遊ぼ！');const best=Math.max(score,Number(localStorage.getItem('poyopoyo-best')||0));localStorage.setItem('poyopoyo-best',best);overlay.innerHTML=`<div class="card"><h1>${score}点</h1><p>ゲームオーバー<br>ベスト <strong>${best}点</strong></p><button id="again">もう一回！</button><a class="home" href="./">ミニゲームパックへ戻る</a></div>`;overlay.style.display='flex';document.getElementById('again').onclick=start}function loop(t){if(!running)return;const dt=Math.min(100,t-last);last=t;if(!resolving&&active){acc+=dt;if(acc>=dropMs){acc=0;move(0,1)}}raf=requestAnimationFrame(loop)}function shade(hex,a){let n=parseInt(hex.slice(1),16),r=(n>>16)+255*a,g=((n>>8)&255)+255*a,b=(n&255)+255*a;return'#'+[r,g,b].map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('')}function blob(c,x,y,r,col,alpha=1,face=true){c.save();c.globalAlpha=alpha;const g=c.createRadialGradient(x-r*.35,y-r*.4,r*.08,x,y,r);g.addColorStop(0,'#fff');g.addColorStop(.17,colors[col]);g.addColorStop(1,shade(colors[col],-.25));c.fillStyle=g;c.beginPath();c.arc(x,y,r,0,Math.PI*2);c.fill();c.strokeStyle='#ffffffb8';c.lineWidth=2;c.stroke();if(face){c.fillStyle='#fff';for(const ex of[x-r*.22,x+r*.22]){c.beginPath();c.ellipse(ex,y-r*.02,r*.15,r*.2,0,0,Math.PI*2);c.fill()}c.fillStyle='#29204e';for(const ex of[x-r*.2,x+r*.2]){c.beginPath();c.arc(ex,y,r*.065,0,Math.PI*2);c.fill()}c.strokeStyle='#743758';c.lineWidth=1.6;c.beginPath();c.arc(x,y+r*.24,r*.13,.1*Math.PI,.9*Math.PI);c.stroke()}c.restore()}function bridge(c,x1,y1,x2,y2,r,col,alpha=1){c.save();c.globalAlpha=alpha;c.fillStyle=colors[col];c.beginPath();if(x1===x2)c.roundRect(x1-r*.62,Math.min(y1,y2),r*1.24,Math.abs(y2-y1),r*.35);else c.roundRect(Math.min(x1,x2),y1-r*.62,Math.abs(x2-x1),r*1.24,r*.35);c.fill();c.restore()}function drawBoardLinks(){for(let y=0;y<R;y++)for(let x=0;x<C;x++){const col=board[y][x];if(col==null)continue;const cx=x*S+25,cy=y*S+25;if(x+1<C&&board[y][x+1]===col)bridge(ctx,cx,cy,cx+S,cy,21,col);if(y+1<R&&board[y+1][x]===col)bridge(ctx,cx,cy,cx,cy+S,21,col)}}function draw(){ctx.clearRect(0,0,300,600);const bg=ctx.createLinearGradient(0,0,0,600);bg.addColorStop(0,'#20215d');bg.addColorStop(1,'#090b31');ctx.fillStyle=bg;ctx.fillRect(0,0,300,600);drawBoardLinks();for(let y=0;y<R;y++)for(let x=0;x<C;x++)if(board[y][x]!=null)blob(ctx,x*S+25,y*S+25,22,board[y][x]);if(active&&running&&!resolving){let gy=active.y;while(can(active.x,gy+1,active.rot))gy++;for(const p of cells(active.x,gy,active.rot))if(p.y>=0)blob(ctx,p.x*S+25,p.y*S+25,20,p.c,.18,false);const ac=cells(active.x,active.y,active.rot);if(ac[0].c===ac[1].c&&ac[0].y>=0&&ac[1].y>=0)bridge(ctx,ac[0].x*S+25,ac[0].y*S+25,ac[1].x*S+25,ac[1].y*S+25,21,ac[0].c);for(const p of ac)if(p.y>=0)blob(ctx,p.x*S+25,p.y*S+25,22,p.c)}}function drawNext(){nctx.clearRect(0,0,66,86);nctx.fillStyle='#171747';nctx.fillRect(0,0,66,86);if(nextPair){if(nextPair.a===nextPair.b)bridge(nctx,33,56,33,28,17,nextPair.a);blob(nctx,33,57,17,nextPair.a);blob(nctx,33,28,17,nextPair.b)}}function act(a){if(a==='left')move(-1,0);else if(a==='right')move(1,0);else if(a==='rotate')rotate();else if(a==='down')move(0,1);else hard()}function stopRepeat(){clearTimeout(holdTimer);clearInterval(repeatTimer);holdTimer=repeatTimer=null;document.querySelectorAll('.pressed').forEach(b=>b.classList.remove('pressed'))}document.querySelectorAll('[data-act]').forEach(b=>{const a=b.dataset.act;b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture?.(e.pointerId);b.classList.add('pressed');act(a);if(a==='left'||a==='right'||a==='down')holdTimer=setTimeout(()=>repeatTimer=setInterval(()=>act(a),a==='down'?55:95),220)});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>b.addEventListener(ev,stopRepeat))});stage.addEventListener('pointerdown',e=>{gesture={x:e.clientX,y:e.clientY,id:e.pointerId};stage.setPointerCapture?.(e.pointerId);e.preventDefault()});stage.addEventListener('pointerup',e=>{if(!gesture)return;const dx=e.clientX-gesture.x,dy=e.clientY-gesture.y;if(Math.abs(dx)>28&&Math.abs(dx)>Math.abs(dy))act(dx>0?'right':'left');else if(dy>34)act('down');else act('rotate');gesture=null;e.preventDefault()});document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')act('left');if(e.key==='ArrowRight')act('right');if(e.key==='ArrowDown')act('down');if(e.key==='ArrowUp'||e.key===' ')act('rotate')});document.addEventListener('touchmove',e=>{if(e.target.closest?.('.stage,.controls'))e.preventDefault()},{passive:false});document.getElementById('start').onclick=start;board=empty();draw();drawNext()})();
</script></body></html>
